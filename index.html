p the flow"], "a": 2, "e": "Follow shut-in procedures, record pressures and pit gain, then notify the supervisor."}, {"n": 194, "c": "B", "q": "What is the main function of a \u201cweep hole\u201d on a ram bonnet?", "o": ["Indicate a leak on the piston rod mud seal", "Show that the gasket on the bonnet is leaking", "Prevent contamination of the closing chamber", "Release trapped pressure during BOP testing"], "a": 0, "e": "A weep hole indicates a leak on the piston rod mud seal."}, {"n": 195, "c": "K", "q": "While tripping out of the hole, improper hole fill is noted. After pulling five stands, the hole has taken no fluid from the trip tank. It should have taken three barrels. What action should be taken?", "o": ["Perform a flow check immediately and shut in if required", "Close the diverter and line up to the degasser", "Pull five more stands and re-evaluate the situation", "Connect Kelly or Top Drive and circulate bottoms-up"], "a": 0, "e": "Improper hole fill: do a flow check immediately and shut in if required."}, {"n": 196, "c": "W", "q": "When running in the hole with casing, what is a benefit of routine fill-ups?", "o": ["To minimize surge pressure when running in", "To reduce Hook Load and wear on the drilling line", "To prevent casing burst due to high internal pressure", "To provide hydrostatic support to the casing and related components"], "a": 3, "e": "Fill-ups give hydrostatic support to the casing and related components."}, {"n": 197, "c": "M", "q": "As a gas kick is being circulated up the casing, what will normally happen to the surface pit volume?", "o": ["Decrease", "Stay the same", "Increase"], "a": 2, "e": "Gas expands as it rises, so surface pit volume increases."}, {"n": 198, "c": "B", "q": "There is one inside BOP with an NC38 pin/box connection. The drill string consists of: 3-1/2 inch drill pipe (NC38). 4-3/4 inch drill collars (NC35). Which of the following crossovers must be on the rig floor while tripping?", "o": ["NC38 box x NC50 pin", "NC46 box x NC35 pin", "NC46 box x NC38 pin", "NC38 box x NC35 pin"], "a": 3, "e": "Inside BOP is NC38, drill collars NC35: NC38 box x NC35 pin.", "f": {"s": "There is one inside BOP with an NC38 pin/box connection. The drill string consists of:", "dt": [["Drill pipe", "3-1/2 inch (NC38)"], ["Drill collars", "4-3/4 inch (NC35)"]], "ask": "Which of the following crossovers must be on the rig floor while tripping?"}}, {"n": 199, "c": "S", "q": "Why should the well be shut in quickly after a kick has been detected?", "o": ["To minimize the size of the influx.", "To minimize kill mud weight required.", "To minimize the Shut In Drill Pipe Pressure (SIDPP).", "To reduce the migration speed of the influx."], "a": 0, "e": "Shut in quickly to minimise the size of the influx."}, {"n": 200, "c": "B", "q": "When a BOP ram on a surface stack is closed, what happens to the operating fluid displaced from the opening chamber?", "o": ["The fluid is discharged to the cellar", "The fluid is returned to the unit reservoir", "The fluid is used to boost closing pressure", "The fluid drains into the well bore"], "a": 1, "e": "Displaced fluid returns to the unit reservoir."}, {"n": 201, "c": "B", "q": "Why can a pressure build-up in the Mud Gas Separator be dangerous?", "o": ["Will affect Drill Pipe pressure", "Will increase risk of lost circulation", "May force gas to enter shale shaker area", "Will allow gas to be blown along the Vent Line"], "a": 2, "e": "Pressure build-up in the MGS can push gas into the shale shaker area."}, {"n": 202, "c": "K", "q": "If total losses occurred while drilling with water-based mud, what should be done?", "o": ["Stop drilling, fill the annulus from the top with water, and monitor", "Pump lost circulation material immediately", "Stop drilling, shut the well in, and monitor", "Drill blind"], "a": 0, "e": "For total losses with water-based mud, stop drilling, fill the annulus from the top with water and monitor."}, {"n": 203, "c": "M", "q": "While circulating out an influx, no increase in casing pressure or pit volume is observed. What could potentially be occurring?", "o": ["Pumps are failing", "A liquid influx is in the well", "This is a normal occurrence with a gas influx", "Choke is washing out"], "a": 1, "e": "No casing pressure or pit gain increase points to a liquid influx."}, {"n": 204, "c": "S", "q": "What best describes the effect of gas migration on shut-in drill pipe pressure (no float valve in the drill string)?", "o": ["Stay the same", "Decrease", "Increase"], "a": 2, "e": "With no float, gas migration increases SIDPP."}, {"n": 205, "c": "M", "q": "When should the Volumetric Method be utilized?", "o": ["When gas is at surface, the SICP is stabilized, and circulation cannot be established below the influx", "When gas is migrating, and circulation cannot be established below the influx", "When casing pressure is close to MAASP and there is a risk of losing circulation", "When circulation can be established below the influx"], "a": 0, "e": "Keyed answer a: used when circulation cannot be established below the influx."}, {"n": 206, "c": "M", "q": "While controlling a well by circulating out an influx, what pressure is kept constant?", "o": ["Accumulator pressure", "Casing pressure", "Bottom hole pressure", "Casing shoe pressure"], "a": 2, "e": "While circulating out an influx, bottom hole pressure is kept constant."}, {"n": 207, "c": "K", "q": "The well has been losing mud while drilling the last stand. At the connection, the well continues to flow after the pumps have been switched off. Ballooning is suspected. What is the first action the Driller should take?", "o": ["Immediately start pumping to restore BHP", "Bleed 5 bbls back to trip tank and check if flowback rate reduces", "Make connection, return to drilling and add LCM to the mud", "Shut the well in"], "a": 3, "e": "Ballooning is suspected but the safest first action is to shut the well in."}, {"n": 208, "c": "M", "q": "When bringing the pumps up to kill speed the casing pressure is allowed to increase above Shut In Casing Pressure, what will happen to bottom hole pressure?", "o": ["No change to downhole pressure", "Bottom hole pressure would decrease and possibly cause more influx to enter the wellbore", "Bottom hole pressure would increase and may exceed formation fracture"], "a": 2, "e": "If casing pressure rises above SICP during start-up, BHP increases and may exceed fracture pressure."}, {"n": 209, "c": "W", "q": "During the casing run, hole trouble is encountered and the string cannot be lowered. The decision has been made to pull the casing. It has been advised to go slow and watch the fill-up volumes as the casing string is pulled out. What is the reason for this?", "o": ["Potential swabbing due to tight wellbore-to-casing geometry", "Potential damage to the casing string and cost to the Operator", "Potential down time for not being ready to trip back in the hole", "Both B and C"], "a": 0, "e": "Pulling casing through tight clearance can swab the well."}, {"n": 210, "c": "K", "q": "Which of the following might reduce an increasing connection gas trend?", "o": ["Pull out of hole and change the Bit", "Increase the mud viscosity", "Increase mud weight by a small amount", "Reduce mud weight by a small amount"], "a": 2, "e": "Raising mud weight slightly reduces an increasing connection gas trend."}, {"n": 211, "c": "W", "q": "Which one of the following is NOT classified as a barrier?", "o": ["Drill String Float Valve", "Full Opening Safety Valve", "Mud hydrostatic pressure", "Pipe Ram"], "a": 0, "e": "A drill string float valve is not classified as a barrier."}, {"n": 212, "c": "P", "q": "Hydrostatic Pressure is:", "o": ["The measured depth of a stationary column of fluid", "The viscosity of a stationary column of fluid", "The pressure applied from Annular Pressure Loss", "The pressure exerted by a column of fluid at rest"], "a": 3, "e": "Hydrostatic pressure is the pressure exerted by a column of fluid at rest."}, {"n": 213, "c": "K", "q": "While making a connection, the Driller closed the well in due to an abnormally long flowback time. The stabilized surface pressures were equal at 150 psi on the Drill Pipe and Casing gauges. Ballooning is suspected. Attempts to bleed off are inconclusive. What action should be taken?", "o": ["Open the BOP and observe the flow line for a decrease in flow", "Circulate bottoms-up at a reduced rate through the remote choke", "Open the BOP and drill ahead, but watch the pit volume closely", "Continue drilling and monitor for decreasing trend in flow back times"], "a": 1, "e": "Circulate bottoms-up at a reduced rate through the remote choke."}, {"n": 214, "c": "K", "q": "When should the well be monitored with pit level and flow rate instrumentation?", "o": ["When drilling open hole", "During connections", "When running into the hole", "All the above"], "a": 3, "e": "Monitor pit level and flow rate when drilling, on connections and when running in."}, {"n": 215, "c": "O", "q": "The Driller has successfully shut-in on a kick. Which one of the following could be delegated to a crewmember?", "o": ["Instructions to crew if Gas Migration is encountered", "Communicating kill plan to crewmembers", "Checking kill-sheet for accuracy", "Checking for leaks at the pumps, pipework and pit areas"], "a": 3, "e": "Checking for leaks at the pumps, pipework and pits can be delegated to a crew member."}, {"n": 216, "c": "K", "q": "How can it be confirmed that a well is kicking and not just ballooning?", "o": ["Losses occur while drilling", "SICP is greater than APL", "SICP equal to or less than APL", "Decreasing mud flow-back rate at connections"], "a": 1, "e": "SICP greater than APL indicates a real kick rather than ballooning."}, {"n": 217, "c": "M", "q": "How can constant bottom hole pressure be maintained while stripping in the hole? (Assume there is no influx migration.)", "o": ["Bleed off the drill pipe closed-end displacement while stripping each stand", "Pump a volume of mud into the well equal to the drill pipe closed end displacement while stripping each stand", "Bleed off the drill pipe steel displacement while stripping each stand", "Pump a volume of mud into the well equal to the drill pipe steel displacement while stripping each stand"], "a": 0, "e": "Bleed off the closed-end displacement while stripping each stand to keep BHP constant."}, {"n": 218, "c": "M", "q": "A kick is being circulated out at 30 SPM and the Final Circulating Pressure is 650 psi. What will happen to bottom hole pressure if the pump speed is increased to 35 SPM while holding drill pipe pressure at 650 psi?", "o": ["It will increase", "It will stay the same", "It will decrease"], "a": 2, "e": "Raising the rate while holding DP pressure at FCP lowers BHP."}, {"n": 219, "c": "P", "q": "What can happen if you exceed Maximum Allowable Annular Surface Pressure (MAASP)?", "o": ["Annular Preventer will be damaged", "May lose fluid to formation", "Damage to mud pump liner", "Casing collapse"], "a": 1, "e": "Exceeding MAASP may cause fluid loss to the formation."}, {"n": 220, "c": "P", "q": "How can wellbore pressure affect non-aqueous (OBM/SBM) mud density downhole?", "o": ["Well depth will not affect the mud density downhole", "Increasing hydrostatic pressure downhole can decrease effective mud density in the well", "Well depth will increase viscosity downhole and reduce ECD", "Increasing hydrostatic pressure downhole can increase effective mud density in the well"], "a": 3, "e": "Higher hydrostatic pressure compresses OBM/SBM, increasing effective density."}, {"n": 221, "c": "M", "q": "While circulating a gas kick out of the well using the Driller\u2019s method, what would normally happen to the active pit level?", "o": ["Pit level would increase due to gas expansion then stay constant as gas exits the choke", "Pit level would decrease due to gas expansion then increase as gas exits the choke", "Pit level would decrease due to gas expansion then stay constant as gas exits the choke", "Pit level would increase due to gas expansion then decrease as gas exits the choke"], "a": 3, "e": "Gas expansion raises the pit level, then it falls as gas leaves at the choke."}, {"n": 222, "c": "M", "q": "A well is shut in on a kick and the first circulation of the Driller\u2019s Method has been completed. Pumps were shut down and the well is shut-in. The following was documented: Shut In Drill Pipe (SIDPP) Shut in Casing (SICP) Original Shut in Pressure 250 psi 500 psi After First Circulation 350 psi 350 psi What is the current status of the well?", "o": ["The Kill Weight Mud (KWM) has been pumped and was not sufficient to kill the well", "Influx has been removed and there is trapped pressure", "There is still a kick in the well, providing less hydrostatic on the annulus side of the well", "Kill Weight Mud is causing a U-tube effect between the Drill String and the Annulus"], "a": 1, "e": "SIDPP = SICP after the first circulation shows the influx is out and pressure is trapped.", "f": {"s": "A well is shut in on a kick and the first circulation of the Driller's Method has been completed. Pumps were shut down and the well is shut-in. The following was documented:", "tb": [{"h": ["", "Shut In Drill Pipe (SIDPP)", "Shut in Casing (SICP)"], "r": [["Original shut in pressure", "250 psi", "500 psi"], ["After first circulation", "350 psi", "350 psi"]]}], "ask": "What is the current status of the well?"}}, {"n": 223, "c": "M", "q": "While killing a well with the Wait and Weight method and kill mud is displacing the drill string, a bit nozzle plugs. What is the correct response to maintain correct bottom hole pressure?", "o": ["Add the Drill Pipe pressure increase to each value on the drill pipe pressure schedule and continue circulating", "Continue to follow the drill pipe pressure schedule with no modification", "Open the choke to hold drill pipe pressure constant", "Subtract the Drill Pipe pressure increase from each value on the drill pipe pressure schedule and continue circulating"], "a": 0, "e": "Add the DP pressure increase to every value on the schedule and continue."}, {"n": 224, "c": "B", "q": "After closing a ram preventer using the remote BOP panel, the ram open light goes out and the close light illuminates. The accumulator and manifold pressures have remained static. What does this indicate?", "o": ["Possible blockage in the line between the accumulator unit and BOP stack", "Master valve not held down for 5 seconds", "The 3-position/4-way Ram valve on the accumulator has not moved", "No air on the panel"], "a": 0, "e": "Light changed, pressures static: possible blockage between the accumulator unit and the BOP."}, {"n": 225, "c": "O", "q": "What is the main reason for a Diverter drill?", "o": ["To test the pit, flow and trip tank alarms", "To ensure the crew are able to close in the well and prepare the kill mud", "To ensure the crew is able to effectively recognize and react to a surface kick by redirecting fluids away from the rig", "To see how fast the Driller can line up from the vent line to the mud gas separator"], "a": 2, "e": "A diverter drill trains the crew to react to a surface kick by redirecting fluids away."}, {"n": 226, "c": "M", "q": "What is the primary objective when circulating out a kick?", "o": ["To have an overbalance pressure as close to the fracture pressure as possible", "To maintain constant bottom hole pressure at least equal to the formation pressure", "To use the highest pump rate possible", "To reverse circulate to remove the influx faster"], "a": 1, "e": "The primary objective is a constant BHP at least equal to formation pressure."}, {"n": 227, "c": "M", "q": "Why kill the well at a reduced pump rate?", "o": ["To minimize the potential of overloading the mud/gas separator", "To stop downhole mud motor rotating during a well kill operation", "To kill the well in a short time", "To prevent bursting the casing"], "a": 0, "e": "A reduced pump rate reduces the chance of overloading the mud/gas separator."}, {"n": 228, "c": "B", "q": "Which gauges on a remote BOP control panel will show a reduction in pressure when you close the pipe rams?", "o": ["The manifold pressure gauge and annular pressure gage", "The annular pressure gauge", "The accumulator pressure gauge and manifold pressure gauge", "The air pressure gauge and annular pressure gauge"], "a": 2, "e": "Closing the pipe rams uses fluid from the accumulators, so accumulator and manifold gauges drop."}, {"n": 229, "c": "O", "q": "Why is it important for crew members to immediately inform their Driller if they see any potential well control problems?", "o": ["To inform the Driller to increase tripping speed", "To help Driller identify and act to minimize the size of a kick", "To inform the Driller to reduce rate of penetration", "To help Driller recognize formation change"], "a": 1, "e": "Early information helps the Driller minimise the size of a kick."}, {"n": 230, "c": "P", "q": "The operator calculates a kick tolerance of 50 bbls at a given depth, based on 0.5 ppg kick intensity. If you re-calculate for a kick intensity of 1 ppg, what will happen to maximum kick size?", "o": ["Maximum kick size will stay at 50 bbls", "Maximum kick size will increase", "Maximum kick size will decrease"], "a": 2, "e": "A higher kick intensity gives a smaller maximum kick size."}, {"n": 231, "c": "M", "q": "A kick has been taken but the mud engineer states that there is not enough barite to kill the well. The shut in pressures have stabilized. While waiting on new stocks of barite the shut in pressures are slowly increasing by 100 psi every 30 minutes. What course of action should be taken?", "o": ["Use the Lube and Bleed Method", "Use the first circulation of the Driller\u2019s Method", "Reduce mud weight as much as possible and circulate to the Bit to reduce SIDPP", "Bleed off mud by holding Casing pressure constant at SICP"], "a": 1, "e": "Use the first circulation of the Driller's Method to remove the influx while barite is short."}, {"n": 232, "c": "D", "q": "An influx occurs while drilling through a fault and the well is shut in. Calculate the mud weight needed to kill the well using the following information: Well data: MD TVD Depth at start of horizontal 7,690 feet 6,200 feet Depth at time of kick 11,000 feet 5,500 feet Length of horizontal section 3,310 feet Mud weight 11 ppg Kick data: SIDPP 150 psi SICP 170 psi", "o": ["12 ppg", "11.5 ppg", "11.4 ppg", "11.6 ppg"], "a": 3, "e": "KWM = 11 + 150 / (0.052 x 5,500) = 11.52 ppg. Kill weight mud is always rounded up to the next 0.1 ppg, so 11.6 ppg.", "f": {"s": "An influx occurs while drilling through a fault and the well is shut in. Calculate the mud weight needed to kill the well using the following information:", "tb": [{"h": ["Well data", "MD", "TVD"], "r": [["Depth at start of horizontal", "7,690 feet", "6,200 feet"], ["Depth at time of kick", "11,000 feet", "5,500 feet"], ["Length of horizontal section", "3,310 feet", ""], ["Mud weight", "11 ppg", ""]]}, {"h": ["Kick data", ""], "r": [["SIDPP", "150 psi"], ["SICP", "170 psi"]]}]}}, {"n": 233, "c": "S", "q": "The well has been shut-in and the pressures are stabilizing. What is the first step that the Driller should take?", "o": ["Check the well is secure (no leaks)", "Check the drillpipe pressure to determine formation pressure", "Calculate Kill Weight Fluid", "Record the pit gain"], "a": 0, "e": "First, check the well is secure and there are no leaks."}, {"n": 234, "c": "P", "q": "Casing shoe depth = 11,000 feet TVD, MD = 12,250 feet., Test Mud Weight = 14.0 ppg, Leak - Off Test Pressure = 1950 psi. Calculate the Maximum Allowable Mud Weight.", "o": ["17.4 ppg", "17.5 ppg", "17.2 ppg", "17.3 ppg"], "a": 0, "e": "MAW = 14 + 1,950 / (0.052 x 11,000) = 17.4 ppg.", "f": {"dt": [["Casing shoe depth", "11,000 feet TVD / 12,250 feet MD"], ["Test mud weight", "14.0 ppg"], ["Leak-off test pressure", "1950 psi"]], "ask": "Calculate the Maximum Allowable Mud Weight."}}, {"n": 235, "c": "D", "q": "If a kick occurs while drilling a horizontal well, why is there little or no difference between SIDPP and SICP?", "o": ["Because the mud density and formation fluid density are the same when drilling horizontal wells", "Because the volume inside the string is the same as volume in the Annulus", "Because in horizontal wells, the influx is not able to migrate", "Because the kick in the horizontal section does not have the vertical height to affect the hydrostatic pressure in the Annulus"], "a": 3, "e": "The influx in the horizontal section has no vertical height to affect annular hydrostatic."}, {"n": 236, "c": "S", "q": "A well is shut in and casing pressure has stabilized. The float valve was bumped and Shut In Drillpipe Pressure (SIDPP) was recorded. Well Information: Initial SIDPP = 550 psi Initial SICP = 750 psi MAASP = 1,600 psi While waiting on orders the casing pressure increased to 850psi. If the float valve were bumped again, at what pressure will the float open?", "o": ["650 psi", "850 psi", "550 psi", "950 psi"], "a": 0, "e": "SIDPP 550 + the 100 psi casing rise from migration = 650 psi at the float.", "f": {"s": "A well is shut in and casing pressure has stabilized. The float valve was bumped and Shut In Drillpipe Pressure (SIDPP) was recorded.", "dt": [["Initial SIDPP", "550 psi"], ["Initial SICP", "750 psi"], ["MAASP", "1,600 psi"]], "s2": "While waiting on orders the casing pressure increased to 850 psi.", "ask": "If the float valve were bumped again, at what pressure will the float open?"}}, {"n": 237, "c": "D", "q": "In MPD operations, as circulation is reduced or stopped, what will happen to the ECD?", "o": ["Decreases.", "Increases.", "Stays the same."], "a": 0, "e": "When circulation stops, annular friction goes and ECD decreases."}, {"n": 238, "c": "P", "q": "If mud weight in the well is maintained constant, how does an increase in formation fluid pressure affect overbalance?", "o": ["Overbalance stays the same", "Overbalance decreases", "Overbalance increases"], "a": 1, "e": "With constant mud weight, higher formation pressure reduces the overbalance."}, {"n": 239, "c": "B", "q": "What would be the effect of fitting a 7-1/16 inch x 5,000psi flange to a working 10,000psi rated BOP stack?", "o": ["The MAWP of the BOP would become 2,500 psi", "The MAWP of the BOP would remain at 10,000 psi", "The MAWP of the BOP would become 5,000 psi", "The MAWP of the BOP would become 7,500 psi"], "a": 2, "e": "The weakest component sets the rating: 5,000 psi."}, {"n": 240, "c": "B", "q": "Why is it important to control flow rate when circulating out a kick through the Mud Gas Separator?", "o": ["Flow rate is dependent on the ability of the dump valve to function properly.", "The only dimension to consider when circulating out an influx is the height of the separator.", "To prevent \"blow-through,\" a separator's flow rate should be limited based on vent line and mud seal restrictions.", "All separators can handle any amount of flow rate; therefore, it is not important."], "a": 2, "e": "Control flow rate to avoid blow-through, based on vent line and mud seal limits."}, {"n": 241, "c": "O", "q": "You run back to the shoe and carry out a slip-and-cut on the drilling line. The operation normally takes 60 minutes. What is the best way to monitor the well?", "o": ["Line up to trip tank and set Trip Tank alarm", "Line up to mud pits and inform Mud Logger to monitor for gains", "Install a safety valve in the drill string, line up to the Trip Tank and set the alarm", "Shut in well and record pressure every 15 minutes"], "a": 0, "e": "Line up to the trip tank and set the alarm."}, {"n": 242, "c": "M", "q": "When using the Wait & Weight method to kill a vertical well with a gas kick, when will kill mud start to affect surface casing pressure?", "o": ["When kill mud reaches the casing shoe", "When kill mud enters the annulus", "When kill mud enters the drill pipe", "When the gas influx exits the choke at the surface"], "a": 1, "e": "Kill mud affects casing pressure once it enters the annulus."}, {"n": 243, "c": "S", "q": "While tripping into the hole at 6,000 ft. a flow check is positive. The rig procedure is to shut the well in using the hard shut in procedure. What is the correct procedure to shut in?", "o": ["Stab a full opening safety valve, Close the safety valve ,Close BOP, Open HCR valve, Record pressure.", "Open HCR valve and choke, Close BOP, Stab full opening safety valve, Close choke Record pressure.", "Close the BOP, Stab full opening safety valve, Close the safety valve, Open choke, Record pressure.", "Stab full opening safety valve, Open HCR valve and choke, Close BOP, Close safety valve, Record pressure."], "a": 0, "e": "Hard shut-in: stab and close the safety valve, close the BOP, open the HCR, record pressure."}, {"n": 244, "c": "P", "q": "What is defined by \u201cthe force acting on an area\u201d?", "o": ["Formation Integrity Test", "Mud Weight", "Density", "Pressure"], "a": 3, "e": "Pressure is force acting on an area."}, {"n": 245, "c": "D", "q": "While using the Driller\u2019s Method, what adjustment to casing pressure must occur when a gas influx is being circulated from the horizontal section into the vertical section?", "o": ["Casing pressure must stay the same", "Casing pressure must increase", "Casing pressure must decrease"], "a": 1, "e": "As gas moves from horizontal into vertical, casing pressure must increase to hold BHP."}, {"n": 246, "c": "K", "q": "What is the main reason to examine the returns flowing across the shakers?", "o": ["The type and amount of cuttings and cavings can indicate wellbore conditions", "The more cuttings and cavings at the Shaker is an indication of good drilling practices", "The type of cuttings determine whether to run the degasser or the centrifuge", "The type of cuttings determine what mud weight is needed"], "a": 0, "e": "Cuttings and cavings at the shakers show wellbore conditions."}, {"n": 247, "c": "K", "q": "What is a possible differentiator between a kick and a ballooning event?", "o": ["A ballooning formation will always result in a pit gain but not for a kick", "Ballooning is preceded by fluid losses", "There will be shut in pressures for a kick, no pressures for ballooning", "You can\u2019t tell the difference between the two until you pump bottoms up"], "a": 1, "e": "Ballooning is preceded by fluid losses."}, {"n": 248, "c": "M", "q": "When circulating an influx out, what will happen to casing pressure when gas breaks out of a non- aqueous (OBM/SBM) mud?", "o": ["Increase rapidly", "Decrease rapidly", "Stay the same"], "a": 0, "e": "Gas breaking out of OBM near surface increases casing pressure rapidly."}, {"n": 249, "c": "M", "q": "During a well kill, the pump rate is increased while holding drill pipe pressure constant. If you ignore any ECD effects, how will the pump rate increase affect Bottomhole Pressure (BHP)?", "o": ["There is no way to know what will happen to BHP", "BHP will decrease, risking further influx", "BHP will increase risking formation damage", "BHP will stay constant"], "a": 1, "e": "With DP pressure held constant while rate rises, BHP decreases."}, {"n": 250, "c": "M", "q": "A kick was taken with the bit off bottom while tripping out of the hole. What is the best course of action?", "o": ["Bullhead the influx away", "Strip in with volumetric control", "Strip in using the barrel in / barrel out method", "Execute the first circulation of the Driller\u2019s Method off bottom"], "a": 1, "e": "Kick off bottom while tripping: strip in with volumetric control (keyed answer)."}, {"n": 251, "c": "O", "q": "You are drilling a section of well with a low kick tolerance. What action could be implemented?", "o": ["Pull out at increased trip speed and carry out 15 minute flow checks at all drilling breaks", "Increase the mud viscosity to reduce the chance of a kick", "Increase vigilance of kick indicators", "Take slow circulating rate pressures at faster strokes per minute (SPM) than normal"], "a": 2, "e": "With low kick tolerance, increase vigilance for kick indicators."}, {"n": 252, "c": "M", "q": "A vertical well is being killed using the Wait & Weight method. At what point during the operation should the final circulating pressure be held on the drill pipe pressure gauge?", "o": ["After waiting for the kill mud to be mixed and ready", "Once kill mud has reached the casing shoe", "When kill mud returns to surface", "Once kill mud has been circulated to the bit"], "a": 3, "e": "Hold FCP once kill mud has been circulated to the bit."}, {"n": 253, "c": "K", "q": "What recommended action could a Driller take if a sudden increase in mud gas level is recorded?", "o": ["Stop drilling, circulate bottoms-up, record gas levels and inform the supervisor", "Request Mud Engineer to increase mud weight by 0.3 ppg", "Check for flow and call Supervisor", "Increase rate of penetration to minimize the warning signs"], "a": 2, "e": "A sudden increase in mud gas: check for flow and call the supervisor."}, {"n": 254, "c": "M", "q": "What would normally happen to pit volumes if a gas influx is being circulated up the vertical section of the hole?", "o": ["Decrease", "Increase", "Stay the same"], "a": 1, "e": "Gas expands as it rises, so pit volume increases."}, {"n": 255, "c": "M", "q": "The 1st Circulation of the Driller\u2019s Method has been completed correctly and the pumps shut down. What should the Shut-in Drill Pipe Pressure (SIDPP) and Shut-in Casing Pressure (SICP) read? No safety factor was held.", "o": ["The SIDPP will be higher than the SICP", "SICP and SIDPP will both be equal to the original SIDPP", "SICP and SIDPP will be equal to one another and equal to the well\u2019s original SICP", "The SIDPP will be lower than the SICP"], "a": 1, "e": "After a successful first circulation both gauges equal the original SIDPP."}, {"n": 256, "c": "K", "q": "The Derrickman states that there has been a 10 bbl increase in the pits over the last 15 minutes. What is the safest action for the Driller to take?", "o": ["Call the Toolpusher for advice", "Inform the Mud Engineer", "Perform a flow check", "Ask the Derrickman to check for any mud transfers"], "a": 2, "e": "A 10 bbl pit increase: perform a flow check."}, {"n": 257, "c": "M", "q": "Why are Bit to Shoe strokes calculated on the kill sheet?", "o": ["Indicates when casing shoe pressure should stop increasing while holding constant BHP", "Confirms that kill mud is now in the annulus", "Tells you that casing shoe pressure will start increasing till gas is at the choke", "Confirms when you can add a safety margin to the casing pressure"], "a": 0, "e": "Bit-to-shoe strokes show when shoe pressure stops rising at constant BHP."}, {"n": 258, "c": "M", "q": "After successfully conducting the first circulation of the Driller\u2019s method. Drill pipe pressure has been maintained at Initial Circulating Pressure of 560 psi. Choke pressure has been holding around 460 psi for the last 15 minutes. There is an increase in Drill pipe pressure. Choke pressure stays the same at 460 psi. What type of complication has most likely occurred?", "o": ["A bit nozzle has washed out", "There is a washout above BOP", "A bit nozzle has plugged", "The choke is plugging up"], "a": 2, "e": "DP pressure rising with choke pressure unchanged: a plugged bit nozzle."}, {"n": 259, "c": "B", "q": "After closing an annular preventer, the accumulator pressure dropped but did not return to the normal operating pressure. The BOP has closed and there are no leaks. What could cause this?", "o": ["The 3-position annular valve has not moved", "The annular regulator needs to be adjusted to bring accumulator pressure back up to normal operating pressure", "The annular regulator is leaking back to the reservoir tank", "The accumulator charge pump has not started up to return accumulator pressure to normal operating pressure"], "a": 3, "e": "The accumulator charge pump has not started to restore pressure."}, {"n": 260, "c": "O", "q": "What will happen to a heavy pill, in the vertical annulus, as pipe is tripped out of the well?", "o": ["The pill will move up in the well and will get longer.", "The pill will move up in the well and will get shorter as the pipe is pulled through it.", "The pill will move down in the well and will get shorter as the bit is pulled above it.", "The pill will always stay in the same place in the well as we trip out or in the hole."], "a": 2, "e": "A heavy pill in the vertical annulus moves down and gets shorter as the pipe is pulled."}, {"n": 261, "c": "K", "q": "While continuously drilling ahead with a 12\u00bc-inch Bit with an average ROP of 95 feet/hour, there has been no change to the pit level for the last 60 minutes. What action should be taken?", "o": ["Increase WOB now that ROP is stable", "Perform a flow check", "Continue drilling", "Prepare to mix LCM as losses to the formation may be occurring"], "a": 1, "e": "The pit level should rise with drilled volume. No change is unexpected: perform a flow check."}, {"n": 262, "c": "M", "q": "A kick was swabbed in while tripping out of the hole. A full-opening safety valve (FOSV) was installed on the drill pipe and closed. The well was shut in on the Annular BOP. What is the next action to take before stripping back to bottom?", "o": ["Open the FOSV and install the inside blowout preventer", "Keep the FOSV in the closed position", "Install the inside blowout preventer and open the FOSV", "Replace the FOSV with an inside blowout preventer"], "a": 2, "e": "Install the inside BOP, then open the FOSV."}, {"n": 263, "c": "K", "q": "Measuring flow back volumes and times at connections, pit level changes at connections, and loss rates while drilling help to fingerprint wellbore behavior. How can this information assist the Driller?", "o": ["It can help determine when to increase pump rate", "It can help identify when to run another mud check", "It can help identify if the well is \u2018kicking\u2019 or \u2018ballooning\u2019", "It can help identify stuck pipe problems"], "a": 2, "e": "Fingerprinting flowback and pit changes helps tell a kick from ballooning."}, {"n": 264, "c": "S", "q": "Which of the following parameters will affect the Shut-In Casing Pressure?", "o": ["Choke line length", "Slow Circulating Rate Pressure", "Formation Pressure", "Drill string capacity per foot"], "a": 2, "e": "SICP depends on formation pressure."}, {"n": 265, "c": "W", "q": "A 500-foot long cement plug is set inside the casing across the shoe. The mud above the plug is to be displaced with brine. Formation pressure below the plug is balanced by 10.7 ppg mud. Brine density = 9.5 ppg Top of cement plug = 8200 feet If the plug failed and the well is open, what would happen to the well?", "o": ["Well will remain static", "Casing will collapse", "Well will flow", "Formation will fracture"], "a": 2, "e": "Formation is balanced by 10.7 ppg, but brine is only 9.5 ppg: the well will flow.", "f": {"s": "A 500-foot long cement plug is set inside the casing across the shoe. The mud above the plug is to be displaced with brine.", "dt": [["Formation pressure below the plug", "balanced by 10.7 ppg mud"], ["Brine density", "9.5 ppg"], ["Top of cement plug", "8200 feet"]], "ask": "If the plug failed and the well is open, what would happen to the well?"}}, {"n": 266, "c": "M", "q": "During the second circulation of the Driller\u2019s Method with kill fluid circulating up the annulus, the drillpipe pressure starts to rise and does not respond to choke adjustment. Casing pressure begins falling. What is the most likely cause of this?", "o": ["A bit nozzle has plugged", "The pump speed has increased", "The annulus is packing off", "Annular friction has increased with the kill mud"], "a": 2, "e": "DP pressure rising, unresponsive to the choke, with casing pressure falling: the annulus is packing off."}, {"n": 267, "c": "M", "q": "While circulating out a kick, you were instructed to decrease the pump rate from 25 SPM to 20 SPM. The Final Circulating Pressure (FCP) is 320 psi at 25 SPM. What will be the new approximate Final Circulating Pressure (FCP) at 20 SPM?", "o": ["205 psi", "500 psi", "256 psi", "485 psi"], "a": 0, "e": "FCP2 = 320 x (20/25)^2 = about 205 psi."}, {"n": 268, "c": "M", "q": "While managing a gas kick, when would the highest pressure at the casing shoe be expected?", "o": ["When the top of the gas reaches the surface", "When the top of the influx reaches the shoe", "Only at initial shut in"], "a": 1, "e": "Highest shoe pressure occurs when the top of the influx is at the shoe."}, {"n": 269, "c": "W", "q": "What is the minimum number of barriers normally required to be in place for any phase of operations?", "o": ["One", "Four", "Three", "Two"], "a": 3, "e": "Two barriers are normally required."}, {"n": 270, "c": "W", "q": "What is a positive test?", "o": ["A test on a barrier where the pressure applied to the formation side of the barrier is greater than the pressure on the surface side of the barrier", "A test on a barrier where the pressure on the surface side of the barrier is greater than the pressure on the formation side of the barrier", "A test on a barrier where the pressure on the formation side of the barrier is equal to the pressure on the surface side of the barrier"], "a": 1, "e": "A positive test applies pressure on the surface side higher than the formation side."}, {"n": 271, "c": "O", "q": "The Mud Engineer starts the vacuum degasser and the desilter. What will normally happen to pit level?", "o": ["Pit level will increase", "Pit level will decrease", "Pit level will stay the same"], "a": 1, "e": "Degasser and desilter draw down the active pit, so pit level decreases."}, {"n": 272, "c": "W", "q": "Casing is run in the hole with a non-return float assembly. The casing is not being filled. With the shoe at 3000 feet, the float assembly fails and mud u-tubes up inside the casing. What will happen to the bottom hole pressure (BHP)?", "o": ["Bottom hole pressure will decrease", "Bottom hole pressure will increase", "Bottom hole pressure will stay the same due to the u-tube effect", "Bottom hole pressure will remain the same since the mud volume in the hole has not changed"], "a": 0, "e": "When the float fails and mud u-tubes into the casing, the annulus level drops, so BHP decreases."}, {"n": 273, "c": "P", "q": "What will happen to Maximum Allowable Annular Surface Pressure (MAASP) if Mud Weight is increased?", "o": ["MAASP will increase", "MAASP will stay the same", "MAASP will decrease"], "a": 2, "e": "Heavier mud lowers MAASP."}, {"n": 274, "c": "W", "q": "Casing is run in the hole with a non-return float assembly. What can happen if the casing is not kept full?", "o": ["Casing joint just above the float assembly will burst", "Float may fail and allow mud to u-tube up inside the casing", "Casing close to surface will burst", "Hook load will suddenly decrease"], "a": 1, "e": "If the casing is not kept full the float may fail and let mud u-tube inside."}, {"n": 275, "c": "M", "q": "Part of the way through the first circulation of the Driller\u2019s Method, the rig lost power and the well was shut in. What is the overbalance in the well? Well Information: Current drill pipe pressure = 625 psi Current casing pressure = 975 psi Initial Circulating Pressure = 1,420 psi Initial SIDPP = 600 psi Initial SICP = 835 psi", "o": ["25 psi overbalanced", "445 psi overbalanced", "140 psi overbalanced", "795 psi overbalanced"], "a": 0, "e": "Overbalance = current DP pressure 625 - SIDPP 600 = 25 psi.", "f": {"s": "Part of the way through the first circulation of the Driller's Method, the rig lost power and the well was shut in. What is the overbalance in the well?", "dt": [["Current drill pipe pressure", "625 psi"], ["Current casing pressure", "975 psi"], ["Initial circulating pressure", "1,420 psi"], ["Initial SIDPP", "600 psi"], ["Initial SICP", "835 psi"]]}}, {"n": 276, "c": "D", "q": "Why is there little or no difference between the SIDPP and the SICP if a kick happens when drilling a horizontal well? (Assume no float valve in drillstring and that the influx is still in the horizontal section)", "o": ["The volume inside the drill string is the same as the volume in the annulus", "Mud density and formation fluid density are the same when you are drilling horizontal wells", "In horizontal wells, the influx is not able to migrate", "The vertical height of the influx when in the horizontal section has little effect on the hydrostatic pressure"], "a": 3, "e": "The influx has little vertical height in the horizontal section."}, {"n": 277, "c": "K", "q": "The driller is tripping 5-inch drill pipe out of the hole and monitoring the well on the trip tank. Over the last 5 stands, the trip tank has increased by 3 barrels. What should the Driller do?", "o": ["Flow check. This could be a kick that has been swabbed in", "Flow check. It has possibly surged the well causing losses", "Keep pulling pipe. 3 barrels is the correct displacement for 5 inch", "Keep pulling pipe. The Derrickhand probably transferred some mud"], "a": 0, "e": "Flow check. A gain while tripping out could be a swabbed-in kick."}, {"n": 278, "c": "B", "q": "Select the correct definition of the \u201cclosing ratio\u201d of a ram preventer.", "o": ["Operating pressure required to close the ram against the formation pressure", "Operating pressure required to close divided by the ram area", "Area of the operator piston, divided by the cross-sectional area of the piston shaft", "Operating pressure required to open the ram at BOP Rated Working Pressure"], "a": 2, "e": "Closing ratio = operator piston area divided by piston shaft cross-section."}, {"n": 279, "c": "M", "q": "During the first circulation of the Driller\u2019s method, the casing pressure starts to decrease and after the lag time the drill pipe pressure starts to decrease. What could be the problem?", "o": ["Plugged bit nozzle", "Choke plugged", "Choke is washing-out", "Drill string washout"], "a": 2, "e": "Casing pressure then DP pressure falling: the choke is washing out."}, {"n": 280, "c": "D", "q": "What are the benefits of using MPD while drilling a well?", "o": ["It enables a well to be drilled with more consistent BHP.", "It enables a well to be drilled within a tight window between pore pressure and fracture pressure.", "It aids in mitigating pressure-related drilling challenges.", "All of the above."], "a": 3, "e": "MPD gives consistent BHP, works in tight windows and mitigates pressure-related problems."}, {"n": 281, "c": "B", "q": "There is only one inside BOP with an NC50 pin connection on the rig. The drill string consists of: 5-inch Heavy Weight drill pipe (NC50) 8-inch (6-5/8 Reg.) drill collars. Which of the following crossovers must be on the rig floor while tripping?", "o": ["NC50 Box x 7-5/8 inch Reg. pin", "6-5/8 inch Reg. Box x 7-5/8 inch Reg. Pin", "NC50 Box x 6-5/8 inch Reg. box", "NC50 Box x 6-5/8 inch Reg. pin"], "a": 3, "e": "NC50 box x 6-5/8 Reg pin lets the inside BOP connect to the collars.", "f": {"s": "There is only one inside BOP with an NC50 pin connection on the rig. The drill string consists of:", "dt": [["Heavy weight drill pipe", "5-inch (NC50)"], ["Drill collars", "8-inch (6-5/8 Reg.)"]], "ask": "Which of the following crossovers must be on the rig floor while tripping?"}}, {"n": 282, "c": "M", "q": "If the mud pump pop-off valve opened during a well kill, what steps are required to secure the well?", "o": ["Close the shear rams, close the choke", "Drop the drill string, close blind/shear rams, close the choke", "Stop the pump and close the choke", "Stop the pump, close the IBOP or Kelly Cock, and close the choke"], "a": 3, "e": "Stop the pump, close the IBOP or Kelly cock, and close the choke."}, {"n": 283, "c": "B", "q": "What is the safest and most reliable method for monitoring leaks through the BOP", "o": ["Line up the trip tank to monitor for flow above the closed BOP", "Monitor for changes in the flow rate indicator", "Visually check by looking through rotary table", "Close the diverter and monitor the vent line"], "a": 0, "e": "Line up the trip tank to monitor flow above the closed BOP."}, {"n": 284, "c": "P", "q": "Which of the following is the definition of kick tolerance?", "o": ["The minimum kick intensity, for a given gas kick volume that can be successfully shut in and circulated out without exceeding the well\u2019s weak point fracture pressure", "The maximum gas kick volume, for a given kick intensity at a particular depth that can be successfully shut in and circulated out without exceeding the well\u2019s weak point fracture pressure", "The maximum gas kick volume, at a particular depth that can be successfully shut in and circulated out without exceeding the well\u2019s weak point fracture pressure"], "a": 1, "e": "Kick tolerance is the maximum gas kick volume, for a given intensity and depth, that can be circulated out without fracturing the weak point."}, {"n": 285, "c": "M", "q": "What is the function of the choke in the choke manifold during the first circulation of the Driller's Method?", "o": ["To regulate cutting size to compensate for a lack of hydrostatic pressure", "To prevent mud from flowing back into the annulus", "To regulate pressure to compensate for an increase in hydrostatic pressure", "To regulate pressure to compensate for a lack of hydrostatic pressure"], "a": 3, "e": "The choke regulates pressure to compensate for lack of hydrostatic."}, {"n": 286, "c": "M", "q": "The drill string is slowly washing out below the BOP, and the choke is being adjusted to maintain correct drill pipe pressure. What is happening to the bottom hole pressure?", "o": ["It will increase", "It will remain constant", "It will decrease"], "a": 0, "e": "Keyed answer a: BHP increases (flagged for trainer review)."}, {"n": 287, "c": "B", "q": "What do the following a transition zone the bulk density of shale cuttings decreases."}, {"n": 291, "c": "S", "q": "A well is shut in with the bit 1,000 feet off-bottom while stripping out of the hole and all the influx is assumed to be below the bit. SIDPP is 250 psi. What would be the expected SICP?", "o": ["The same as SIDPP", "Higher than SIDPP", "Lower than SIDPP"], "a": 0, "e": "With the influx below the bit, SIDPP and SICP are the same."}, {"n": 292, "c": "M", "q": "When unable to circulate with gas migrating in the well, what well control method is used to manage pressures?", "o": ["Wait and Weight Method", "Driller\u2019s Method", "The Volumetric Method", "Reverse Circulation Method"], "a": 2, "e": "If unable to circulate and gas is migrating, use the Volumetric Method."}, {"n": 293, "c": "K", "q": "Losses occur while circulating, but mud is gained while the pumps are off. The well is shut in and ballooning is suspected. It is decided to bleed-off 20 barrels of mud back to the pits. What is the potential danger of this bleed-off?", "o": ["Formation fluid may flow into the wellbore", "Bleeding back too much will decrease chance of losses", "Formation will widen the wellbore and restrict circulation", "Wellbore will become washed-out"], "a": 0, "e": "Bleeding back a ballooning volume can let formation fluid flow in if it was a kick."}, {"n": 294, "c": "M", "q": "The Driller has not taken the slow circulating rate pressures. How should the Initial Circulating Pressure (ICP) be determined?", "o": ["After a correct start-up procedure and lag time, the drillpipe pressure gauge will read ICP.", "Estimate ICP based on last pump pressure and SPM", "Divide drilling pump rate by planned kill rate and multiply by the drilling pump pressure", "Hold the casing pressure constant until kill mud reaches the bit then read DP pressure"], "a": 0, "e": "After a correct start-up and lag time the DP gauge reads ICP."}, {"n": 295, "c": "K", "q": "While drilling, the well is losing mud at 15 bbls per hour. At the connection, the well is flowing. When the pumps are restarted, mud losses occur again. What could be happening downhole?", "o": ["Swabbing is occurring when making the connection", "The mud is u-tubing due to different weights in the string and annulus", "The well is potentially ballooning, shut-in and verify", "The formation is definitely not ballooning"], "a": 2, "e": "Losses while pumping and flow when off suggests ballooning: shut in and verify."}, {"n": 296, "c": "P", "q": "What is the fluid pressure within the pore spaces of the rock known as?", "o": ["Hydrostatic Pressure", "Formation Pressure", "Total Wellbore Pressure", "Fracture Pressure"], "a": 1, "e": "Fluid pressure in the pore spaces is formation pressure."}, {"n": 297, "c": "O", "q": "What precautions should be taken with the drilling fluid before starting wireline operations?", "o": ["Drilling fluid should be circulated and conditioned because the well will be static for an extended period", "Increase mud weight before starting the wirelining operation to compensate for the loss of ECD", "Due to small diameter of tools there are no special precautions to take", "A Lost Circulation Material (LCM) pill should be spotted at the depth of interest before starting wireline operations"], "a": 0, "e": "Circulate and condition the mud before wireline since the well will be static a long time."}, {"n": 298, "c": "K", "q": "What should a Driller do if there is a significant increase in connection gas?", "o": ["Continue drilling with reduced rate of penetration", "Notify the mud engineer to add viscosifiers to increase gel strength", "Notify the derrick hand to increase mud weight", "Inform the Supervisor"], "a": 3, "e": "A significant increase in connection gas: inform the supervisor."}, {"n": 299, "c": "M", "q": "What minimum bottom hole pressure should be maintained during a well kill operation?", "o": ["Maintain a pressure at least equal to formation pressure", "Maintain a pressure that is equal to the Annulus Friction Pressure", "Maintain a pressure at least equal to slow circulating rate pressure", "Maintain a pressure that is at least equal to Shut-in Drillpipe Pressure"], "a": 0, "e": "Maintain BHP at least equal to formation pressure."}, {"n": 300, "c": "P", "q": "What is meant by abnormal formation pressure?", "o": ["The excess pressure that needs to be applied to cause leak-off", "The excess pressure due to circulating mud at high rates", "Heavy weight mud used to maintain an overbalance", "The formation pressure is greater than formation water hydrostatic pressure"], "a": 3, "e": "Abnormal pressure is greater than formation water hydrostatic."}, {"n": 301, "c": "D", "q": "While drilling with MPD, what surface applied back pressure is required to balance a 10.5 ppg formation at 14,000' MD/10,000' TVD, given: Mud density: 9.6 ppg APL: 175 psi", "o": ["480 psi", "655 psi", "468 psi", "293 psi"], "a": 3, "e": "(10.5 - 9.6) x 0.052 x 10,000 = 468 psi, minus APL 175 = 293 psi.", "f": {"s": "While drilling with MPD, what surface applied back pressure is required to balance a 10.5 ppg formation at 14,000' MD/10,000' TVD, given:", "dt": [["Mud density", "9.6 ppg"], ["APL", "175 psi"]]}}, {"n": 302, "c": "S", "q": "After tripping out 2,000 feet wet, the well kicked and was shut in. SICP is 100 psi Swabbed volume in hole is 10 bbls Casing capacity 0.147 bbls/foot Assuming the swabbed influx is below the bit, what will be the SIDPP?", "o": ["Lower than SICP", "Same as SICP", "Higher than SICP"], "a": 1, "e": "With the influx below the bit, SIDPP equals SICP.", "f": {"s": "After tripping out 2,000 feet wet, the well kicked and was shut in.", "dt": [["SICP", "100 psi"], ["Swabbed volume in hole", "10 bbls"], ["Casing capacity", "0.147 bbls/foot"]], "ask": "Assuming the swabbed influx is below the bit, what will be the SIDPP?"}}, {"n": 303, "c": "M", "q": "While holding Casing Pressure constant as kill mud is circulated up the annulus, what will happen to Bottom Hole Pressure?", "o": ["Increase", "Decrease", "Stay the same"], "a": 1, "e": "Holding casing pressure constant as kill mud goes up the annulus lowers BHP."}, {"n": 304, "c": "S", "q": "A well is shut-in with stabilized SICP of 500psi and 0psi on the drill pipe gauge. To obtain the SIDPP, the Driller pumped at 5 SPM until the float was bumped and pump shut down. The gauges are now reading the following pressures. What is the actual SIDPP?", "o": ["500 psi", "360 psi", "580 psi", "280 psi"], "a": 3, "e": "Casing rose 80 psi (500 to 580) when the float opened, so SIDPP = 360 - 80 = 280 psi.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAHFA4QDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LooooAKKKKACiiigAPSk7ZqjrUjw+H9Qljco6W7srDqDtPNfK/gzwx8X/HugS6/pvxOuLOA3EsSQyyuSNpx2qb6teVx20T87H1txScYrwv4U+OPFq6hr3g3xyftGp6BCZln/AIpoh3469eDV3QfjnB4nuo7fRvBmt3SmcwTSxqDHb843M3THenpp5q5F7X8j2eg8181x+Lb+T4XfEC90zxBrMlzY3Kost5Iu+H5jxHt6D60y/wDFXiWPT/hI667eB9SKfayJP+Pj5l+960kr29UvvVymtWu1/wAD6WXg4p1cX8Rr+70/4a61e2NxJb3MVs7JLGcMpA6g18+6L4U+Lms+A4PFsXxZeGCW2a5FvJcMGAGTgnp2pN6yfb9Rp3UX3PrTilGK+Y/+Fk6rq/wHstZ1jU9SsL231EWcl3prKjzFcjJ3cYPtXoXiD4w6T4M1LRtFv9Pv72a9tEkSWHDsxKjAKjkkn07mtXHlbi+jsTvr6v7nY9bFLXmPhH4u6d4o8TyeGrzRdR8P6uEEkdtqCbWkXuR7+ e would have to be held on the annulus to prevent u-tubing", "Cement would have to be reverse circulated", "Fluids from the annulus or the formation can enter the casing", "Cement cannot be pumped down inside the casing"], "a": 2, "e": "A float that does not convert lets fluids enter the casing."}, {"n": 311, "c": "D", "q": "Which are not main components of an RCD?", "o": ["Bowl/body.", "Pipe sealing elements.", "Flow line and the orbit valve in the flow line.", "Bearing assembly."], "a": 2, "e": "The flow line and orbit valve are not main RCD components."}, {"n": 312, "c": "B", "q": "What is the main function of the choke in the overall well control system?", "o": ["To regulate flow to the shale shaker", "To hold back pressure while circulating out a kick", "To direct hydrocarbons to the flare", "To direct wellbore fluids to the mud/gas separator"], "a": 1, "e": "The choke holds back pressure while circulating out a kick."}, {"n": 313, "c": "K", "q": "While drilling ahead in a zone that has experienced ballooning in offset wells, the well flows on connection. \u2022 The well is shut in with a 6 barrel gain. \u2022 Pressures have stabilized Drill Pipe Pressure=160psi and Casing Pressure=180psi. \u2022 2 barrels of fluid are bled off through the choke and the well is shut back in. \u2022 Drill Pipe Pressure=160psi and Casing Pressure=220psi. What is most likely happening downhole?", "o": ["Ballooning well", "Lost Circulation", "Formation fluid influx", "Hydrates in the choke"], "a": 2, "e": "Pressure rebuilds higher after bleeding: a formation fluid influx.", "f": {"s": "While drilling ahead in a zone that has experienced ballooning in offset wells, the well flows on connection.", "li": ["The well is shut in with a 6 barrel gain.", "Pressures have stabilized: Drill Pipe Pressure = 160 psi and Casing Pressure = 180 psi.", "2 barrels of fluid are bled off through the choke and the well is shut back in.", "Drill Pipe Pressure = 160 psi and Casing Pressure = 220 psi."], "ask": "What is most likely happening downhole?"}}, {"n": 314, "c": "W", "q": "For most operations it is recommended that two independent barriers are in place. From the list below, which pair of barriers are NOT independent of each other?", "o": ["An Annular and a Ram on a BOP stack", "A tubing plug set downhole and a backpressure valve in the hanger", "A cemented shoe track over a non-hydrocarbon bearing zone and a casing bridge plug", "Kill weight mud in the well and the blow out preventer"], "a": 0, "e": "An annular and a ram on the same stack are not independent."}, {"n": 315, "c": "M", "q": "If the 1st Circulation of the Driller\u2019s Method has been successful, what should the pressure gauges read after shut-in? No safety factor was held.", "o": ["SICP and SIDPP will be equal to the original SICP", "The SIDPP will be higher than the SICP", "SICP and SIDPP will be equal to the original SIDPP", "The SIDPP will be lower than the SICP"], "a": 2, "e": "After a successful first circulation both gauges equal the original SIDPP."}, {"n": 316, "c": "B", "q": "How would an annular preventer leak be identified on a shut-in well?", "o": ["Volume increase at the trip tank", "Place BOP 4-way valve in the open position", "Volume decrease at the trip tank", "Place BOP 4-way valve in the neutral position"], "a": 0, "e": "A volume increase at the trip tank identifies an annular leak."}, {"n": 317, "c": "P", "q": "An open well is full of clean fluid and you are not circulating. What is the Bottom Hole Pressure (BHP)?", "o": ["BHP equals hydrostatic pressure minus circulating Annular Pressure Loss", "BHP equals hydrostatic pressure plus circulating Annular Pressure Loss", "BHP equals hydrostatic pressure"], "a": 2, "e": "Static BHP equals hydrostatic."}, {"n": 318, "c": "B", "q": "On the surface stack remote panel, the High Pressure Bypass button or handle allows for full accumulator pressure to which of the following?", "o": ["Rams only", "Rams and HCVs only", "All functions", "Annular only"], "a": 1, "e": "The high pressure bypass applies full accumulator pressure to rams and HCVs only."}, {"n": 319, "c": "M", "q": "You are circulating kill mud to the bit in a vertical well with the Wait and Weight method. The drillstring is tapered. Drillpipe length is 10,000 feet with: - 0 to 5,000 feet of 6 5/8 inch drillpipe, 1730 strokes - 5,000 to 10,000 feet of 5-inch drillpipe, 890 strokes Total Strokes to Bit = 2620 strokes ICP = 800 psi FCP = 425 psi If the pressure step-down graph/schedule is used, based on an average 14 psi per 100 strokes pumped what would be the effect on bottom hole pressure after pumping kill mud down to the top of the 5-inch drillpipe?", "o": ["Bottom hole pressure will be correct", "Bottom hole pressure will be too low", "Bottom hole pressure will be too high"], "a": 1, "e": "Keyed answer b: a linear step-down on a tapered string gives bottom hole pressure too low.", "f": {"s": "You are circulating kill mud to the bit in a vertical well with the Wait and Weight method. The drillstring is tapered.", "dt": [["Drill pipe length", "10,000 feet"], ["0 to 5,000 feet", "6 5/8 inch drill pipe, 1730 strokes"], ["5,000 to 10,000 feet", "5-inch drill pipe, 890 strokes"], ["Total strokes to bit", "2620 strokes"], ["ICP", "800 psi"], ["FCP", "425 psi"]], "ask": "If the pressure step-down graph/schedule is used, based on an average 14 psi per 100 strokes pumped, what would be the effect on bottom hole pressure after pumping kill mud down to the top of the 5-inch drill pipe?"}}, {"n": 320, "c": "B", "q": "What are indications that suggest blow through MGS may be about to occur?", "o": ["No change in hydrostatic seal pressure.", "Decrease in vent line pressure.", "Increasing trend in vent line pressure.", "Increasing trend in MGS temperature."], "a": 2, "e": "An increasing vent line pressure trend warns of blow-through."}, {"n": 321, "c": "S", "q": "Slow circulating rate pressure = 300 psi at 30 SPM The well has been shut in after a kick: Shut In Drill Pipe Pressure 600 psi Shut In Casing Pressure 750 psi Before starting to kill the well, there is a complete power failure at the pumps. Assuming no float valve in the drill string, which pressure should be kept constant in order to maintain the correct bottom hole pressure if the influx migrates?", "o": ["Casing pressure", "Slow circulating rate pressure", "Drill pipe pressure"], "a": 2, "e": "If the influx migrates after power failure, hold drill pipe pressure constant.", "f": {"s": "The well has been shut in after a kick.", "dt": [["Slow circulating rate pressure", "300 psi at 30 SPM"], ["Shut in drill pipe pressure", "600 psi"], ["Shut in casing pressure", "750 psi"]], "ask": "Before starting to kill the well, there is a complete power failure at the pumps. Assuming no float valve in the drill string, which pressure should be kept constant in order to maintain the correct bottom hole pressure if the influx migrates?"}}, {"n": 322, "c": "S", "q": "While tripping into the hole at 6,000 feet, a flow check is positive. The rig procedure is to shut the well in using the soft shut in procedure. What is the correct procedure to shut in?", "o": ["Close the BOP, Stab full opening safety valve, Close the safety valve, Open choke, Close choke, Record pressure", "Open HCR valve and choke, Close BOP, Stab full opening safety valve, Close safety valve, Close choke", "Stab full opening safety valve, Open HCR valve and choke, Close BOP, Close choke, Close safety valve, Record pressure", "Stab a full opening safety valve, Close the safety valve, Open HCR valve, Close BOP, Close choke"], "a": 3, "e": "Soft shut-in: stab and close the safety valve, open the HCR, close the BOP, then close the choke."}, {"n": 323, "c": "K", "q": "While continuously drilling ahead at 80 feet/hour: Bit diameter = 12\u00bc inches Open Hole capacity = 0.1458 bbls/foot Casing capacity = 0.152 bbls/foot Drill pipe capacity = 0.0178 bbls/foot Drill pipe displacement = 0.008 bbls/foot Pit level has decreased 4 bbls in the last hour. What action should be taken?", "o": ["Decrease ROP", "Continue drilling ahead", "Stop drilling and flow check, an influx may be occurring", "Inform supervisor there may be partial losses"], "a": 2, "e": "The pit change does not match the expected drilled volume: stop and flow check.", "f": {"s": "While continuously drilling ahead at 80 feet/hour:", "dt": [["Bit diameter", "12\u00bc inches"], ["Open hole capacity", "0.1458 bbls/foot"], ["Casing capacity", "0.152 bbls/foot"], ["Drill pipe capacity", "0.0178 bbls/foot"], ["Drill pipe displacement", "0.008 bbls/foot"]], "ask": "Pit level has decreased 4 bbls in the last hour. What action should be taken?"}}, {"n": 324, "c": "B", "q": "You are out of the hole changing the Bit when the well starts flowing. What action must you take to secure the well?", "o": ["Close the Blind or Blind/Shear rams", "Close the diverter and bullhead kill mud through the kill line", "Run one stand of collars into the well and close the Annular", "Run one stand of drill pipe or heavy weight drill pipe and close the pipe rams"], "a": 0, "e": "Out of the hole, close the blind or blind/shear rams."}, {"n": 325, "c": "P", "q": "How does unexpected abnormal pressure affect primary well control?", "o": ["Allows Driller to increase tripping speed per stand", "Increase surge pressure when tripping", "Decreases the overbalance", "Increases the \u2018trip-margin\u2019"], "a": 2, "e": "Unexpected abnormal pressure decreases the overbalance."}, {"n": 326, "c": "S", "q": "What is the definition of \u201cShut In Drill Pipe Pressure (SIDPP)\u201d?", "o": ["The total pressure in the annulus minus the bottom hole pressure", "The difference between hydrostatic pressure in the annulus and the formation pressure", "The difference between hydrostatic pressure in the drill string and the formation pressure"], "a": 2, "e": "SIDPP is the difference between formation pressure and drill string hydrostatic."}, {"n": 327, "c": "B", "q": "Which gas is commonly used to pre-charge the accumulator bottles on a BOP hydraulic control unit?", "o": ["Oxygen", "Air", "Carbon Dioxide (CO2)", "Nitrogen"], "a": 3, "e": "Nitrogen is used to pre-charge accumulator bottles."}, {"n": 328, "c": "M", "q": "The first circulation of the Driller\u2019s method has been completed and the pumps have been shut down. The Shut-in Casing Pressure (SICP) reads 300 psi higher than the Shut-in Drill Pipe Pressure (SIDPP). What action should be taken?", "o": ["Continue circulating and increase pump pressure by 300 psi with the choke", "Resume circulation and continue until all the influx is out of hole", "Bleed the SICP back until it equals the SIDPP", "Pump kill mud to the bit holding Casing pressure constant"], "a": 1, "e": "SICP higher than SIDPP: resume circulation and continue until the influx is out."}, {"n": 329, "c": "K", "q": "A gas kick enters the well and goes into solution in oil-based mud. At that time, what would you probably see on surface?", "o": ["A pit gain either equal to or smaller than the volume of the kick", "A decreasing flow rate and decreasing pit level", "An increasing flow rate and decreasing pit level", "A pit gain greater than the volume of the kick"], "a": 0, "e": "Gas in solution gives a pit gain equal to or smaller than the kick volume."}, {"n": 330, "c": "W", "q": "What is an inflow/negative pressure test?", "o": ["A test on a barrier where pressure on top of a barrier is increased to a value higher than the pressure below the barrier", "A test where the barrier is made to fail", "A test where a barrier is tested until there is leak-off", "A test on a barrier where pressure on top of a barrier is reduced to a value lower than the pressure below the barrier"], "a": 3, "e": "An inflow test reduces pressure on top of the barrier below the pressure beneath."}, {"n": 331, "c": "M", "q": "Why take and record Slow Circulation Rates (SCRs)?", "o": ["To stop downhole mud motor rotating during a well kill operation", "To calculate Initial and Final Circulating Pressures (ICP/FCP)", "To determine pump rate to displace a cement plug", "To calculate Maximum Allowable Annular Surface Pressure (MAASP)"], "a": 1, "e": "SCRs are used to calculate ICP and FCP."}, {"n": 332, "c": "K", "q": "When would a flow check most likely be carried out?", "o": ["Before increasing the pump rate", "Before the BHA is pulled through the stack", "After the Driller has increased the weight on bit", "After taking a slow circulation rate"], "a": 1, "e": "Flow check before the BHA is pulled through the stack."}, {"n": 333, "c": "W", "q": "Which of the following apply when running centralizers on casing?", "o": ["Keeps the casing fixed in the axial center of the well bore", "Increases chances of surging the well while running the casing", "Improves flow during cementing between casing strings", "All the above"], "a": 3, "e": "Centralizers keep casing centred, increase surge risk and improve cement flow."}, {"n": 334, "c": "M", "q": "What is a disadvantage of adding the safety-margin to the mud weight?", "o": ["Cannot be removed easily", "Reduces actual ICP below calculated value", "Increases MAASP at the shoe", "Drill pipe pressure is harder to control with the choke"], "a": 0, "e": "The safety margin cannot be removed easily."}, {"n": 335, "c": "W", "q": "A drilling break is observed while drilling ahead. A flow check was performed, and the well is flowing. Which barrier has failed?", "o": ["Mud Filter Cake", "Cement around the casing", "Mud hydrostatic", "Wellhead or Casing Head seals"], "a": 2, "e": "A flowing well after a flow check means mud hydrostatic has failed."}, {"n": 336, "c": "W", "q": "A 500-foot long cement plug is set inside the casing shoe. The mud in the hole is to be displaced with brine. What will be the reduction in hydrostatic pressure on top of the cement plug? Old mud density = 12.2 ppg Brine = 8.6 ppg Top of cement plug = 8,200 feet TVD/8,600 feet MD", "o": ["5,202 psi", "1,441 psi", "1,609 psi", "1,535 psi"], "a": 3, "e": "(12.2 - 8.6) x 0.052 x 8,200 = 1,535 psi.", "f": {"s": "A 500-foot long cement plug is set inside the casing shoe. The mud in the hole is to be displaced with brine.", "dt": [["Old mud density", "12.2 ppg"], ["Brine", "8.6 ppg"], ["Top of cement plug", "8,200 feet TVD / 8,600 feet MD"]], "ask": "What will be the reduction in hydrostatic pressure on top of the cement plug?"}}, {"n": 337, "c": "P", "q": "When pumping, how does Annular Pressure Loss affect Bottom Hole Pressure (BHP)?", "o": ["It will cause BHP to be less than hydrostatic pressure.", "It will have no effect on BHP.", "It will cause BHP to be greater than hydrostatic pressure."], "a": 2, "e": "Annular pressure loss adds to hydrostatic, so BHP is greater while pumping."}, {"n": 338, "c": "W", "q": "Which of the following is considered a \u201cprocedural / operational barrier\u201d?", "o": ["A set packer assembly", "The drilling fluid", "Running casing", "Proper BOP shut in procedure"], "a": 3, "e": "Proper BOP shut-in is a procedural barrier."}, {"n": 339, "c": "M", "q": "Which of the following statements about killing a well is correct?", "o": ["Keep BHP equal to or greater than formation pressure", "Keep BHP constant by holding shut in drill pipe constant at start-up", "Keep BHP constant by controlling pump rate", "Keep BHP at least equal to initial circulating pressure"], "a": 0, "e": "Keep BHP equal to or greater than formation pressure."}, {"n": 340, "c": "M", "q": "During a trip out, the well kicks due to swabbing. The pipe is stripped back to bottom. What minimum mud weight will control the well?", "o": ["Kill Mud weight based on SICP before stripping", "The original mud weight", "Kill Mud weight based on SIDPP before stripping", "Kill Mud weight based on difference between SIDPP and SICP before stripping"], "a": 1, "e": "With the pipe on bottom the original mud weight is the minimum needed."}, {"n": 341, "c": "O", "q": "A well kill operation is in progress. The Driller is coming to the end of the \u2018Tour\u2019. What would the Driller do to give the most effective handover?", "o": ["Instruct the relief to work with the derrickhand in the pit room", "Write down the key points of the handover and discuss each point", "Think about what will be told to the relief at the end of the shift", "Write down the key points of the handover and file properly"], "a": 1, "e": "Write down key points and discuss each one."}, {"n": 342, "c": "M", "q": "A salt-water kick is circulated out using the Driller's Method. When will the surface casing pressure be at its maximum value? (Assume Mud weight in hole is greater than influx weight.)", "o": ["When the kick reaches the casing shoe", "When the kill mud is pumped into the drill pipe", "When the annular geometry causes the influx to have the maximum height", "When the kick has been circulated to the surface"], "a": 2, "e": "For salt water, casing pressure is highest when the influx has maximum height in the annulus."}, {"n": 343, "c": "P", "q": "When should you recalculate the Maximum Allowable Annular Surface Pressure (MAASP)?", "o": ["After a mud weight change", "After a bit change", "Every tour", "After every 300 to 500 feet drilled"], "a": 0, "e": "Recalculate MAASP after a mud weight change."}, {"n": 344, "c": "W", "q": "If a self-fill float in the casing gets plugged and the casing is not filling, what is a potential well control risk?", "o": ["Unable to pump LCM", "Losses may occur due to higher mud level in the annulus", "No change in risk", "If the plug suddenly clears, then the mud level in the annulus will drop"], "a": 3, "e": "If a plugged float suddenly clears, the annulus level drops."}, {"n": 345, "c": "M", "q": "What would happen to the surface pressures if the pop-off valve on the pump activates while circulating out a kick?", "o": ["Slow drop in drill pipe pressure and an increase in casing pressure", "Rapid drop in drill pipe pressure with no change to casing pressure", "Rapid drop in drill pipe pressure and a drop in casing pressure", "Rapid drop in casing pressure with no change to drill pipe pressure"], "a": 2, "e": "A pop-off opening drops DP pressure rapidly and casing pressure follows."}, {"n": 346, "c": "B", "q": "What equipment needs to be on the top of the drill string before stripping in the hole to get below an influx?", "o": ["An inside BOP", "A full opening safety valve (open) with an inside BOP installed on top", "An inside BOP with a full opening safety valve (closed) on top", "A full opening safety valve (closed)"], "a": 1, "e": "A FOSV (open) with an IBOP on top is needed before stripping in."}, {"n": 347, "c": "M", "q": "At what stage during a kill operation can the choke pressure reading exceed MAASP without breaking down the formation at the shoe?", "o": ["When the influx is in the open hole section", "When the kill mud is at the bit", "When the influx is on bottom", "When the influx is above the casing shoe"], "a": 3, "e": "Choke pressure can exceed MAASP once the influx is above the shoe."}, {"n": 348, "c": "B", "q": "What should be considered when selecting an annular packing element?", "o": ["Desired hydraulic closing pressure", "Type of \u2018hard-banding\u2019 used", "Minimum pipe outside diameter", "Compatibility with drilling fluid"], "a": 3, "e": "Fluid compatibility matters when selecting a packing element."}, {"n": 349, "c": "M", "q": "Which is a fundamental objective when circulating out a kick?", "o": ["Hold surface pressure as close to MAASP as possible", "Bullhead to remove influx faster", "Maintain constant bottom hole pressure equal to or greater than formation pressure", "Pump at a kill rate equal to or greater than drilling rate"], "a": 2, "e": "Maintain constant BHP at or above formation pressure."}, {"n": 350, "c": "B", "q": "What happens when functioning the High Pressure By-Pass button or handle on the Driller's remote BOP control panel on a surface BOP installation?", "o": ["Increases the hydraulic annular pressure to the existing accumulator pressure", "Increases the hydraulic manifold pressure to the existing accumulator pressure", "Increases the manifold pressure to 2000 psi", "Increases the accumulator pressure to 3000 psi"], "a": 1, "e": "The high pressure bypass raises manifold pressure to accumulator pressure."}, {"n": 351, "c": "B", "q": "Before cutting the drilling line, with the bit at the casing shoe, which item of equipment must be installed to improve well control capability?", "o": ["Inside blowout preventer", "Drop in check valve", "Circulating head", "Full Opening Safety Valve"], "a": 3, "e": "Install a FOSV before cutting the drilling line."}, {"n": 352, "c": "B", "q": "On the Driller\u2019s air operated panel for a surface BOP, the ram is closed and the following was observed: 1. Open light went out. 2. Close light came on. 3. Annular pressure did not change. 4. Manifold pressure decreased and later returned to the original operator pressure. 5. Accumulator pressure decreased to 2,500 psi and remained steady. What is the most probable cause of the problem?", "o": ["There is a blockage in the hydraulic line connecting the BOP to the BOP control unit", "The pressure switch or the pumps on the BOP control unit did not work", "The selector valve (3-position/4-way valve) is stuck in the open position", "Electric position switches are malfunctioning"], "a": 1, "e": "The pressure switch or pumps did not work: accumulator stays at 2,500 psi.", "f": {"s": "On the Driller's air operated panel for a surface BOP, the ram is closed and the following was observed:", "li": ["Open light went out.", "Close light came on.", "Annular pressure did not change.", "Manifold pressure decreased and later returned to the original operator pressure.", "Accumulator pressure decreased to 2,500 psi and remained steady."], "ask": "What is the most probable cause of the problem?"}}, {"n": 353, "c": "B", "q": "What pressure must be kept in the annular BOP closing chamber during stripping operation?", "o": ["300 psi less than the pipe ram closing pressure", "Minimum 500 psi", "The minimum pressure to maintain a seal", "The maximum pressure that allows the tool joint to go through the packing with a loss of 30,000 lbs of hook load"], "a": 2, "e": "Use the minimum closing pressure that maintains a seal."}, {"n": 354, "c": "S", "q": "What effect does gas migration have on pressures in a shut-in wellbore?", "o": ["All the pressures decrease", "All the pressures increase", "All the pressures stay the same"], "a": 1, "e": "With migration in a shut-in well, all pressures increase."}, {"n": 355, "c": "S", "q": "Which of the following parameters will affect the Shut In Casing Pressure?", "o": ["Slow circulating rate pressure", "Drill string capacity per foot", "Annulus capacity per foot", "Choke line length"], "a": 2, "e": "SICP depends on annulus capacity per foot."}, {"n": 356, "c": "W", "q": "Which of the following would increase the risk of surging the well while running casing?", "o": ["Low gel strength mud", "Tighter casing to wellbore clearance", "Lower Casing grade", "Slower running speed"], "a": 1, "e": "Tighter casing clearance increases surge risk."}, {"n": 357, "c": "M", "q": "You have pumped the calculated amount of Kill Weight Mud (KWM) during the beginning of the wait and weight method. It is decided to shut the pumps down and check pressures. You notice there is still pressure on the Drill Pipe gauge. You tested for trapped pressure but the drill pipe pressure returned back to the same value. What could you do?", "o": ["Continue circulating then shut in and check again", "Continue pumping, the KWM has not reached surface, therefore the well is not killed", "KWM has caused an overbalance in the well, trapping excess pressure", "Nothing, due to KWM there is a U-tube effect causing increased Drill Pipe Pressure"], "a": 0, "e": "If pressure returns after the trapped pressure test, continue circulating, shut in and check again."}, {"n": 358, "c": "O", "q": "Which of the following is true regarding kick detection during wireline operations?", "o": ["The well should be lined up to active pits due to the large displacement volumes of wireline tools.", "The well should be put on the trip tank to monitor displacement as wireline is run in/out of the hole.", "Wireline operators assume primary responsibility for kick detection during the wireline operation.", "There is no need to monitor the well during wireline operations because the well is static."], "a": 1, "e": "Kick detection during wireline uses the trip tank."}, {"n": 359, "c": "M", "q": "During the first circulation of the Driller\u2019s Method, a gas bubble is being circulated up the annulus above the casing shoe. The drillpipe pressure is being held constant at the correct pressure. What happens to the casing shoe pressure?", "o": ["Casing shoe pressure decreases", "Casing shoe pressure increases", "Casing shoe pressure stays constant"], "a": 2, "e": "With the correct DP pressure held, shoe pressure stays constant while gas is above the shoe."}, {"n": 360, "c": "M", "q": "While conducting the first circulation of the Driller\u2019s Method, the Derrickman states that the barite supply is plugged. What action should be taken?", "o": ["Continue circulating even if current mud weight cannot be maintained", "Inform supervisor to shut in well, as the problem will reduce bottom hole pressure during the first circulation", "Continue circulating as long as current mud weight can be maintained", "Instruct crew to add Bentonite to increase the mud weight"], "a": 2, "e": "Continue circulating only while current mud weight can be maintained."}, {"n": 361, "c": "M", "q": "During the first circulation of the Driller\u2019s method, the drill pipe pressure suddenly increased and the casing pressure stayed relatively constant. What could be the problem?", "o": ["Choke plugged", "Pump failure", "Choke washout", "Plugged bit
