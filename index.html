nozzle"], "a": 3, "e": "DP pressure jump with casing steady: a plugged bit nozzle."}, {"n": 362, "c": "O", "q": "What is a well kill plan?", "o": ["Final report to town on the completed kill operation with updated chemical stock levels", "A completed Kill Sheet", "Document stating kill method to use and barite stock levels", "Document stating duties, procedures, lines of communication and safety requirements for the kill operation"], "a": 3, "e": "A kill plan states duties, procedures, communication and safety requirements."}, {"n": 363, "c": "M", "q": "How does gas migration affect the choice of pump rate to be used during bullheading?", "o": ["Gas migration has no effect on the choice of pump rate", "Choose a pump rate that creates a fluid velocity greater than the rate of gas migration", "Choose an annular velocity less than the rate of gas migration", "Choose a pump rate of 2 bbls/min regardless of gas migration"], "a": 1, "e": "Use a pump rate whose velocity exceeds the gas migration rate."}, {"n": 364, "c": "M", "q": "The pump was shut down part way through the first circulation of the Driller\u2019s Method. The drill pipe pressure (DPP) now reads 525 psi and the casing pressure (CP) now reads 700 psi. Well Information Shut in drill pipe pressure = 450 psi Shut in casing pressure = 600 psi Initial Circulating Pressure = 800 psi Mud Weight = 11.2 ppg How much overbalance is currently on the well?", "o": ["100 psi", "75 psi", "175 psi", "150 psi"], "a": 1, "e": "Overbalance = current DP pressure 525 - SIDPP 450 = 75 psi.", "f": {"s": "The pump was shut down part way through the first circulation of the Driller's Method. The drill pipe pressure (DPP) now reads 525 psi and the casing pressure (CP) now reads 700 psi.", "dt": [["Shut in drill pipe pressure", "450 psi"], ["Shut in casing pressure", "600 psi"], ["Initial circulating pressure", "800 psi"], ["Mud weight", "11.2 ppg"]], "ask": "How much overbalance is currently on the well?"}}, {"n": 365, "c": "K", "q": "While tripping out of the hole in a vertical well, improper hole fill is noted. The bit is 1,900 feet off bottom. Positive flow was noted and the BOP was closed. Pressures have stabilized. What action should be taken?", "o": ["Strip five more stands out and re-evaluate the situation", "Line up on the choke prepare for the Wait and Weight Method", "Prepare to strip back to bottom to perform a kill operation", "Line up on the choke prepare for the Driller\u2019s Method"], "a": 2, "e": "Strip back to bottom to kill."}, {"n": 366, "c": "M", "q": "While killing a well using the Driller\u2019s method, the pressure in the mud gas separator starts to increase. The drill pipe pressure is 680 psi @ 40 SPM. The pump rate is decreased while maintaining 680 psi on the standpipe. What effect will this have on bottom hole pressure?", "o": ["Bottom home pressure will increase at first and then decrease", "Bottom hole pressure will stay the same", "Bottom hole pressure will decrease", "Bottom hole pressure will increase"], "a": 3, "e": "Reducing the rate while holding the standpipe pressure raises BHP."}, {"n": 367, "c": "P", "q": "What effect does increasing pressure have on fluid density?", "o": ["It decreases the fluid density", "It increases the fluid density", "It does not affect the fluid density"], "a": 1, "e": "Increasing pressure increases fluid density."}, {"n": 368, "c": "M", "q": "While circulating the gas influx inside the casing, the casing pressure approaches the MAASP, what should you do?", "o": ["Stop the kill procedures, and bleed off to MAASP thereby reducing the risk of formation breakdown", "Continue with the correct kill procedure, the increasing casing pressure will not cause formation breakdown", "Continue with the kill procedures, but use the automatic MAASP control to prevent formation breakdown", "Continue with the kill procedure, but open the choke as needed to maintain casing pressure equal to MAASP thereby risking additional influx"], "a": 1, "e": "Continue the kill as planned: with the correct procedure BHP is held and the pressure rise is expected (keyed answer)."}, {"n": 369, "c": "K", "q": "What type of drilling conditions can make it more difficult to see/detect an influx?", "o": ["Drilling low permeability formations with water-based mud", "Drilling high permeability formations with water-based muds", "Drilling low permeability formations with oil-based muds", "Drilling high permeability formations with oil-based muds"], "a": 2, "e": "Low-permeability formations with oil-based mud make influx hard to see."}, {"n": 370, "c": "O", "q": "Which of the following is the most important reason for good handover procedures between crews during well control operations?", "o": ["To allow blame to be assigned in the event of an incident during well kill operations", "It is a regulatory form that must be completed and turned into the local regulatory agency", "Ensure continuity in operations and pass on trend information to identify potential problems", "Handover procedures are not considered important during well control operations"], "a": 2, "e": "Handover ensures continuity and passes on trend information."}, {"n": 371, "c": "O", "q": "Why is it important to inform the Driller when starting or stopping the degasser or desilter?", "o": ["Mud viscosity will be reduced", "Shakers will need to be by-passed", "Pit volume will change", "Flow Rate will increase from the well"], "a": 2, "e": "Starting or stopping solids equipment changes pit volume."}, {"n": 372, "c": "M", "q": "Which statement about slow circulating rates (SCRs) is correct?", "o": ["SCRs are needed to calculate formation pressure", "SCRs should be taken with the bit at the Shoe", "SCRs should be taken when mud properties have changed", "SCRs should be taken through the choke manifold"], "a": 2, "e": "Retake SCRs when mud properties change."}, {"n": 373, "c": "P", "q": "What is Bottom Hole Pressure (BHP)?", "o": ["The total pressure exerted by the pumps.", "The formation pressure at the bottom of the hole.", "Hydrostatic pressure minus annular pressure loss.", "The total pressure exerted on the bottom of the hole."], "a": 3, "e": "BHP is the total pressure exerted on the bottom of the hole."}, {"n": 374, "c": "S", "q": "A well is shut-in on a kick with the bit on-bottom. Which pressure gauge reading should be used to calculate the formation pressure?", "o": ["The choke manifold pressure gauge", "The drill pipe pressure gauge on the Driller\u2019s panel", "The casing pressure gauge on the choke panel", "The drill pipe pressure gauge on the choke panel"], "a": 3, "e": "Use the drill pipe gauge on the choke panel to calculate formation pressure."}, {"n": 375, "c": "P", "q": "Surface Leak off Pressure = 1,000 psi Casing Shoe Depth = 7,500 feet TVD/MD = 8,000 feet Test Mud Weight =11 ppg What is the fracture pressure at the casing shoe?", "o": ["5,290 psi", "5,425 psi", "6,100 psi", "4,200 psi"], "a": 0, "e": "FP = 1,000 + 11 x 0.052 x 7,500 = 5,290 psi.", "f": {"dt": [["Surface leak-off pressure", "1,000 psi"], ["Casing shoe depth", "7,500 feet TVD/MD = 8,000 feet"], ["Test mud weight", "11 ppg"]], "ask": "What is the fracture pressure at the casing shoe?"}}, {"n": 376, "c": "P", "q": "What is the percentage of void space in a formation?", "o": ["Shale Density", "Porosity", "Permeability", "Low Pressure Formation"], "a": 1, "e": "Porosity is the percentage of void space."}, {"n": 377, "c": "P", "q": "Current Mud Weight (MW) is 11.5 ppg. After pumping a 35 bbl slug weighing 13.5 ppg with a Drill Pipe capacity of 0.0178 bbls/ft, how many feet of dry pipe will there be after the slug equalizes?", "o": ["321 feet", "84 feet", "34 feet", "342 feet"], "a": 3, "e": "Dry pipe = 35 x (13.5 - 11.5) / 11.5 / 0.0178 = about 342 ft."}, {"n": 378, "c": "K", "q": "A Pressure While Drilling (PWD) Tool can provide information that indicates a reduction in ECD during drilling operations. What might cause the reduction in ECD while drilling?", "o": ["A reduction of hydrostatic pressure with formation fluids contaminating the mud in the annulus", "An increase in overbalance due to a formation pressure decrease", "A change in wellbore azimuth and elevation", "A change in Rate of Penetration (ROP)"], "a": 0, "e": "Contaminated annular mud reduces hydrostatic, so a PWD tool shows reduced ECD."}, {"n": 379, "c": "M", "q": "A kill operation is ready to start. Kill mud is ready to be pumped, but it takes 10 bbls to fill the surface lines. What is a recommended practice?", "o": ["Subtract the 10 bbls (converted to pump strokes) from the total strokes to be pumped", "Open choke fully and pump the 10 bbls, then adjust drill pipe pressure to initial circulating pressure", "Ignore it. Start the kill operation. It will not affect the drill pipe pressure schedule", "Re-zero stroke counter when kill mud reaches the drill pipe"], "a": 3, "e": "Re-zero the stroke counter when kill mud reaches the drill pipe."}, {"n": 380, "c": "P", "q": "What can increase the risk of exceeding MAASP during a kill operation?", "o": ["Large difference between formation breakdown pressure and mud hydrostatic pressure", "Small influx", "Long open hole section", "Short open hole section"], "a": 2, "e": "A long open hole section increases the risk of exceeding MAASP."}, {"n": 381, "c": "K", "q": "What data that could indicate abnormal pressure does the Mud Logger normally measure?", "o": ["Gas level in the mud", "Strokes per minute", "Weight on Bit", "Hook Load"], "a": 0, "e": "The mud logger measures gas level in the mud."}, {"n": 382, "c": "M", "q": "Why is it important to monitor the pit volume during a well control circulation?", "o": ["To indicate when to adjust drill pipe pressure while circulating", "To indicate when to adjust pump speed while circulating", "To compare actual volumes to expected volumes while circulating", "To maintain bottom hole pressure constant while circulating"], "a": 2, "e": "Compare actual pit volumes with the expected volumes to spot gas expansion, losses or a new influx.", "corr": 1}, {"n": 383, "c": "M", "q": "When on a surface stack, when is the Volumetric Method complete?", "o": ["When all gas has been bleed from the well", "When casing pressures equals SIDPP", "When gas reaches surface", "Casing pressure stops increasing and gas reaches surface"], "a": 3, "e": "Volumetric is complete when casing pressure stops increasing and gas reaches surface."}, {"n": 384, "c": "S", "q": "During the first circulation of the Driller\u2019s Method, the rig experienced total pump failure. The well is shut down and pressures are: SIDPP = 500 psi and SICP = 750 psi. While shut down, the drill pipe and casing pressures start to increase due to gas migration. If the choke is used to keep casing pressure constant while a kick is migrating, what would happen to BHP?", "o": ["Increase", "Decrease", "Stay the same"], "a": 1, "e": "Holding casing pressure constant while gas migrates lets BHP decrease.", "f": {"s": "During the first circulation of the Driller's Method, the rig experienced total pump failure. The well is shut down and pressures are:", "dt": [["SIDPP", "500 psi"], ["SICP", "750 psi"]], "s2": "While shut down, the drill pipe and casing pressures start to increase due to gas migration.", "ask": "If the choke is used to keep casing pressure constant while a kick is migrating, what would happen to BHP?"}}, {"n": 385, "c": "B", "q": "Why might the High Pressure By-Pass valve on the surface BOP control unit be functioned?", "o": ["To enable full accumulator pressure to be placed on the Annular Preventer", "To bleed the accumulator pressure", "To bleed pressure from the wellhead", "To increase the likelihood of a shear and seal"], "a": 3, "e": "The high pressure bypass increases the likelihood of a shear and seal."}, {"n": 386, "c": "B", "q": "A ram preventer was operated from the remote panel. Both accumulator and manifold pressures dropped and later returned to normal pressure. The open light went out and the close light did not illuminate. What is the probable cause of the problem?", "o": ["Air pressure too low", "Leak in the system", "Fault in the close light electrical circuit", "Close line is blocked"], "a": 2, "e": "Pressures dropped and recovered but no close light: a fault in the close light circuit."}, {"n": 387, "c": "M", "q": "While circulating out a kick, the casing pressure approaches the MAASP while the influx is still in the open hole. What is the first thing that should be done?", "o": ["Continue pumping at the same SPM. The MAASP is only a problem when the influx is inside casing", "Keep the casing pressure at the MAASP by opening the choke", "Minimize any extra pressure in the annulus without allowing the bottom hole pressure to fall below the pore pressure", "Start pumping mud down the drill string at 1 ppg higher than needed to kill"], "a": 2, "e": "Minimise extra annulus pressure without letting BHP fall below pore pressure."}, {"n": 388, "c": "M", "q": "What is a procedure to follow when using the Driller\u2019s method?", "o": ["Anytime starting, stopping, or changing pump speed, maintain drill pipe pressure constant", "With pumps running at kill rate, hold the surface pressure constant on the side of the U-tube that has the constant fluid density", "Always pump kill mud on the first circulation", "With pumps running at kill rate, hold the surface pressure constant on the side of the U-tube that has varying fluid density"], "a": 1, "e": "Hold pressure on the side of the U-tube with constant fluid density."}, {"n": 389, "c": "B", "q": "The well kicks when tripping. What statement is true if a non-return valve is stabbed into the string?", "o": ["Has to be pumped open to read Shut In Drill Pipe Pressure", "Easier to stab if strong flow is encountered up the drill string", "Has potential to leak through the open/close key", "Must not be run in the hole in the closed position"], "a": 0, "e": "The valve has to be pumped open to read SIDPP."}, {"n": 390, "c": "M", "q": "While conducting the first circulation of the Driller\u2019s method, drill pipe pressure has been maintained at Initial Circulating Pressure of 560 psi. Choke pressure has been holding around 460 psi for the last 15 minutes. A sudden spike in drill pipe pressure to 700 psi is observed. Choke pressure stays the same at 460 psi. What type of problem has most likely occurred?", "o": ["A washout has occurred in the drill pipe", "A bit nozzle has partially plugged", "The choke is plugging up", "A bit nozzle has washed out"], "a": 1, "e": "DP pressure spike with choke steady: a partially plugged bit nozzle."}, {"n": 391, "c": "S", "q": "While tripping out wet, the well was shut in. SICP and SIDPP are both 100 psi and rising equally. Which of the following is most likely?", "o": ["A heavy cuttings load is in the annulus", "Ballooning", "Gas is in the drillpipe", "Gas influx below the bit"], "a": 3, "e": "SICP and SIDPP equal and rising: gas influx below the bit."}, {"n": 392, "c": "P", "q": "Which density measuring device should be used when a fluid has entrained air and/or gas?", "o": ["A triple beam mud balance", "Hydrometer", "Pressurized Balance", "Atmospheric Balance"], "a": 2, "e": "Use a pressurised mud balance with entrained air or gas."}, {"n": 393, "c": "O", "q": "When the well kicks, what operating practice would lead to a bigger influx when shutting-in the well?", "o": ["Regular pit drills for the drill crew.", "Testing stab in valves during BOP tests.", "Calling the Toolpusher to the floor before shutting in the well.", "Regular training for the Derrickman on the duties for monitoring pit level."], "a": 2, "e": "Calling the Toolpusher before shutting in delays shut-in and enlarges the influx."}, {"n": 394, "c": "D", "q": "During a MPD connection, what surface applied back pressure is required to balance a 10.5 ppg formation at 14,000' MD/10,000' TVD, given: Mud density: 9.6 ppg APL: 175 psi", "o": ["480 psi", "293 psi", "655 psi", "468 psi"], "a": 1, "e": "(10.5 - 9.6) x 0.052 x 10,000 = 468 psi, minus APL 175 = 293 psi.", "f": {"s": "During a MPD connection, what surface applied back pressure is required to balance a 10.5 ppg formation at 14,000' MD/10,000' TVD, given:", "dt": [["Mud density", "9.6 ppg"], ["APL", "175 psi"]]}}, {"n": 395, "c": "P", "q": "Why is it important to maintain the correct Bottom Hole Pressure (BHP)?", "o": ["If BHP increases, the risk of a kick increases.", "If BHP is not allowed to increase when drilling a transition zone, the risk of losses increase.", "If BHP decreases, the risk of a kick increases.", "If BHP decreases, the risk of losses increases."], "a": 2, "e": "If BHP decreases, the risk of a kick increases."}, {"n": 396, "c": "M", "q": "The Driller\u2019s Method is used to kill a salt-water kick. What will happen to the casing pressure when the influx moves up the annulus? (Assume Mud weight in the hole is greater than the influx weight.)", "o": ["Salt water will behave in the same way as a gas influx", "Casing pressure will slowly decrease as influx is circulated up the annulus", "Casing pressure will only change due to changes in annulus size", "As influx expands Casing Pressure will increase"], "a": 2, "e": "Salt water does not expand, so casing pressure changes only with annulus size."}, {"n": 397, "c": "M", "q": "You are displacing the drill string with kill weight mud. Which section of drill pipe, listed below, will have the quickest displacement time per foot?", "o": ["5 inch with and ID of 4.276 inch", "6 5/8 inch with an ID of 5.761 inch", "6 5/8 inch with an ID of 5.965 inch", "4 inch with an ID of 3.240 inch"], "a": 3, "e": "The smallest ID has the lowest capacity per foot and the quickest displacement."}, {"n": 398, "c": "P", "q": "A kick is:", "o": ["An unplanned flow of formation fluids from the reservoir into the wellbore", "The increase in shut in pressure due to gas migration", "The increase in pressure on bottom when the pumps are started", "An uncontrolled flow of formation fluids at the surface"], "a": 0, "e": "A kick is an unplanned flow of formation fluids into the wellbore."}, {"n": 399, "c": "B", "q": "Which statement about the annular preventer is true?", "o": ["It is designed for hanging off drill pipe", "Will prevent tool joints from being stripped into the well", "It is designed to seal around any shape of tubular or tool in the well bore", "Will allow reciprocating the drill string while maintaining a seal against well bore pressure"], "a": 3, "e": "The annular allows reciprocating the string while holding a seal."}, {"n": 400, "c": "W", "q": "What is a hydrostatic barrier?", "o": ["A column of fluid that is continuously monitored and exerts a pressure equal to or greater than the formation pressure", "A mechanical seal inside the casing or wellbore to isolate potential flow", "Cement located in the open-hole or casing to isolate different zones", "Pressure of fluid in a Pipe Ram closing chamber that maintains a seal on a shut-in well"], "a": 0, "e": "A hydrostatic barrier is a monitored fluid column at or above formation pressure."}, {"n": 401, "c": "O", "q": "How can a pill be spotted in the correct place?", "o": ["Stop pumps as soon as you see Casing Pressure increase.", "Calculate displacement of drillpipe and each annular section the pill must go through. Then convert to strokes.", "Stop pumps when shut-in casing pressure has dropped by 150 psi.", "Allow pill to drop; hydrostatic will balance itself."], "a": 1, "e": "Calculate displacement of the pipe and each annular section, then convert to strokes."}, {"n": 402, "c": "O", "q": "After successfully shutting in on a kick, which of the following is a key task that the Supervisor must complete before starting to circulate out the influx?", "o": ["Check Pit Levels and lineups", "Mix Kill Weight Mud", "Measure Mud Weight in and out", "Discuss the well control plan and reinforce individual crew duties"], "a": 3, "e": "Before circulating, the supervisor discusses the well control plan and reinforces crew duties."}];
const REV={"K": {"s": [["Theory", ["Primary well control is the mud hydrostatic pressure. A kick occurs when bottom hole pressure falls below formation pressure and the formation is permeable enough to flow.", "Causes of a kick: mud weight too low, swabbing, not keeping the hole full on trips, lost circulation, abnormal pressure drilled unexpectedly, gas-cut mud, drilling into a charged zone, and shallow gas.", "Positive (primary) indicators: flow rate increase, pit gain, well flowing with the pumps off, improper hole fill on trips. Treat any of these as a kick until proven otherwise.", "Possible (secondary) indicators: drilling break, change in pump pressure or pump speed, torque and drag change, cuttings size and shape change, gas-cut mud, chloride and temperature changes.", "Gas-cut mud at surface does not reduce hydrostatic much at depth, because gas expands mainly close to surface. The risk is the gas that has already entered.", "Swab pressure reduces BHP when pipe is pulled; surge pressure raises it when pipe is run. Speed, mud properties, clearance and a balled bit all increase both.", "Detection rule: act on the first sign. A flow check costs minutes; a late shut-in costs a larger influx, higher pressures and more risk."]], ["At a glance", ["This topic tests how early you recognise a kick and how correctly you react in the first minutes.", "Know the primary and secondary indicators, what a flow check proves, and how to tell a kick from ballooning.", "Questions are mostly about the right first action: stop, flow check, shut in, record, report.", "Trend changes and the order of actions matter more than any single number."]], ["Spotting a kick early", ["Flow rate increase (flow sensor) is normally the first kick indicator. Pit gain, flow with pumps off, and improper hole fill follow.", "Detect early: a smaller influx means a lower SICP and an easier kill.", "Monitor pit level and flow rate while drilling, on connections and while running in.", "Drilling break, with or without a pump pressure change: check for flow. If the flow check is inconclusive, shut the well in.", "Pit level should rise with the volume drilled. No change, or a change that does not match the drilled volume, is unexpected: stop and flow check.", "Pit gain or an increase in mud gas: flow check, call the supervisor, and shut in if the well is flowing."]], ["Tripping", ["Use the trip tank. It is the most sensitive and accurate measure of small gains or losses.", "Flow check before pulling out of the hole and before the BHA is pulled through the stack.", "Gain on the trip tank or improper hole fill while tripping out or pulling wireline: alert the crew, flow check, shut in if flowing. It may be a swabbed-in influx.", "Not filling the hole properly while tripping out can bring in a shallow influx.", "Swabbed kick with the bit off bottom: strip back to bottom, then kill."]], ["Warning signs and trends", ["Early indicators of rising pore pressure: ROP, torque and RPM trends change. In a transition zone ROP increases gradually and shale cuttings bulk density decreases.", "Background gas is a lagging indicator: it is seen after the change has been drilled. Rising connection gas is reduced by a small mud weight increase.", "Fingerprint the well: record baseline data (flowback, pit changes, connection gas) to compare with current data. Fingerprint connections in a transition zone.", "A PWD tool measures annular pressure and ECD downhole. An influx or contaminated annular mud lowers the annular density, so PWD shows reduced ECD.", "Oil-based mud hides kicks: gas dissolves, so the pit gain is equal to or smaller than the kick volume. Low permeability formations make influx hard to see.", "Shallow gas: control the rate of penetration to limit the gas loaded into the annulus."]], ["Ballooning versus a kick", ["Ballooning is preceded by fluid losses while circulating (annular friction raises BHP), with flow back when the pumps stop.", "If SICP is greater than APL, it is a real kick, not ballooning.", "If flowback keeps increasing, or pressure rebuilds higher after each bleed, it is a kick. Bleeding back a kick lets more influx enter.", "When in doubt, flow check, then shut in and follow the shut-in procedure. Record pressures and pit gain and notify the supervisor."]], ["Losses", ["Total loss of returns: stop drilling, top-fill the annulus with base fluid (water for water-based mud) or the lightest mud, record the volume and monitor the level to avoid going underbalanced."]], ["Exam traps", ["A flow check is a decision tool: if the well flows, or you cannot prove it is static, shut in.", "A drilling break with a change in pump pressure: stop and check for flow before circulating bottoms-up.", "Pit gain with pumps off and no transfers is an influx until proven otherwise. Losses can hide a kick.", "Ballooning gives a flowback that declines with time. A kick gives a flow that keeps going or a shut-in pressure above the annular pressure loss.", "Gas in the mud, connection gas and trip gas are warnings of a lower overbalance, not proof of a kick."]]], "f": [["Mud gas and shakers", "Cuttings and cavings at the shakers show wellbore conditions. The mud logger measures gas level in the mud."]]}, "S": {"s": [["Theory", ["Think of the well as a U-tube: the drill string on one side, the annulus on the other. When shut in, BHP = hydrostatic in the string + SIDPP = hydrostatic in the annulus + SICP.", "The string is normally full of clean mud, so SIDPP is the more reliable gauge for formation pressure. SICP also carries the weight of the influx in the annulus.", "A hard shut-in closes the BOP with the choke closed. A soft shut-in closes the BOP with the choke open, then closes the choke. Follow the rig policy.", "Pressures take time to stabilise. A float valve traps pressure, so SIDPP must be found by slowly pumping until the float opens, or by another approved procedure.", "Trapped pressure is pressure held in the well that is not formation pressure. If it is not bled off, the kill mud weight will be calculated too high.", "Gas migrates upward at a rate that depends on the mud, from a few hundred to about 2,000 ft per hour; a gas bubble that cannot expand raises BHP and all surface pressures.", "Never let casing pressure exceed MAASP during the shut-in period without a plan: bleeding off must be done in controlled steps while maintaining BHP."]], ["At a glance", ["This topic covers what to do after shut-in and what the gauges tell you.", "Know how to read SIDPP and SICP, why SICP is normally higher than SIDPP for a gas kick, and what gas migration does.", "Know what a float valve changes and how to find SIDPP when the string has one.", "Expect questions on pressures after the first and second circulation of the Driller's Method."]], ["Shutting in", ["Shut in quickly to minimise the size of the influx.", "Hard shut-in while tripping: stab and close the full-opening safety valve, close the BOP, open the HCR, record pressures. Soft shut-in: stab and close the safety valve, open the HCR, close the BOP, then close the choke.", "After shut-in, first check the well is secure with no leaks. Record SIDPP, pit gain and initial SICP.", "Read initial pressures at the choke control panel. If the DP and casing gauges disagree, use neither until the difference is investigated."]], ["What the pressures mean", ["SIDPP = formation pressure minus the hydrostatic in the drill string. Mud weight in the string affects it. It is not affected by kick size.", "SICP = annular hydrostatic minus formation pressure. It depends on formation pressure and annulus capacity per foot. A smaller kick gives a lower SICP.", "SICP is higher than SIDPP in a vertical well because the lighter influx is in the annulus. SIDPP below SICP is normal.", "With the bit above the influx (influx below the bit), SIDPP and SICP are the same.", "Trapped pressure (well shut in before the pumps are fully off) raises all pressures in the wellbore."]], ["Gas migration", ["Migrating gas that cannot expand raises all shut-in pressures, bottom hole pressure included. Rising shut-in pressures indicate gas migration.", "With a float in the string, DP pressure reads zero. Pump slowly, stop when casing pressure begins to rise, read the DP pressure and subtract any overbalance. A casing rise during this test must be subtracted from the reading.", "If you hold casing pressure constant while gas migrates, the gas expands and BHP decreases. If the drill pipe is clear of influx, hold DP pressure constant to keep BHP constant.", "Gas expands as pressure falls, so its volume increases as it is circulated up."]], ["Odd pressure behaviour", ["Drill pipe and casing pressure building, then dropping quickly: a weak formation has broken down.", "Bleed off trapped pressure in stages at the choke and watch for rebuild to tell trapped pressure from a live well."]], ["Exam traps", ["Record SIDPP, SICP and pit gain once pressures have stabilised. Do not use a rising pressure as the shut-in reading.", "Gas migration in a closed well raises both pressures at the same rate. Do not mistake it for a larger kick.", "With a float, the drill pipe gauge can read zero. Bring the pump up slowly while holding casing pressure constant to find SIDPP.", "After the first circulation of the Driller's Method, an influx that is out leaves SICP equal to SIDPP. A higher casing reading means influx remains or pressure is trapped.", "Casing pressure alone never gives formation pressure. Use SIDPP with the mud in the string."]]], "f": [["SICP from densities", "SICP = (formation pressure equivalent mud weight - annular fluid weight) x 0.052 x TVD."]]}, "M": {"s": [["Theory", ["Constant BHP methods hold bottom hole pressure at or slightly above formation pressure while the influx is circulated out. Use the drill pipe gauge when circulating through the string and the choke to hold the right pressure.", "Driller's Method: circulate the influx out with the original mud, then circulate kill mud. It starts immediately, but needs two circulations and gives higher casing pressure for longer.", "Wait and Weight (Engineer's) Method: weigh up first, then kill in one circulation using a drill pipe pressure schedule. Lower casing pressures, but there is a waiting time with gas migration.", "Concurrent Method: weight up gradually while circulating. It is more complex and rarely used.", "Volumetric Method and lubricate-and-bleed handle gas migration when circulation is not possible. Bullheading pumps influx back into the formation and is used when circulation is impossible.", "Pressure changes at the choke take about a second per 1,000 ft of well depth to reach the drill pipe gauge. Make small adjustments and allow for lag.", "Slow circulating rate pressures are recorded at several rates, for each pump, after any mud property change, and after drilling about 500 ft or a bit change. They are the base for ICP and FCP.", "A safety margin (extra mud weight or pressure) adds a margin but also adds pressure on the formation. Trip margin covers swab on the next trip."]], ["At a glance", ["This is the largest topic in the bank. It covers the kill methods, start-up, pressure behaviour and problems during the kill.", "Know the Driller's Method and Wait and Weight step by step, and what each gauge should do.", "Know which gauge you hold constant at each stage, and how pump speed changes affect bottom hole pressure.", "Know the actions for plugged nozzles, washouts, pump failure, losses and gas at the choke."]], ["Principles", ["Primary objective: constant bottom hole pressure at or above formation pressure, so there is no further influx and no formation breakdown.", "Driller's Method: first circulation removes the influx with the original mud, second circulation pumps kill mud. After a successful first circulation SICP and SIDPP equal the original SIDPP. After the second, both read zero if there is no trapped pressure.", "Wait and Weight: kill mud is pumped to the bit on a DP pressure schedule (ICP to FCP), then to surface holding FCP. Hold FCP once kill mud reaches the bit.", "Reduced pump rate lowers the load on the mud/gas separator and gives time to adjust the choke.", "Include the surface line volume (pump to standpipe) in the kill plan. Re-zero the stroke counter when kill mud reaches the drill pipe."]], ["Start-up and gauges", ["Start-up: hold casing pressure constant while the pump is brought up to kill rate. If casing pressure rises above SICP, BHP increases and may exceed fracture pressure.", "After a correct start-up and lag time the drill pipe gauge reads ICP. This is also how to find ICP with no recorded SCR.", "Take SCRs on the same DP gauge used for the kill, for at least two pumps. Retake them when mud properties change. Break gel strength before taking SCRs after tripping in.", "If DP pressure is above the calculated ICP, recalculate the circulating schedule from the actual reading."]], ["Behaviour during the kill", ["Gas expands as it rises, so the pit volume increases. Salt water does not expand, so casing pressure changes only with annulus geometry. No casing pressure or pit gain rise suggests a liquid influx.", "Choke pressure can exceed MAASP once the influx is above the shoe. Highest shoe pressure occurs when the top of the influx is at the shoe.", "Overbalance during a pause = current DP pressure minus SIDPP.", "Reducing rate while holding the standpipe pressure raises BHP. Raising rate while holding DP pressure at FCP lowers BHP.", "Holding casing pressure constant as kill mud rises in the annulus lowers BHP. Holding FCP constant keeps BHP constant.", "Pit volume is monitored to detect gas expansion, losses or a new influx. Spare capacity must be left in the active system."]], ["Problems", ["Pump fails: close the choke and shut the well in. Rotary hose or pop-off failure: stop the pump, close the FOSV/IBOP and close the choke.", "DP pressure rising with choke pressure unchanged: plugged bit nozzle. DP pressure rising, unresponsive to the choke, with casing pressure falling: annulus packing off. Casing then DP pressure falling: choke washing out.", "Pressure left on the drill pipe after pumping kill mud to the bit: check for trapped pressure. If it returns, circulate on, shut in and check again.", "Not enough barite for kill mud: use the first circulation of the Driller's Method.", "Gas migrating and no circulation possible: Volumetric Method. It maintains BHP as the influx migrates and is complete when casing pressure stops increasing and gas reaches surface."]], ["Stripping and safety margin", ["Stripping adds or removes pipe through a sealing element. Bleed the closed-end displacement for each stand to keep BHP constant.", "Swabbed kick with the bit off bottom: strip back to bottom, then circulate it out. Use the original mud weight as the minimum with the pipe on bottom.", "A safety margin is extra pressure to reduce the risk of going underbalanced. Its drawback is that it cannot be removed easily."]], ["Exam traps", ["During circulation you hold drill pipe pressure by adjusting the choke. Casing pressure is allowed to change.", "Starting the pump: hold casing pressure at SICP while the pump comes up to kill rate. Then read the drill pipe gauge as ICP.", "Raising pump speed with drill pipe pressure held at the same value lowers bottom hole pressure. Lowering it does the opposite.", "Pit level rises as gas expands and falls as gas leaves the choke. It does not stay constant.", "If the bit plugs or a nozzle washes out, shut in and re-establish the circulating pressure. Do not chase the gauge for long.", "Round kill weight up to the next 0.1 ppg."]]], "f": [["Overbalance (pause)", "Overbalance = current DP pressure - SIDPP."], ["FCP at a new rate", "FCP2 = FCP1 x (new SPM / old SPM)^2."], ["Bit to shoe", "Bit-to-shoe strokes show when the influx has entered the casing and shoe pressure stops rising."]]}, "P": {"s": [["Theory", ["Hydrostatic pressure depends only on fluid density and true vertical depth, not on the shape of the hole. Gradient units: psi/ft.", "Normal pore pressure follows a water column from surface: about 0.433 psi/ft for fresh water and about 0.465 psi/ft for sea water. Abnormal pressure is higher; subnormal is lower.", "Causes of abnormal pressure: under-compaction of shales, tectonic compression, salt movement, aquathermal expansion, artesian effects and reservoir structure (gas cap).", "Overburden pressure is the weight of rock and fluid above a depth. Fracture pressure is always less than overburden and is estimated from leak-off tests, formation integrity tests or correlations.", "A leak-off test finds the pressure at which the formation starts to take mud. A formation integrity test pressures up to a planned value without leak-off. Use a constant mud weight and a steady pump rate.", "Annular pressure loss adds to BHP while circulating, so ECD is above static mud weight. ECD is larger in long, slim or high-rate wells and with high mud viscosity.", "Mud compressibility and temperature change density downhole, especially in oil and synthetic muds. Heating lowers density; pressure raises it.", "Kick tolerance and MAASP define how big an influx the well can take: both depend on the weakest formation, usually at the casing shoe, and on mud weight."]], ["At a glance", ["Calculation topic: pressure, density, volumes, MAASP, kick tolerance, pills and cement plugs.", "Know that hydrostatic pressure = mud weight x 0.052 x TVD, and always use TVD.", "Know how a pill, a brine column or a lost column changes bottom hole pressure.", "Round-offs and the right depth (TVD or MD) are the usual causes of wrong answers."]], ["Hydrostatic and BHP", ["Hydrostatic pressure (psi) = 0.052 x mud weight (ppg) x TVD (ft). It is the pressure exerted by a fluid column at rest.", "BHP static = hydrostatic. BHP circulating = hydrostatic + annular pressure loss (APL). BHP is the total pressure on the bottom of the hole.", "If BHP decreases, the risk of a kick increases. Unexpected abnormal pressure decreases the overbalance.", "Pressure change in ppg terms: change = difference in ppg x 0.052 x height."]], ["Formation pressure", ["Formation (pore) pressure is the fluid pressure in the pore spaces. Abnormal pressure is greater than the hydrostatic of a full water column.", "Porosity = percentage of void space. Permeability = ability of fluids to move through rock. A kick is an unplanned flow of formation fluids into the wellbore."]], ["ECD and APL", ["ECD = mud weight + APL / (0.052 x TVD). Use measured depth for APL: friction depends on the length of the flow path.", "Higher pump rate or mud weight raises friction pressure, so SCR pressure and pump pressure rise. Lower pump rate lowers APL.", "Pump pressure with rate: P2 = P1 x (SPM2 / SPM1)^2."]], ["Fluid behaviour", ["Higher temperature lowers the density of oil and synthetic mud, so hydrostatic decreases. Higher pressure compresses it and raises effective density.", "Dissolved gas in OBM breaks out close to surface. Use a pressurised balance to measure gas-cut mud."]], ["Strength, MAASP and kick tolerance", ["Leak-off test: the point where the pressure curve leaves the trend line. Use a constant mud weight above the shoe for an accurate strength. LOT is the normal method for formation strength below the shoe in a wildcat well.", "Max allowable mud weight = test mud weight + leak-off pressure / (0.052 x shoe TVD). MAASP is set by formation strength. Recalculate it after any mud weight change; heavier mud lowers MAASP.", "A long open hole section increases the risk of exceeding MAASP. Exceeding MAASP may lose fluid to the formation.", "Kick tolerance = the maximum gas kick, for a given intensity and depth, that can be circulated out without fracturing the weak point. Higher kick intensity gives a smaller maximum kick. It decreases as you drill deeper in a vertical hole."]], ["Pills and displacement", ["As pipe leaves a heavy pill, annular capacity rises, the pill column shortens and BHP decreases.", "Dry pipe length after a pill = pill volume x (pill MW - MW) / MW / pipe capacity.", "Pull dry: fill volume = metal displacement x length pulled. Returns = pill volume + displaced volume."]], ["Worked examples (bank style)", ["Lost column (Q4): 150 ft of 12 ppg mud replaced by 8.6 ppg brine. Change in BHP = (12 - 8.6) x 0.052 x 150 = 26.5, about 27 psi.", "Shut-in casing pressure with no float (Q109): (10.4 - 10.0) x 0.052 x 7,000 TVD = 145.6, about 145 psi.", "ECD (Q95): 9 + 200 / (0.052 x 11,500) = 9.33, about 9.3 ppg.", "Maximum allowable mud weight (Q234): 14.0 + 1,950 / (0.052 x 11,000) = 17.4 ppg.", "Fracture pressure (Q375): leak-off 1,000 psi + 11 ppg x 0.052 x 7,500 ft = 5,290 psi.", "MPD back pressure (Q301): (10.5 - 9.6) x 0.052 x 10,000 = 468 psi, minus APL 175 = 293 psi."]], ["Exam traps", ["Use TVD for hydrostatic pressure and gradients. Use MD for volumes and strokes.", "ECD adds annular friction to the static mud weight. It is higher than the static mud weight while circulating.", "Fracture pressure and MAASP use the shoe TVD, not the hole depth.", "Pill problems: a heavy pill in a vertical annulus drops as the pipe is pulled, and the pill gets shorter as the bit passes above it."]]], "f": [["Hydrostatic", "HP = 0.052 x MW x TVD"], ["ECD", "ECD = MW + APL / (0.052 x TVD)"], ["Kill mud weight", "KWM = MW + SIDPP / (0.052 x TVD), rounded up to the next 0.1 ppg"], ["Pump pressure", "P2 = P1 x (SPM2 / SPM1)^2"], ["Max allowable MW", "MAMW = test MW + LOP / (0.052 x shoe TVD)"], ["Fracture pressure", "FP = surface LOP + MW x 0.052 x shoe TVD"], ["MAASP", "MAASP = (MAMW - MW) x 0.052 x shoe TVD"]]}, "B": {"s": [["Theory", ["The BOP stack has annular and ram preventers, rated by working pressure. The rating of the weakest component is the rating of the stack.", "Pipe rams seal on a given pipe size; variable bore rams seal on a size range. Blind rams close on an open hole. Shear rams cut pipe; blind shear rams cut and seal.", "The annular preventer closes on almost any shape, including the kelly and tool joints (with limits), and allows stripping. Use the minimum closing pressure that seals.", "Accumulator: stores hydraulic fluid in bladders pre-charged with nitrogen. Usable fluid is the volume released between the working pressure and the minimum operating pressure.", "The remote panel lights and gauges show what the unit is doing. A mismatch between the panel and the unit points to a hydraulic, air or electrical fault.", "Choke manifold: adjustable choke, remote choke, bleed line, gauges and flow paths to the mud gas separator, shaker and flare. Choke lines must be flushed to avoid plugging.", "Mud gas separator removes free gas from returns while a kick is circulated. It works within its design flow and limits and must be monitored for blow-through.", "Safety valves: FOSV and IBOP (kelly cock). The FOSV must be open and ready, with the right crossovers, on the rig floor at all times.", "The diverter is not a well control device for shutting in: it redirects shallow gas or flow away from the rig."]], ["At a glance", ["Equipment topic: BOP stack, accumulator, choke manifold, gas separator and safety valves.", "Know what each ram does, how the accumulator and the control panel lights behave, and what to read on the gauges.", "Know the tests and checks, including the pressure rating and the direction in which a ram holds pressure."]], ["BOP stack", ["Blind rams seal off the open hole. Shear-blind rams cut the drill string and seal the hole. Out of the hole with the well flowing, close the blind or blind/shear rams.", "Know the shear ram data: opening pressure, shear capacity and usable accumulator volume.", "The annular allows reciprocating the string while holding a seal. Use the minimum closing pressure that maintains a seal. Reduce the closing pressure so the annular does not collapse large casing. Packing element choice depends on fluid compatibility.", "The weakest component sets the stack rating (MAWP). Ring gaskets RX and BX are pressure-energised seals.", "A weep hole on a ram bonnet shows a leak on the piston rod mud seal.", "Closing ratio = operator piston area / piston shaft cross-section.", "A diverter's only function is to direct formation fluids away from the rig floor."]], ["Safety valves", ["Non-shearable tool across the stack: make up and close a safety valve in the string, then close the annular.", "Install a FOSV before cutting the drilling line. Before stripping in, a FOSV (open) with an IBOP on top is needed. Choose crossovers by matching pin/box connections to the string.", "A non-return valve stabbed in the string will not allow wireline inside, and has to be pumped open to read SIDPP. A swage crossover is the item specific to shutting in with casing."]], ["Accumulator and control panel", ["Closing a ram uses accumulator fluid, so accumulator and manifold gauges drop; displaced fluid returns to the unit reservoir. Bottles are pre-charged with nitrogen.", "Accumulator pressure falling with the others steady: possible leak. Both gauges dropping and not recovering with the charge pumps on: leak in the closing line. Accumulator pressure rising above the setting: the pressure switch has not shut the pump down. Stays at 2,500 psi: the pressure switch or pumps did not work.", "Light changed but pressures static: possible blockage between the unit and the BOP. Open light stays on and manifold pressure static: the 3-position/4-way valve did not operate. Pressures recovered but no close light: fault in the light circuit.", "High pressure bypass: raises manifold pressure to accumulator pressure, for rams and HCVs only. It increases the likelihood of a shear and seal.", "Annular leak is identified by a volume increase at the trip tank. Monitor flow above the closed BOP with the trip tank."]], ["Choke manifold and mud gas separator", ["The choke holds back pressure while circulating out a kick. The vent/bleed line limits pressure and bypasses the chokes.", "Blow-through is unseparated gas moving through the mud outlet. Prevent it by limiting flow into the separator. The liquid seal height (H2) sets the maximum separator pressure. A rising vent line pressure trend warns of blow-through.", "MGS problems: restricted mud outlet, eroded baffles, vent line restrictions. Pressure build-up can force gas into the shaker area, and gas volume can overload it.", "A vacuum degasser prevents pumping gas-cut mud downhole."]], ["Exam traps", ["Ram preventers are rated to hold pressure from below the closed ram. They are not designed to hold pressure from above.", "Fixed bore rams seal on one pipe size only. Variable bore rams seal on a range of sizes.", "Blind shear rams cut the pipe and seal the hole. Check that the pipe in the stack can be sheared.", "The annular preventer seals around nearly any shape. Reduce the closing pressure when stripping to extend element life.", "Ram open light goes out and close light comes on while the accumulator and manifold pressures stay static: suspect a blockage in the line between the accumulator unit and the BOP stack (Q224)."]]], "f": []}, "W": {"s": [["Theory", ["Barrier philosophy: two independent, tested and monitored barriers between the formation and the environment. A barrier element must be able to hold the maximum expected pressure.", "Primary barrier: hydrostatic mud column. Secondary barrier: BOP and casing/wellhead, or equivalent. Barriers are classed as physical (cement, packer, BOP) or fluid-based (hydrostatic).", "Tests: a positive test pressures from the side the barrier should protect; an inflow (negative) test reduces pressure on the protected side to prove the barrier holds from below.", "Running casing: displacement of pipe is large. Control the running speed to limit surge, fill the casing as planned and monitor volumes. Losses can reduce hydrostatic and cause a kick.", "Float equipment lets fluid enter the casing as it runs and prevents back-flow. Auto-fill floats must be converted before cementing; a failed conversion allows cement to U-tube.", "Cementing hydrostatics: heavier cement and spacer in the annulus raise BHP, then reduce it as the cement returns to the casing. Check that BHP stays above pore pressure and below fracture pressure.", "Wait on cement until the cement reaches the required compressive strength before testing or removing the BOP.", "Liner laps and plugs are weak points: test them and monitor for pressure or flow."]], ["At a glance", ["Barriers, tests, floats, casing running and cementing.", "Know the difference between a hydrostatic barrier and a mechanical barrier, and why two independent barriers are needed.", "Know the positive test, negative (inflow) test and what a successful test looks like."]], ["Barriers", ["Two barriers are normally required. An annular and a ram on one stack are not independent.", "A physical barrier is a cement plug. Procedures and monitoring are procedural barriers. A hydrostatic barrier is a monitored fluid column at or above formation pressure.", "Not barriers: a drill string float valve; a leak-off test (it checks formation strength).", "Positive test: pressure on the surface side higher than the formation side. Inflow (negative) test: pressure above the barrier reduced below the pressure beneath it.", "A liner hanger and liner top are the potential leak path before the shoe is drilled out. If a flowing well is found after a flow check, mud hydrostatic has failed."]], ["Cement plug problems", ["If a plug communicates, lighter fluid above replaces heavier mud, so BHP decreases. If the lighter brine is below the formation equivalent, the well will flow.", "Differential across a plug = (pressure at the base) - (pressure at the top), each as MW x 0.052 x depth."]], ["Running casing", ["Surge pressure rises with higher running speed and tighter clearance. Centralizers improve cement flow but increase surge risk. Surge-induced losses that drop the mud level can cause a kick.", "Fill-ups give hydrostatic support to the casing. Keep the casing full: a float that does not convert lets mud or fluids u-tube.", "Pulling stuck casing out through a tight wellbore can swab in a kick.", "A plugged self-fill float shows as increased returns; if it suddenly clears, the annulus level drops."]], ["Cementing", ["Circulate a full bottoms-up before cementing for a clean mud column.", "If the float fails to convert, pressure must be held on the cement head, or the heavier cement will u-tube back up inside the casing.", "Proper lift: cement in equals mud out, so pit level stays constant while displacing.", "Remove the BOP after the planned WOC time is complete and the well is static. Before drilling out the float shoe, monitor to verify it does not leak."]], ["Exam traps", ["A barrier must be verified. A tested or monitored barrier counts. An untested one does not.", "A positive test pushes from the well side out. A negative (inflow) test lowers pressure below the barrier and watches for flow or pressure rise.", "Running casing with a float: keep the casing filled, or the float can collapse the pipe or lose the hydrostatic.", "Circulate a full bottoms-up before cementing and confirm a clean column of mud."]]], "f": [["Plug pressure difference", "dP = (MW below x 0.052 x depth below) - (MW above x 0.052 x depth above)"]]}, "D": {"s": [["Theory", ["Managed Pressure Drilling controls the annular pressure profile using back pressure, flow control and fluid density. The aim is a narrow, precise window between pore and fracture pressure.", "Variants: constant bottom hole pressure, pressurized mud cap drilling, dual gradient and return flow control. All use a rotating control device and a closed return path.", "The RCD seals around rotating pipe and diverts returns through the MPD choke and flowmeter. It does not replace the BOP: the BOP remains the well control barrier.", "During a connection, circulation stops and ECD is lost, so surface back pressure is applied to hold BHP. A pressure ramp schedule matches back pressure to pump rate.", "Hydrostatically underbalanced means hydrostatic is below pore pressure; dynamically overbalanced means ECD or applied pressure holds BHP above pore pressure.", "Horizontal wells: well control uses TVD for hydrostatic. A gas influx in the lateral has little vertical height, so SIDPP and SICP are similar and gas expansion is small until it enters the vertical section.", "Barite sag, cuttings beds and high ECD are typical lateral problems. Swabbing and loss of hydrostatic are risks when the lateral is circulated or tripped."]], ["At a glance", ["MPD and horizontal wells.", "In MPD, surface back pressure plus the mud column plus annular friction decide the bottom hole pressure.", "In horizontal wells, gas expansion and migration are different: TVD changes slowly along the lateral."]], ["Horizontal wells", ["Gas expands less in the horizontal section because hydrostatic hardly changes. Pit volume stays about constant while it is circulated along it.", "A kick in the horizontal section has little or no vertical height, so SIDPP and SICP are initially about the same.", "As gas moves from the horizontal into the vertical section, casing pressure must increase to hold BHP. A vertical kill sheet applied to a horizontal well applies too much pressure.", "Sagged barite leaves lighter mud in the circulation path, so hydrostatic drops on the first bottoms-up. Put a heavy pill in the vertical annulus for the most effective hydrostatic."]], ["MPD basics", ["MPD uses an RCD, which seals around the rotating drill pipe. The annular preventer is reserved for well control.", "Surface back pressure = target BHP - hydrostatic - APL (when circulating). With pumps off, surface pressure = target BHP - hydrostatic.", "Hydrostatically underbalanced: hydrostatic below formation pressure. Dynamically overbalanced: ECD above formation pressure.", "Follow the pressure ramp schedule as pumps slow down: friction drops, so surface pressure must be raised to hold target pressure at depth.", "If losses start, lower the surface back pressure to reduce ECD. A higher circulating rate adds APL, so less back pressure is needed.", "The MGS removes free gas from the returns. The flow line and orbit valve are not main RCD components.", "Benefits: consistent BHP, works in tight windows, mitigates pressure-related problems. Underbalanced drilling carries influx and control risks."]], ["Exam traps", ["MPD well status: add the hydrostatic, the surface back pressure and the APL, then compare with formation pressure.", "Back pressure needed = (formation EMW - mud weight) x 0.052 x TVD, minus APL while circulating.", "In the horizontal section, hydrostatic pressure depends on TVD, not on MD.", "Barite sag can lower hydrostatic pressure when bottoms-up is circulated after tripping."]]], "f": [["Surface back pressure", "SBP = (target MW - mud MW) x 0.052 x TVD - APL"], ["Kill weight (horizontal)", "Use the TVD of the kick: KWM = MW + SIDPP / (0.052 x TVD), rounded up to 0.1 ppg"]]}, "O": {"s": [["Theory", ["Drills build speed and teamwork: pit drill, trip drill, BOP drill, diverter drill and choke drill. A good drill is timed, observed and reviewed.", "Line of authority: the Driller shuts in the well without waiting for permission; the supervisor takes charge of the kill; every crew member knows their role and station.", "Kill sheet: prepared and kept up to date for the current depth, mud weight and SCRs. A kill log records strokes, pressures and choke positions for continuity at handover.", "Handover at a tour change: all parties stay on duty until the incoming crew understands pressures, strokes, mud properties, volumes, plan and problems.", "Pills are spotted by calculation: volume, displacement and strokes. Heavy pills shorten as pipe is pulled, so account for the change in annular height and hydrostatic.", "Solids control equipment, mud mixing and pit transfers change pit volumes. Inform the Driller before any change so the change is not mistaken for a kick.", "Wireline operations: the well is static for a long time. Condition the mud, keep the hole full and monitor on the trip tank."]], ["At a glance", ["Crew actions and rig-floor practice.", "Know the purpose of pit, trip and diverter drills, the handover content, and how to spot and move a pill.", "The answer is usually about reacting early, communicating and keeping the records."]], ["Drills and crew", ["Pit drills train the crew to recognise and react to a kick quickly, which limits influx size. Choke drills let the crew practise choke skills. Diverter drills train the response to a surface kick.", "The Driller has authority to shut in without waiting for permission: the Driller is closest to the well and first to see the kick. Calling the Toolpusher before shutting in delays shut-in and enlarges the influx.", "Crew members should inform the Driller immediately of changes (for example starting or stopping solids equipment changes pit volume). The degasser and desilter draw down the active pit; flow rate from the well stays the same.", "After a kick is shut in, checking for leaks at the pumps, pipework and pits can be delegated. Before circulating, the supervisor discusses the plan and reinforces duties."]], ["Handover and records", ["At a tour change during a kill, all parties stay on duty for a thorough handover. Write down the key points and discuss each one.", "A kill log records strokes, pressures and choke position. A well kill plan states duties, procedures, communication and safety requirements.", "Low kick tolerance: increase vigilance of kick indicators."]], ["Pills and tripping", ["Weighted pills compensate for the hydrostatic loss when tripping out. Spot a pill by calculating the displacement of the pipe and each annular section, converting to strokes, and resetting the stroke counter when the pill starts down the pipe. Circulate the pill out in stages to avoid BHP increases.", "Before tripping in, reduce trip speed, watch displacement and break circulation at selected depths. After a slip-and-cut, line up to the trip tank and set the alarm.", "Wireline: circulate and condition the mud first because the well will be static a long time, and monitor on the trip tank."]], ["Exam traps", ["The main reason for a drill is to check that the crew recognises and reacts to a kick in the time and way the plan requires.", "A diverter drill is about redirecting flow away from the rig. A pit drill is about recognising a pit gain.", "Spot a pill by calculating the displacement of the pipe and of each annular section, then convert to strokes.", "Handover must include the well status, barrier status, known hazards and open actions."]]], "f": [["Pulling dry", "Fill = metal displacement per ft x length pulled"]]}, "KS": {"s": [["At a glance", ["Four kill sheet cases with 8 calculated answers each. You type the numbers, the platform checks them against a tolerance.", "The trainer can add custom cases and the platform calculates the answer key and the working.", "Work in order: shoe strength, string volume, kill weight, circulating pressures, drill pipe pressure schedule.", "Show your units. Round kill weight up to the next 0.1 ppg."]], ["Order of calculation", ["Work in this order: MAMW, MAASP, strokes to the bit, KWM, ICP, FCP, MAASP after kill, pressure step per 100 strokes.", "Use TVD for hydrostatic and pressure; use measured lengths for volumes.", "String volume = sum of (length x capacity) for drill collars, HWDP and drill pipe, then divide by pump output for strokes.", "Round kill weight up to the next 0.1 ppg when asked for mud weight."]], ["Kill sheet theory", ["The kill sheet turns shut-in data into the numbers needed to circulate out the influx at constant BHP.", "MAMW comes from the leak-off test; MAASP is the maximum allowable annulus surface pressure before the weakest point fractures.", "Strokes to the bit come from drill string volume and pump output. Kill mud arrives at the bit after that number of strokes.", "ICP is the sum of SIDPP and the slow circulating pressure; FCP is the slow pressure corrected for kill weight. The drill pipe pressure moves from ICP to FCP while kill mud goes to the bit.", "Check units and TVD versus MD on every line. Mistakes on a kill sheet carry through to every later number."]], ["Drill pipe pressure schedule", ["Pressure drop per 100 strokes = (ICP - FCP) / (strokes to bit / 100).", "Write a schedule of pressure against strokes in equal steps. Hold the pressure at each step for the strokes shown while holding BHP constant."]], ["Worked example: Scenario 1 (8 1/2 in hole, 9,800 ft, 11.3 ppg)", ["MAMW: 10.5 + 1,950 / (0.052 x 7,950) = 15.22, so 15.2 ppg (rounded down to 0.1)", "MAASP before the kick: (15.2 - 11.3) x 0.052 x 7,950 = 1,612.3, so 1612 psi", "Strokes to bit: DC 600 x 0.00768 = 4.61 bbl;  HWDP 500 x 0.0088 = 4.4 bbl;  DP (9,800 - 600 - 500 = 8,700 ft) x 0.01776 = 154.51 bbl;  total 163.52 bbl / 0.119 bbl/stk = 1,374 strokes", "Kill mud weight: 11.3 + 500 / (0.052 x 9,800) = 12.28, so 12.3 ppg (rounded up to 0.1)", "ICP: 500 + 450 = 950 psi", "FCP: 450 x 12.3 / 11.3 = 489.8, so 490 psi", "MAASP after the well is killed: (15.2 - 12.3) x 0.052 x 7,950 = 1,198.9, so 1198 psi", "Pressure drop: (950 - 490) / 1,374 x 100 = 33.5 psi per 100 strokes"]], ["Drill pipe pressure schedule for Scenario 1", ["Drill pipe pressure in ten steps from ICP to FCP.", "0 strokes: 950 psi   |   137 strokes: 904 psi   |   275 strokes: 858 psi", "412 strokes: 812 psi   |   550 strokes: 766 psi   |   687 strokes: 720 psi", "824 strokes: 674 psi   |   962 strokes: 628 psi   |   1,099 strokes: 582 psi", "1,237 strokes: 536 psi   |   1,374 strokes: 490 psi"]], ["Exam traps", ["The kill weight uses TVD. The string volume uses MD.", "FCP uses the kill weight you rounded up to 0.1 ppg.", "The schedule goes from ICP at zero strokes to FCP when the kill mud reaches the bit.", "MAASP changes when the mud weight in the hole changes. Calculate it again with the kill weight.", "The shoe depth for the strength calculations is the TVD at the shoe."]]], "f": []}, "FORM": [{"h": "Pressure and density", "i": [["Pressure gradient (psi/ft)", "0.052 x MW (ppg)"], ["Hydrostatic pressure (psi)", "0.052 x MW (ppg) x TVD (ft)"], ["Equivalent mud weight (ppg)", "Pressure (psi) / (0.052 x TVD ft)"], ["Formation pressure (kick, bit on bottom)", "Hydrostatic in the string + SIDPP"], ["Overbalance (psi)", "BHP - formation pressure"], ["Mud weight to balance formation (ppg)", "Pformation / (0.052 x TVD)"], ["Specific gravity", "SG = ppg / 8.33"], ["Gradient from SG", "psi/ft = 0.433 x SG"], ["Normal pore pressure gradient", "about 0.433 psi/ft fresh water, 0.465 psi/ft sea water"], ["Circulating BHP", "Hydrostatic + annular pressure loss (APL)"], ["ECD (ppg)", "MW + APL / (0.052 x TVD)"], ["Pressure difference between two fluids (psi)", "(MW1 - MW2) x 0.052 x height (ft)"], ["Pressure units", "1 psi = 0.06895 bar = 6.895 kPa"], ["Density units", "1 ppg = 119.8 kg/m3 = 0.12 SG"], ["Metric hydrostatic (kPa)", "0.00981 x MW (kg/m3) x TVD (m)"], ["Metric hydrostatic (bar)", "0.0000981 x MW (kg/m3) x TVD (m)"]]}, {"h": "Volumes, capacities and pumps (oilfield units)", "i": [["Pipe capacity (bbl/ft)", "ID^2 / 1029.4 (ID in inches)"], ["Annular capacity (bbl/ft)", "(Dh^2 - Dp^2) / 1029.4"], ["Metal displacement (bbl/ft)", "(OD^2 - ID^2) / 1029.4"], ["Closed-end displacement (bbl/ft)", "OD^2 / 1029.4 = capacity + metal displacement"], ["Volume (bbl)", "Capacity (bbl/ft) x length (ft)"], ["Pump output, triplex (bbl/stk)", "0.000243 x D^2 x L x efficiency (liner D and stroke L in inches)"], ["Strokes", "Volume (bbl) / pump output (bbl/stk)"], ["Time (min)", "Strokes / pump rate (SPM)"], ["Flow rate (gpm)", "SPM x bbl/stk x 42"], ["Annular velocity (ft/min)", "24.5 x Q (gpm) / (Dh^2 - Dp^2)"], ["Pump pressure with rate", "P2 = P1 x (SPM2 / SPM1)^2"], ["Pump pressure with mud weight", "P2 = P1 x (MW2 / MW1)"], ["Pressure drop across bit nozzles (psi)", "MW x Q^2 / (10858 x At^2), At = total flow area in square inches"]]}, {"h": "Shut-in, kick and influx", "i": [["Kick intensity (ppg)", "SIDPP / (0.052 x TVD)"], ["Influx height (ft)", "Pit gain (bbl) / annular capacity (bbl/ft), around collars first, then pipe"], ["Influx density (ppg)", "MW - (SICP - SIDPP) / (0.052 x influx height)"], ["Influx type, typical density", "gas about 1 to 3 ppg, oil about 4 to 7 ppg, salt water about 8 to 9 ppg"], ["Shut-in balance", "BHP = HP string + SIDPP = HP annulus + SICP"], ["SICP from densities", "(Pformation - annular hydrostatic) in psi"], ["Gas law", "P1 x V1 = P2 x V2 (simplified); P1V1 / (Z1T1) = P2V2 / (Z2T2) with compressibility and temperature"], ["Gas migration rate (ft/hr)", "(rise in pressure per hour, psi/hr) / (0.052 x MW)"], ["Shut-in with float", "SIDPP = DP pressure at which the float opens, corrected for any casing pressure rise"]]}, {"h": "Kill sheet", "i": [["Kill weight mud, KWM (ppg)", "MW + SIDPP / (0.052 x TVD), rounded up to the next 0.1 ppg"], ["Initial circulating pressure, ICP (psi)", "SIDPP + SCR pressure (+ safety margin if used)"], ["Final circulating pressure, FCP (psi)", "SCR pressure x KWM / MW"], ["Strokes surface to bit", "String volume (bbl) / pump output"], ["Strokes bit to shoe", "Open-hole annular volume bit to shoe / pump output"], ["Strokes bit to surface", "Annular volume / pump output"], ["Total strokes and time", "Surface to bit + bit to surface; time = strokes / SPM"], ["Pressure drop per 100 strokes (psi)", "(ICP - FCP) / (strokes to bit / 100)"], ["Overbalance on pause (psi)", "Current DP pressure - SIDPP"], ["Barite needed (sacks per 100 bbl)", "1470 x (KWM - MW) / (35 - KWM)"], ["Volume increase from barite", "about 0.0007 bbl for each lb of barite added (check with a density balance)"]]}, {"h": "Formation strength, MAASP and kick tolerance", "i": [["Max allowable mud weight, MAMW (ppg)", "Test MW + leak-off pressure / (0.052 x shoe TVD)"], ["From fracture gradient", "MAMW = fracture gradient (psi/ft) / 0.052"], ["Fracture pressure at shoe (psi)", "Leak-off pressure + MW x 0.052 x shoe TVD"], ["MAASP (psi)", "(MAMW - MW) x 0.052 x shoe TVD"], ["MAASP after kill mud in the well", "(MAMW - KWM) x 0.052 x shoe TVD"], ["Kick tolerance (concept)", "Largest influx at a given intensity that can be circulated out without exceeding the weak point"]]}, {"h": "Volumetric method, stripping and tripping", "i": [["Hydrostatic of mud per bbl in annulus (psi/bbl)", "0.052 x MW / annular capacity (bbl/ft)"], ["Volume to bleed for a pressure drop (bbl)", "Pressure step (psi) x annular capacity / (0.052 x MW)"], ["Working pressure", "Pressure step + safety margin + trip margin, as set by the procedure"], ["Stripping: bleed volume per stand", "Closed-end displacement of the stand (capacity + metal)"], ["Casing pressure rise when stripping into gas", "Influx height increase x (mud gradient - influx gradient)"], ["Trip fill (bbl)", "Metal displacement (bbl/ft) x length pulled (ft) when pulling dry"], ["Pulling wet", "Fill = closed-end displacement x length pulled"], ["Pill: length of dry pipe (ft)", "Pill volume x (pill MW - MW) / MW / pipe capacity"], ["Pill: pill length in annulus (ft)", "Pill volume / annular capacity"]]}, {"h": "Equipment and barriers", "i": [["Closing ratio", "Operator piston area / piston shaft cross-section area"], ["Usable accumulator volume per bottle", "V x (Ppre / Pmin - Ppre / Pmax)"], ["Accumulator pre-charge", "1000 psi for a 3000 psi system; use nitrogen only"], ["Mud gas separator limit (psi)", "about 0.052 x MW x liquid seal height H2"], ["Stack rating", "The weakest component sets the working pressure"], ["Pressure across a plug (psi)", "Pressure at base - pressure at top; each = MW x 0.052 x depth"], ["Positive test", "Pressure applied on the side the barrier protects, higher than the formation side"], ["Negative (inflow) test", "Pressure on top lowered below formation pressure to prove the barrier"]]}, {"h": "Managed pressure and horizontal wells", "i": [["Surface back pressure while circulating", "Target BHP - hydrostatic - APL"], ["Surface back pressure, static", "Target BHP - hydrostatic"], ["Target BHP (psi)", "Pore pressure + chosen margin"], ["Hydrostatically underbalanced", "Hydrostatic < pore pressure"], ["Dynamically overbalanced", "ECD (or applied pressure) holds BHP above pore pressure"], ["Horizontal well kill sheet", "Use TVD for hydrostatic, MD for volumes and strokes"], ["Influx in the lateral", "Little vertical height, so SIDPP is about equal to SICP"]]}], "REF": {"s": [["Shut-in and first actions", ["Follow the rig well control policy for the exact sequence. The common elements are the same.", "Stop drilling, space out, stop the pumps and flow check.", "If the well flows, shut in using the policy method and confirm the well is closed.", "Wait for pressures to stabilise. Record SIDPP, SICP and pit gain.", "Inform the supervisor, check for trapped pressure and gas migration, then plan the kill.", "Do not start circulating before the well control plan is discussed and the crew duties are clear."]], ["Choosing the method", ["Driller's Method: start at once. Two circulations. Higher casing pressure for longer.", "Wait and Weight: one circulation after weighting up. Lower peak casing pressure. Needs time and a good schedule.", "Volumetric or lubricate and bleed: gas is migrating and you cannot circulate.", "Bullheading: circulation is impossible. Limited by formation strength and equipment.", "Stripping: pipe must be moved under pressure. Maintain BHP by bleeding closed end displacement."]]], "t": [{"h": "Glossary of abbreviations", "i": [["BHP", "Bottom hole pressure"], ["SIDPP", "Shut-in drill pipe pressure"], ["SICP", "Shut-in casing pressure"], ["ICP", "Initial circulating pressure = SIDPP + SCR pressure"], ["FCP", "Final circulating pressure = SCR pressure x KWM / MW"], ["KWM", "Kill weight mud"], ["SCR", "Slow circulating rate (pressure at a chosen pump speed)"], ["MAASP", "Maximum allowable annular surface pressure"], ["MAMW", "Maximum allowable mud weight"], ["LOT", "Leak-off test"], ["ECD", "Equivalent circulating density"], ["APL", "Annular pressure loss"], ["MPD", "Managed pressure drilling"], ["SBP", "Surface back pressure"], ["RCD", "Rotating control device"], ["MGS", "Mud gas separator"], ["FOSV", "Full opening safety valve"], ["IBOP", "Inside BOP (non-return valve)"], ["HWDP", "Heavy weight drill pipe"], ["TVD / MD", "True vertical depth / measured depth"]]}, {"h": "Well control methods compared", "i": [["Driller's Method", "Two circulations. First removes the influx with the original mud at ICP. Second circulates kill mud. Starts at once."], ["Wait and Weight", "One circulation. Weight up first, then follow the drill pipe pressure schedule from ICP to FCP. Lower casing pressures."], ["Concurrent", "Weight up gradually while circulating. Complex and rarely used."], ["Volumetric", "No circulation. Let casing pressure rise by a set step, then bleed a calculated volume."], ["Lubricate and bleed", "Pump kill fluid in, wait, then bleed gas. Replaces gas with liquid hydrostatic."], ["Bullheading", "Pump the influx back into the formation. Limited by formation strength and burst or collapse of the tubulars."], ["Stripping", "Run pipe under pressure. Bleed the closed end displacement of each stand to hold BHP."]]}, {"h": "Numbers and rules to remember", "i": [["Pressure gradient", "mud weight (ppg) x 0.052 = psi/ft. Example: 10 ppg = 0.52 psi/ft."], ["Hydrostatic pressure", "MW x 0.052 x TVD"], ["Capacity", "ID squared / 1029.4 = bbl/ft. 5 in drill pipe (4.276 in ID) = 0.01776 bbl/ft."], ["Annular capacity", "(hole squared - pipe squared) / 1029.4. 8 1/2 in hole, 5 in pipe = 0.0459 bbl/ft."], ["Closed end displacement", "Capacity + metal displacement. 0.01776 + 0.00650 = 0.02426 bbl/ft."], ["Kill weight", "MW + SIDPP / (0.052 x TVD). Round up to 0.1 ppg."], ["Pass mark", "70 percent"], ["Gauge lag", "About one second per 1,000 ft of depth. Make small choke changes."]]}]}, "EQ": {"K": [{"h": "Kick size and influx", "i": [["Annular capacity", "(Dh^2 - Dp^2) / 1029.4 bbl/ft", "Dh = hole or casing ID, Dp = pipe OD, both in inches. Needed to turn a pit gain into a height.", "A smaller annulus makes the same pit gain taller and raises SICP."], ["Influx height", "h = pit gain (bbl) / annular capacity (bbl/ft)", "Height of the influx in the annulus. Work around the collars first, then the pipe.", "Detect early: a smaller pit gain means a shorter influx and a lower SICP."], ["Influx density", "MW - (SICP - SIDPP) / (0.052 x h)  ppg", "Estimates what came in from the shut-in pressures and the influx height.", "Gas about 1 to 3 ppg, oil about 4 to 7 ppg, salt water about 8 to 9 ppg. Treat it as an estimate."]]}, {"h": "Trip volumes and hole fill", "i": [["Metal displacement", "(OD^2 - ID^2) / 1029.4 bbl/ft", "Volume of steel in the pipe. It is the fill needed when pulling dry pipe.", "Fill = metal displacement x length pulled."], ["Closed-end displacement", "OD^2 / 1029.4 bbl/ft  (capacity + metal displacement)", "Volume displaced when pipe is full or the bit is plugged (pulling wet).", "A full pipe brings its mud out with it, so the fill is the closed-end figure, not the metal figure."], ["Trip tank check", "Actual change - expected change", "The trip tank should fall by the expected volume per stand pulled.", "Less fall than expected = gain: flow check, shut in if flowing. More fall = losses."], ["Trip margin", "Trip margin (ppg) = swab pressure (psi) / (0.052 x TVD)", "Extra mud weight to cover the pressure lost to swabbing on the next trip.", "A margin protects the trip, but it adds pressure on the formation."]]}, {"h": "Gas behaviour and migration", "i": [["Gas law (simplified)", "P1 x V1 = P2 x V2", "Gas expands as the pressure on it falls. Most of the expansion happens close to surface.", "This is why gas-cut mud at surface hardly lowers BHP at depth, and why pit gain grows fast near surface."], ["Gas migration rate", "Rate (ft/hr) = pressure rise (psi/hr) / (0.052 x MW)", "Rising pressures on a closed well show gas moving up the annulus.", "Rising shut-in pressures mean migration, not a bigger kick. Do not read the gauges as a new SIDPP."], ["Ballooning or a kick", "Kick if SICP > APL", "Ballooning flows back and the flow declines with time. A kick keeps flowing or shows shut-in pressure above APL.", "If in doubt: flow check, then shut in and record pressures and pit gain."]]}, {"h": "Circulation, lag and bottoms-up", "i": [["Bottoms-up strokes", "Annular volume (bbl) / pump output (bbl/stk)", "Strokes for returns from the bit to reach surface.", "Use measured depth for annular volume."], ["Bottoms-up time", "Strokes / pump rate (SPM)", "Time for gas and cuttings to arrive at the shakers.", "Lag tells you when a change drilled at the bit will be seen at surface. Gas is a lagging indicator."], ["Annular velocity", "24.5 x Q (gpm) / (Dh^2 - Dp^2)  ft/min", "Speed of mud in the annulus. Pump rate in gpm = SPM x bbl/stk x 42.", "A higher rate lifts cuttings better but adds APL and ECD."]]}], "S": [{"h": "Shut-in pressure balance", "i": [["U-tube balance", "BHP = HP string + SIDPP = HP annulus + SICP", "With the well static, bottom hole pressure equals formation pressure on both sides of the U-tube.", "Read SIDPP and SICP only after the pressures have stabilised."], ["Formation pressure", "Pf = 0.052 x MW x TVD + SIDPP", "Clean mud in the string plus the drill pipe shut-in pressure.", "Trapped pressure makes Pf and the kill weight too high. Bleed it first."], ["SIDPP", "SIDPP = Pf - 0.052 x MW x TVD", "Formation pressure minus the hydrostatic in the string.", "It does not depend on kick size, so it is the better gauge for formation pressure."]]}, {"h": "Casing pressure and influx", "i": [["SICP from densities", "SICP = (EMW formation - annular fluid weight) x 0.052 x TVD", "Formation pressure minus the hydrostatic of the annulus (mud and influx).", "SICP is higher than SIDPP in a vertical well because the lighter influx sits in the annulus."], ["Influx height", "h = pit gain / annular capacity", "How much annulus the influx occupies.", "A smaller kick gives a lower SICP."], ["Kick intensity", "SIDPP / (0.052 x TVD)  ppg  (= KWM - MW)", "Extra mud weight needed to balance the formation.", "Use it to judge how severe the kick is."]]}, {"h": "Gas migration on a closed well", "i": [["Migration rate", "Rate (ft/hr) = pressure rise (psi/hr) / (0.052 x MW)", "Speed at which the gas moves up.", "A few hundred up to about 2,000 ft per hour depending on the mud."], ["Pressure rise from migration", "Rise (psi) = distance migrated (ft) x 0.052 x MW", "Gas that cannot expand raises every shut-in pressure, BHP included.", "Do not let casing pressure pass MAASP without a plan. Bleed in controlled steps."], ["Holding pressures constant", "Hold DP pressure if the string is clear of influx", "Holding casing pressure constant while gas migrates lets the gas expand and BHP falls.", "With the influx above the bit, SIDPP is the better reference."]]}, {"h": "Float valve and trapped pressure", "i": [["SIDPP with a float", "DP pressure when the float opens, corrected for any casing rise", "Pump slowly, stop when casing pressure begins to rise, then read the DP gauge.", "A casing rise during this test must be subtracted from the reading."], ["Trapped pressure", "True SIDPP = gauge SIDPP - trapped pressure", "Pressure held in the well that is not formation pressure.", "Bleed in stages at the choke. If it returns, it is not trapped pressure."], ["After the first circulation", "SICP = SIDPP when the influx is out", "Driller's Method: both gauges read the original SIDPP if the first circulation was clean.", "A higher casing reading means influx remains or pressure is trapped."]]}], "M": [{"h": "Kill sheet core", "i": [["Kill weight mud, KWM", "MW + SIDPP / (0.05
