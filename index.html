2 x TVD), rounded up to 0.1 ppg", "The mud weight that balances the formation.", "Round up, never down. Use TVD."], ["Initial circulating pressure, ICP", "SIDPP + SCR pressure  (+ safety margin if used)", "Drill pipe pressure when the pump reaches kill rate with BHP held constant.", "Hold casing pressure at SICP while the pump comes up to speed, then read ICP."], ["Final circulating pressure, FCP", "SCR pressure x KWM / MW", "Circulating pressure once kill mud fills the string.", "Use the kill weight you rounded up. Hold FCP from bit to surface."]]}, {"h": "Strokes and time", "i": [["Strokes surface to bit", "String volume (bbl) / pump output (bbl/stk)", "Strokes for kill mud to reach the bit.", "Include surface line volume in the plan. Use measured depth."], ["Strokes bit to shoe", "Open-hole annular volume / pump output", "Shows when the influx has entered the casing.", "Shoe pressure is highest when the top of the influx is at the shoe."], ["Total strokes and time", "Strokes to bit + strokes bit to surface; time = strokes / SPM", "Full circulation to bring kill mud to surface.", "Re-zero the stroke counter when kill mud reaches the bit."]]}, {"h": "Drill pipe pressure schedule", "i": [["Pressure step", "(ICP - FCP) / (strokes to bit / 100)  psi per 100 strokes", "How fast the drill pipe pressure falls from ICP to FCP.", "Write the schedule in about ten equal steps."], ["Schedule value", "P = ICP - step x strokes pumped / 100", "Target drill pipe pressure at any stroke count.", "Adjust the choke to match the schedule and allow for choke lag."], ["New pump rate", "P2 = P1 x (SPM2 / SPM1)^2", "Pressure changes with the square of the pump rate.", "Recalculate ICP and FCP if the rate changes. Do not guess."]]}, {"h": "Pause, margin and tapered strings", "i": [["Overbalance on a pause", "Current DP pressure - SIDPP", "Pressure left above formation pressure when the pump is stopped.", "Check for trapped pressure if it differs from the plan."], ["Safety margin", "ICP and function recommendations(run){
  const out=[];
  const cats=Object.entries(run.cats||{}).filter(([,v])=>v[1]>0).map(([k,v])=>({k,p:v[0]/v[1]*100,c:v[0],t:v[1]})).sort((a,b)=>a.p-b.p);
  const weak=cats.filter(c=>c.p<PASS),strong=cats.filter(c=>c.p>=80);
  const unans=run.code==='ks'?run.ans.filter(a=>a[1]==null).length:run.ans.filter(a=>a[1]<0).length;
  const limit=minutesFor(run.code,run.n)*60;
  const overall=[];
  if(run.pass)overall.push(run.complete?'You met the pass mark on a complete test. Keep your knowledge current with regular drills and review the items below to close the remaining gaps.':'You met the pass mark on a partial test. To earn a certificate, pass the complete category or the full exam.');
  else overall.push('You scored '+run.pct+'%, below the '+PASS+'% pass mark. Use the plan below, then retake the test. Aim for at least 80% so you pass with margin.');
  if(strong.length)overall.push('Strengths to maintain: '+strong.map(c=>CATNAME[c.k]+' ('+Math.round(c.p)+'%)').join(', ')+'.');
  out.push({h:'Overall',b:overall});
  weak.forEach(c=>{
    const R=c.k==='KS'?REV.KS:REV[c.k];const topics=R?R.s.map(s=>s[0]).filter(t=>!/^Theory$|theory$/.test(t)):[];
    const forms=c.k==='KS'?KSF.map(f=>f[1]):(R&&R.f?R.f.map(f=>f[0]):[]);
    const b=['Level: '+level(c.p)+' ('+c.c+' of '+c.t+' correct).'];
    if(topics.length)b.push('Revise in the review corner: '+topics.join('; ')+'.');
    if(forms.length)b.push('Practise the calculations: '+forms.slice(0,6).join('; ')+'.');
    b.push(c.p<60?'Priority: this is a knowledge gap. Study the theory first, then work through the missed questions below and retake this category.':'Close to the pass mark. Focus on the missed questions below, then retake this category.');
    out.push({h:CATNAME[c.k],b});
  });
  const tips=[];
  if(unans>0)tips.push('You left '+unans+' item'+(unans>1?'s':'')+' unanswered. An unanswered item scores zero: answer every item, and come back to long calculations at the end.');
  if(run.auto)tips.push('Time expired before you submitted. Plan about 1.2 minutes per question and move on from items that take too long.');
  else if(run.sec<limit*.35&&!run.pass)tips.push('You finished quickly with a score below the pass mark. Slow down, read all four options, and watch for wording such as "all of the above" and "not".');
  if(weak.some(c=>c.k==='P'||c.k==='KS'))tips.push('For calculation items, write the formula, check units (ppg, psi, bbl, ft, TVD versus MD) and round kill weight up to the next 0.1 ppg.');
  tips.push('Use the review corner and formula sheet before each attempt, and rehearse kill sheets by hand.');
  out.push({h:'Exam technique and advice',b:tips});
  out.push({h:'Next step',b:[run.pass?(run.complete?'Keep your certificate record and plan a refresher within your company requirement.':'Take the complete category test (the "All" option) to earn a certificate.'):'Retake the same test after revising the topics above. Your trainer can open a new attempt if needed.']});
  return out;
}

function allRuns(docs){const r=[];(docs||[]).forEach(d=>(d.runs||[]).forEach(x=>r.push({d,r:x})));return r.sort((a,b)=>b.r.ts-a.r.ts)}
const rid=()=>(Math.random().toString(36)+'000000').slice(2,8);

function lenOpts(c){if(c==='ks')return[{v:'4',t:'4 scenarios (complete: certificate)'}];const max=fullN(c);return[10,20,30,50,100].filter(x=>x<max).map(x=>({v:String(x),t:x+' questions (practice, no certificate)'})).concat([{v:String(max),t:(c==='all'?'Full exam '+max+' questions, '+FULLMIN/60+' hours':'All '+max)+' (complete: certificate)'}])}
async function copyText(btn,txt,node){try{await navigator.clipboard.writeText(txt);btn.textContent='Copied'}catch{if(node){const r=document.createRange();r.selectNodeContents(node);const s=getSelection();s.removeAllRanges();s.addRange(r)}btn.textContent='Selected'}setTimeout(()=>btn.textContent=btn.textContent==='Copied'||btn.textContent==='Selected'?(btn.dataset.l||'Copy'):btn.textContent,1500)}
function missStats(runs){
  const m={};
  runs.forEach(({r})=>{if(r.code==='ks')return;(r.ans||[]).forEach(a=>{if(!QBY[a[0]])return;const o=m[a[0]]=m[a[0]]||{miss:0,tot:0,w:{}};o.tot++;if(!a[2]){o.miss++;const k=a[1]<0?'none':a[1];o.w[k]=(o.w[k]||0)+1}})});
  return Object.entries(m).filter(([,v])=>v.miss>0).map(([n,v])=>({n:+n,miss:v.miss,tot:v.tot,rate:v.miss/v.tot,w:v.w})).sort((x,y)=>y.rate-x.rate||y.tot-x.tot);
}
function ksStats(runs){
  const m={};
  runs.forEach(({r})=>{if(r.code!=='ks')return;(r.ans||[]).forEach(a=>{const f=String(a[0]).split('.')[1];const o=m[f]=m[f]||[0,0];o[1]++;if(!a[2])o[0]++})});
  return Object.entries(m).filter(([,v])=>v[0]>0).map(([f,v])=>({f,name:(KSF.find(x=>x[0]===f)||[f,f])[1],miss:v[0],tot:v[1]})).sort((x,y)=>y.miss/y.tot-x.miss/x.tot);
}
function wrongText(q,w){const e=Object.entries(w).sort((x,y)=>y[1]-x[1])[0];if(!e)return '';return e[0]==='none'?'Most often left unanswered ('+e[1]+')':'Most chosen wrong answer: '+q.o[+e[0]]+' ('+e[1]+')'}
function adminData(){

  const fd=(A.docs||[]).filter(d=>A.company==='all'||(d.company||'-').trim()===A.company).map(d=>({...d,runs:(d.runs||[]).filter(match)})).filter(d=>d.runs.length);

const bestOf=d=>Math.max(...d.runs.map(r=>r.pct));
function catTotals(runs){const ct={};runs.forEach(x=>Object.entries(x.r.cats||{}).forEach(([k,v])=>{const o=ct[k]=ct[k]||[0,0];o[0]+=v[0];o[1]+=v[1]}));return ct}
function insights(fd,runs,ct){
  const out=[],n=fd.length;
  const avg=Math.round(runs.reduce((s,x)=>s+x.r.pct,0)/runs.length),pr=Math.round(runs.filter(x=>x.r.pass).length/runs.length*100);
  const bests=fd.map(bestOf).sort((a,b)=>a-b),med=bests[Math.floor(bests.length/2)];
  out.push({c:pr>=70?'ok':pr>=50?'warn':'bad',t:n+' participant'+(n>1?'s':'')+' made '+runs.length+' attempt'+(runs.length>1?'s':'')+'. Average score '+avg+'%, median best score '+med+'%, pass rate '+pr+'%.'});
  const cs=Object.entries(ct).filter(([,v])=>v[1]>0).map(([k,v])=>({k,p:v[0]/v[1]*100})).sort((a,b)=>a.p-b.p);
  if(cs.length>1){const w=cs[0],s=cs[cs.length-1];
    out.push({c:s.p>=80?'ok':'',t:'Strongest area: '+CATNAME[s.k]+' ('+Math.round(s.p)+'%).'});
    out.push({c:w.p<60?'bad':w.p<PASS?'warn':'',t:'Weakest area: '+CATNAME[w.k]+' ('+Math.round(w.p)+'%)'+(w.p<PASS?', below the pass mark.':'.')})}
  cs.filter(c=>c.p<PASS).slice(0,3).forEach(c=>{
    const risk=fd.filter(d=>{let a=0,b=0;d.runs.forEach(r=>{const v=(r.cats||{})[c.k];if(v){a+=v[0];b+=v[1]}});return b>0&&a/b*100<60}).length;
    if(risk)out.push({c:'warn',t:risk+' of '+n+' participant'+(n>1?'s are':' is')+' in a knowledge gap (below 60%) in '+CATNAME[c.k]+'.'})});
  const ms=missStats(runs)[0];
  if(ms&&ms.tot>=2){const q=QBY[ms.n];out.push({c:'bad',t:'Most-missed question: Q'+q.n+' ('+CATNAME[q.c]+') was missed by '+Math.round(ms.rate*100)+'% of answers. '+(wrongText(q,ms.w)?wrongText(q,ms.w)+'.':'')})}
  const au=runs.filter(x=>x.r.auto).length;
  if(au)out.push({c:'warn',t:au+' attempt'+(au>1?'s':'')+' ended when time expired. Consider more time or pacing practice.'});
  let un=0,tt=0;runs.forEach(({r})=>{if(r.code==='ks')return;(r.ans||[]).forEach(a=>{tt++;if(a[1]<0)un++})});
  if(tt&&un/tt>.05)out.push({c:'warn',t:Math.round(un/tt*100)+'% of questions were left unanswered. Time management is a factor.'});
  const weakTwo=cs.filter(c=>c.p<PASS).slice(0,2);
  out.push({c:weakTwo.length?'warn':'ok',t:weakTwo.length?'Recommended teaching focus: '+weakTwo.map(c=>CATNAME[c.k]).join(' and ')+'. Use the review corner notes and the most-missed list below.':'All categories met the pass mark. Move on to complete-category and full exam certification.'});
  return out;
}

  const px=l+bw*7;s+='<line x1="'+px+'" x2="'+px+'" y1="'+t+'" y2="'+(t+ch)+'" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4"/><text x="'+(px+5)+'" y="'+(t+12)+'" font-size="14" fill="var(--accent)" style="fill:var(--accent)">pass '+PASS+'%</text>';

    else if(new Set(o.filter(Boolean).map(x=>x.toLowerCase())).size!==o.filter(Boolean).length)m='Two options are identical.';
    else if(W.a<0||!o[W.a])m='Mark the correct option.';
    if(m){err.hidden=false;err.textContent=m;return}
    const oo=o.filter(Boolean);
    save.disabled=true;
    try{
      if(isNew){const nq={n,c:W.c,q:qt,o:oo,a:W.a,e:W.e.trim(),added:1};if(W.img)nq.img=W.img;await bankWrite(nq);D.push(nq);QBY[n]=nq}
      else{const textChanged=qt!==q.q;q.c=W.c;q.q=qt;q.o=oo;q.a=W.a;q.e=W.e.trim();if(textChanged&&q.f)delete q.f;if(W.img)q.img=W.img;else delete q.img;q.edited=q.added?0:1;await bankWrite(q)}
      BK.ui.edit=null;redraw();render()
    }catch(e){err.hidden=false;err.textContent='Could not save ('+((e&&e.code)||'error')+'). Check you have editor access.';save.disabled=false}
  }},isNew?'Add question':'Save changes');
  box.append(err,h('div',{class:'row',style:'margin-top:12px'},save,h('button',{class:'btn quiet',onclick:()=>{BK.ui.edit=null;redraw()}},'Cancel')));
  return box;
}
async function dlBankXlsx(){
  if(!window.JSZip){dlMsg('Excel export is not available right now.');return}dlMsg('Preparing the workbook…');
  try{const rows=[['No','Category','Question','A','B','C','D','Correct','Model answer','Explanation','Figure','Status']].concat(D.slice().sort((a,b)=>a.n-b.n).map(q=>[q.n,CATNAME[q.c],qPlain(q),q.o[0]||'',q.o[1]||'',q.o[2]||'',q.o[3]||'','ABCD'[q.a],q.o[q.a],q.e,q.img?'Yes':'',statusOf(q)||'Original']));
    await saveFile('WellAcademy-Quiz-Bank-'+new Date().toISOString().slice(0,10)+'.xlsx',await buildXlsx([{name:'Quiz Bank',rows}],'WellAcademy Quiz Bank'))}
  catch(e){dlMsg('Could not build the workbook ('+((e&&e.message)||'error')+').')}
}
async function dlBankDocx(){
  if(!window.JSZip){dlMsg('Word export is not available right now.');return}dlMsg('Preparing the Word file…');
  try{let b=docxHead('Quiz Bank with model answers',new Date().toLocaleDateString('en-GB'));
    Object.keys(CATS).forEach(k=>{const qs=D.filter(q=>q.c===k&&!q.del).sort((x,y)=>x.n-y.n);if(!qs.length)return;b+=dH(CATNAME[k]+' ('+qs.length+')');
      qs.forEach(q=>{b+=wp('Q'+q.n+'.  '+qPlain(q),{sz:28,b:true,bf:120,af:20,keep:true});q.o.forEach((t,i)=>{b+=wp('ABCD'[i]+')  '+t,{sz:28,af:10,ind:500,hang:300,keep:true,c:i===q.a?'166534':null,b:i===q.a})});b+=wp('Answer: '+'ABCD'[q.a]+'.  '+(q.e||''),{sz:28,i:true,c:'52636F',af:100,ind:200})})});
    await saveFile('WellAcademy-Quiz-Bank-'+new Date().toISOString().slice(0,10)+'.docx',await packDocx(b,'WellAcademy Quiz Bank'))}
  catch(e){dlMsg('Could not build the file ('+((e&&e.message)||'error')+').')}
}
