<style>
/* WellAcademy: deep navy and steel with a safety-orange accent. Times New Roman throughout, minimum 14px. */
:root{
  --bg:#f1f4f6; --surface:#ffffff; --fg:#0f2230; --muted:#52636f; --line:#d5dde2;
  --accent:#c2410c; --accent-fg:#ffffff; --steel:#1b5e6e; --tint:#e6eef1; --navy:#0f2430; --navy2:#1b4a5a;
  --ok:#17803f; --bad:#b3261e; --warn:#8a5a00; --okbg:#e0f2e7; --badbg:#fbe4e1; --shadow:0 1px 2px rgba(15,36,48,.07),0 10px 28px rgba(15,36,48,.07);
  --font:"Times New Roman",Cambria,Times,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1218; --surface:#121e27; --fg:#e9f0f3; --muted:#9fb1bc; --line:#26363f;
  --accent:#f97b45; --accent-fg:#1a0d06; --steel:#6ec3d3; --tint:#192a34; --navy:#0b1a22; --navy2:#16424f;
  --ok:#52c585; --bad:#ff8a80; --warn:#e6b84a; --okbg:#10301f; --badbg:#3a1a18; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1218; --surface:#121e27; --fg:#e9f0f3; --muted:#9fb1bc; --line:#26363f;
  --accent:#f97b45; --accent-fg:#1a0d06; --steel:#6ec3d3; --tint:#192a34; --navy:#0b1a22; --navy2:#16424f;
  --ok:#52c585; --bad:#ff8a80; --warn:#e6b84a; --okbg:#10301f; --badbg:#3a1a18; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.5;
  padding-block:0 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:960px;margin:0 auto}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;padding:14px 18px;border-radius:16px;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none;color:#fff}
.brand b{font-size:28px;line-height:1;letter-spacing:.3px;color:#fff}
.brand b span{color:#ff8f5a}
.brand small{display:block;font-size:14px;color:#b9cdd6;letter-spacing:1.6px;text-transform:uppercase;margin-top:4px}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
header.top .btn{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
header.top .btn:hover{background:rgba(255,255,255,.16)}
.btn.icon{width:44px;padding:0;display:inline-grid;place-items:center}
.btn.icon svg{width:22px;height:22px}
h1,h2,h3{font-weight:700;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:34px}h2{font-size:24px}h3{font-size:19px}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:18px;margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;min-width:0;box-shadow:var(--shadow)}
.hero{position:relative;overflow:hidden;border:0;color:#fff;background:linear-gradient(125deg,var(--navy) 0%,var(--navy2) 70%,#2a6e7e 100%);padding:30px 26px}
.hero:before{content:"";position:absolute;right:-70px;top:-70px;width:300px;height:300px;border-radius:50%;border:34px solid rgba(255,255,255,.06);box-shadow:0 0 0 38px rgba(255,255,255,.04),0 0 0 80px rgba(255,255,255,.03)}
.hero>*{position:relative}
.hero h1{color:#fff;font-size:38px}.hero p{color:#cfe0e7}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;font-size:15px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.22)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid2{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
button,input,select{font:inherit;font-size:16px}
.btn{min-height:44px;padding:8px 18px;border-radius:10px;border:1.5px solid var(--fg);background:transparent;color:var(--fg);cursor:pointer;font-weight:700;transition:background .15s,transform .15s,box-shadow .15s}
.btn:hover{background:var(--tint)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);box-shadow:0 4px 14px rgba(194,65,12,.28)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.quiet{border-color:var(--line);font-weight:400}
.btn[disabled]{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
label{display:block;font-weight:700;font-size:15px;margin-bottom:4px}
input[type=text],input[type=password],input[type=number],input[type=search],input[type=date],select{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus,select:focus{border-color:var(--steel)}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.scope{position:relative;display:flex;flex-direction:column;gap:5px;text-align:left;padding:16px 16px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);cursor:pointer;min-width:0;transition:transform .15s,box-shadow .15s,border-color .15s}
.scope:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--steel)}
.scope[aria-pressed=true]{border-color:var(--accent);background:var(--tint);box-shadow:inset 0 3px 0 var(--accent),var(--shadow)}
.scope b{font-size:18px;padding-right:44px}.scope span{font-size:15px;color:var(--muted)}
.badge{position:absolute;right:12px;top:12px;min-width:34px;height:34px;padding:0 6px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px;background:var(--navy2);color:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-width:56px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.notice{padding:12px 14px;border-left:4px solid var(--warn);background:var(--tint);border-radius:0 10px 10px 0;font-size:16px}
.notice.ok{border-color:var(--ok)}.notice.bad{border-color:var(--bad)}
.bar{height:12px;background:var(--tint);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--steel);border-radius:6px}
.bar i.low{background:var(--bad)}.bar i.mid{background:var(--warn)}.bar i.hi{background:var(--ok)}
.qhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.sticky{position:sticky;top:8px;z-index:6}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;border:1.5px solid var(--fg);border-radius:999px;padding:2px 14px;background:var(--surface)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.tag{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;background:var(--tint);color:var(--steel);border:1px solid var(--line);white-space:nowrap}.tag.cu{background:#fdeee6;color:#a8400f;border-color:#f3c9b3}
:root[data-theme="dark"] .tag.cu{background:#3a2418;color:#ffb08a;border-color:#6a3d27}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.cu{background:#3a2418;color:#ffb08a;border-color:#6a3d27}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.kcase{position:relative;text-align:left;display:grid;gap:4px;padding:12px 14px 12px 44px;border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.kcase[aria-pressed="true"]{border-color:var(--accent,#d9531e);background:var(--tint)}
.kcase .ck{position:absolute;left:12px;top:14px;width:22px;height:22px;border:2px solid var(--line);border-radius:6px;display:grid;place-items:center;font-weight:700;color:#fff}.kcase[aria-pressed="true"] .ck{background:var(--accent,#d9531e);border-color:var(--accent,#d9531e)}
.seg .kcase[aria-pressed=true]{background:var(--tint);color:var(--fg)}.seg>div,.seg>p{width:100%}.kcase small{color:var(--muted);font-size:14px}.kcase .tag{justify-self:start}
.ksg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.ksc{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}.ksc h4{margin:0 0 6px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--steel)}
.ksr{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:16px}.ksr:last-child{border-bottom:0}.ksr b{text-align:right;font-variant-numeric:tabular-nums}
.hint summary{cursor:pointer;color:var(--steel);font-size:14px}.hint div{font-size:14px;color:var(--muted);margin-top:4px}
.wk{font-size:14.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.cfs{margin-top:14px}.cfs h3{margin:0 0 8px}.cprev{margin-top:18px}.cbox{margin-top:6px}
.qtext{font-size:21px;line-height:1.4;margin:14px 0}
.qstruct p{margin:6px 0}.qask{font-weight:700}
.qdata{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:10px 0;max-width:640px;font-size:.88em}
.qd{display:flex;justify-content:space-between;gap:16px;padding:8px 14px;border-bottom:1px solid var(--line)}.qd:nth-child(even){background:var(--tint)}.qd:last-child{border-bottom:0}.qd span{color:var(--muted)}.qd b{text-align:right}
.qtb{border-collapse:collapse;margin:10px 0;font-size:.88em;min-width:min(100%,520px)}.qtb th,.qtb td{border:1px solid var(--line);padding:8px 14px;text-align:left}.qtb tr:first-child th{background:var(--tint)}.qtb td{font-variant-numeric:tabular-nums}
.qli{margin:6px 0 6px 22px}.qli li{margin:3px 0}

.fig{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;margin:0 0 14px;max-width:560px}
.fig img{display:block;width:100%;height:auto}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 15px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);cursor:pointer;font-size:18px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--steel)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--fg);display:grid;place-items:center;font-weight:700;font-size:15px}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--tint)}
.opt[aria-pressed=true] .l{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.map{display:flex;flex-wrap:wrap;gap:6px}
.map button{width:40px;height:40px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);cursor:pointer;font-size:15px;font-variant-numeric:tabular-nums}
.map button.done{background:var(--steel);border-color:var(--steel);color:var(--bg)}
.map button.cur{outline:3px solid var(--accent);outline-offset:1px}
.ks table,.tbl{width:100%;border-collapse:collapse;font-size:16px}
.ks td,.tbl td,.tbl th{padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
.ks td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl th{text-align:left;font-size:15px;border-bottom:2px solid var(--fg);position:sticky;top:0;background:var(--surface)}
.tblwrap{overflow-x:auto}
.ksin{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.ksin small{display:block;color:var(--muted);font-size:14px}
.score{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 11px;border-radius:999px;font-weight:700;font-size:15px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
.rev{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.rev.ok{border-left:4px solid var(--ok);padding-left:12px}.rev.bad{border-left:4px solid var(--bad);padding-left:12px}
.kv{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:4px 16px;font-size:16px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);box-shadow:var(--shadow);border-top:4px solid var(--steel)}
.tile b{display:block;font-size:32px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:15px;color:var(--muted)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;background:var(--tint);padding:2px 6px;border-radius:5px;word-break:break-all}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.rvl{margin:8px 0 0;padding-left:22px;display:grid;gap:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.rtimer{font-variant-numeric:tabular-nums;font-weight:700;font-size:36px;line-height:1;color:var(--accent)}
.hm td.hmc{text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.hm .hi{background:var(--okbg);color:var(--ok)}.hm .mid{background:var(--tint);color:var(--warn)}.hm .low{background:var(--badbg);color:var(--bad)}
details.ans{margin-top:8px}details.ans summary{cursor:pointer;font-weight:700}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.filters>div{flex:1 1 180px;min-width:0}
.insights{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.insights li{padding:11px 14px;border-radius:12px;background:var(--tint);border-left:5px solid var(--steel)}
.insights li.warn{border-left-color:var(--warn)}.insights li.bad{border-left-color:var(--bad)}.insights li.ok{border-left-color:var(--ok)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg);font-family:var(--font)}
.chart .mut{fill:var(--muted)}
.chart .hit{cursor:pointer}.chart .hit:hover{opacity:.8}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:999px;z-index:50;box-shadow:var(--shadow)}
.site-foot{margin-top:28px;padding:18px 0 8px;border-top:1px solid var(--line);color:var(--muted);font-size:15px;line-height:1.5;text-align:center}
.slidebox{background:var(--navy);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.slide{container-type:inline-size;aspect-ratio:16/9;width:100%;display:flex;flex-direction:column;background:var(--surface);color:var(--fg);position:relative;font-family:"Times New Roman",Cambria,Times,serif}
.slide .hd{background:#0f2430;color:#fff;padding:2.2cqw 4cqw 1.6cqw;border-bottom:.5cqw solid #f0743f}
.slide .kk{font-size:max(14px,1.6cqw);letter-spacing:.12em;text-transform:uppercase;color:#aac6d1}
.slide .tt{font-size:max(18px,3.2cqw);font-weight:700;line-height:1.15}
.slide .bd{flex:1;min-height:0;overflow:auto;padding:2.4cqw 4cqw 1cqw}
.slide ul.sb{list-style:none;display:grid;gap:1.3cqw}
.slide ul.sb li{font-size:max(14px,2.2cqw);line-height:1.3;padding-left:2.4cqw;position:relative}
.slide ul.sb li::before{content:"";position:absolute;left:0;top:.62em;width:.9cqw;height:.9cqw;background:#f0743f}
.slide .stb{display:grid}
.slide .sr{display:grid;grid-template-columns:30% 1fr;gap:2cqw;padding:.9cqw 1cqw;font-size:max(14px,2cqw);line-height:1.3}
.slide .sr:nth-child(even){background:var(--tint)}.slide .sr b{color:var(--steel)}
.slide .eqs{display:grid;gap:1.1cqw}
.slide .eqc{border-left:.5cqw solid #f0743f;padding:.5cqw 1.6cqw;background:var(--tint);border-radius:0 .6cqw .6cqw 0}
.slide .eqn{font-size:max(14px,1.8cqw);font-weight:700;color:var(--steel);line-height:1.2}
.slide .eqf{font-size:max(15px,2.1cqw);font-weight:700;line-height:1.25;margin:.1cqw 0}
.slide .eqm{font-size:max(14px,1.75cqw);line-height:1.25}

.bq{border-top:1px solid var(--line);padding:16px 0}.bq.gone{opacity:.6}.bq.editing{background:var(--tint);padding:16px;border-radius:12px;margin:10px 0}
.bopts{display:grid;gap:4px;margin-top:8px}.bopt{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:6px 10px;border-radius:8px;font-size:17px}.bopt.ok{background:var(--okbg);color:var(--ok)}.bopt.ok span{color:var(--fg)}
textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical}
.steps{margin:0 0 16px 22px;display:grid;gap:6px;font-size:17px}
.slide .sf{display:flex;justify-content:space-between;gap:12px;padding:.9cqw 4cqw 1.2cqw;font-size:max(14px,1.4cqw);color:var(--muted);border-top:1px solid var(--line)}
.slide.t-title,.slide.t-end,.slide.t-section{background:#0f2430;color:#fff;justify-content:center;padding:0 7cqw;border-left:1.4cqw solid #f0743f}
.slide.t-title .k,.slide.t-end .k,.slide.t-section .k{font-size:max(14px,2cqw);letter-spacing:.2em;color:#b9cdd6;margin-bottom:1.5cqw}
.slide .st{font-size:max(22px,5.4cqw);font-weight:700;line-height:1.1}
.slide .ss{font-size:max(16px,2.6cqw);color:#cddee6;margin-top:1.6cqw}
.slide .sn{font-size:max(14px,2.1cqw);color:#a0bec9;margin-top:1.2cqw}
.slide .sa{font-size:max(15px,2.2cqw);font-weight:700;color:#f0743f;margin-top:5cqw}
.slide.t-title .sf,.slide.t-end .sf,.slide.t-section .sf{position:absolute;left:0;right:0;bottom:0;border-top-color:#3c5a68;color:#bed0d9}
.slidebox:fullscreen{display:flex;align-items:center;justify-content:center;border-radius:0}.slidebox:fullscreen>div{width:min(100vw,177.78vh)}

<script>
const D=[{"n": 1, "c": "P", "q": "Calculate the volume of mud to pump a pill and displace it in an 8,000' MD well and cover 500 feet in the annulus. Annulus capacity factor is .0293 bbl/foot and the capacity of the drill pipe is .0177 bbl/foot.", "o": ["156 bbls", "153 bbls", "160 bbls", "142 bbls"], "a": 0, "e": "Volume = annulus 500 ft x 0.0293 + drill pipe 8,000 ft x 0.0177 = 14.65 + 141.6 = about 156 bbl."}, {"n": 2, "c": "B", "q": "Which is the best available option to the Driller if the well flows while a non-shearable tubular is across the BOP stack?", "o": ["Make up a safety valve in string and close the annular", "Circulate to create an ECD effect on the bottom of the hole", "Continue running in hole and use surging effect to stop the kick", "Close the Diverter and pump kill mud"], "a": 0, "e": "With a non-shearable tool across the stack, make up and close a safety valve in the string, then close the annular."}, {"n": 3, "c": "O", "q": "What is the main reason for a pit drill?", "o": ["To test the pit and flow alarms", "To ensure the crew is able to effectively recognize and react to a kick", "To ensure the crew is trained to kill the well", "To see how fast the Driller can line up on the trip tank"], "a": 1, "e": "Pit drills train the crew to recognise and react to a kick quickly, which limits influx size."}, {"n": 4, "c": "P", "q": "Severe losses occurred while drilling and the annulus fluid level dropped. The well was then filled to the top with water and remained static. Mud weight: 12 ppg Brine water weight: 8.6 ppg Height of water column in the annulus: 150 feet What is the reduction in bottom hole pressure with the 150 feet of water compared to the pressure before the losses?", "o": ["33 psi", "67 psi", "94 psi", "27 psi"], "a": 3, "e": "Change in BHP = (12 - 8.6) ppg x 0.052 x 150 ft = 26.5, about 27 psi.", "f": {"s": "Severe losses occurred while drilling and the annulus fluid level dropped. The well was then filled to the top with water and remained static.", "dt": [["Mud weight", "12 ppg"], ["Brine water weight", "8.6 ppg"], ["Height of water column in the annulus", "150 feet"]], "ask": "What is the reduction in bottom hole pressure with the 150 feet of water compared to the pressure before the losses?"}}, {"n": 5, "c": "M", "q": "The well is shut in a kick with unknown slow circulating rate pressure. What procedure should be used to obtain the correct initial circulating pressure (ICP)?", "o": ["After a correct start-up procedure and lag time, the drillpipe pressure gauge will read ICP.", "Use the SIDPP as the initial circulating pressure.", "Contact the Mud Logger and request the best possible calculation of the Initial Circulating Pressure to use during the well kill.", "Choose the kill rate circulating pressure that was taken with the last BHA in the hole nearest to the depth where the kick took place."], "a": 0, "e": "With no recorded SCR, after a correct start-up and lag time the drill pipe gauge reads ICP directly while casing pressure is held at SICP."}, {"n": 6, "c": "M", "q": "A kick was swabbed in during a trip out of the hole. Why is it important to strip the pipe back to bottom?", "o": ["To determine if the kick is gas or water", "To get below the influx and circulate it out", "To bullhead the influx back into the formation", "To allow the Lube and Bleed method to be used"], "a": 1, "e": "Stripping back to bottom puts the bit below the influx so it can be circulated out with a kill method."}, {"n": 7, "c": "K", "q": "The results of a flow check are inconclusive due to the small volume of returns from the well. Which of the following is the most accurate way to determine if the well is flowing?", "o": ["Shut the Diverter and monitor for flow from the vent line", "Line up to the trip tank and monitor for gains or losses", "Close in the well and line up through the mud-gas separator and monitor for flow at the Shakers", "Pull 5 stands and watch the well to see if it fills up"], "a": 1, "e": "The trip tank gives the most sensitive and accurate measure of small gains or losses."}, {"n": 8, "c": "S", "q": "What will happen to the bottom hole pressure if the gas influx is not allowed to expand as it migrates up the hole?", "o": ["Decrease", "Increase", "Stay the Same"], "a": 1, "e": "Gas that cannot expand while migrating keeps its pressure, so bottom hole pressure increases."}, {"n": 9, "c": "W", "q": "A liner has been set and the rig is circulating the well to clean mud before drilling out the Liner Shoe. What is a potential leak path to allow formation fluid to enter the well?", "o": ["Drill string", "Wellhead casing hanger", "Wellhead casing valve", "Liner Hanger"], "a": 3, "e": "The liner hanger (and liner top) is the potential leak path before the shoe is drilled out."}, {"n": 10, "c": "M", "q": "While circulating out a kick, the mud pump fails. What is the immediate action to take?", "o": ["Fix pump as soon as possible", "Change over to a different pump", "Divert the well", "Close the choke to secure the well"], "a": 3, "e": "Close the choke to secure the well: BHP can no longer be controlled once the pump has failed."}, {"n": 11, "c": "K", "q": "If the flow sensor suddenly showed a complete loss of returns, what would be the best action to take?", "o": ["Fill the annulus from the top with base fluid and monitor", "Close the well in and check for pressure", "Pump at an increased rate while mixing lost circulation material", "Stop all pumping and wait for orders"], "a": 0, "e": "On total loss of returns, top-fill the annulus with base fluid and monitor the level to avoid going underbalanced."}, {"n": 12, "c": "O", "q": "Why is the Driller given authority to shut in a well without waiting for permission?", "o": ["The Driller is the most equipped to shut-in the well", "The Driller has the 'password' to activate the BOP controls", "The Driller is the only person trained to kill the well", "The Driller can monitor well flow to allow a minimum 10 bbl gain"], "a": 0, "e": "The Driller is closest to the well and first to see the kick, so waiting for permission would let the influx grow."}, {"n": 13, "c": "W", "q": "What would happen if a self-fill failed to convert to a check valve in a vertical well? (Assume cement is heavier than the displacement mud)", "o": ["Cement would have to be reverse circulated", "Pressure would have to be held on the cement head to prevent u-tubing", "Pressure would have to be held on the annulus to prevent u-tubing", "Cement cannot be pumped down inside the casing"], "a": 1, "e": "If the float fails to convert, pressure must be held on the cement head to stop the heavier cement u-tubing back (keyed answer)."}, {"n": 14, "c": "M", "q": "The kill weight fluid has just been pumped to the bit during the Wait and Weight method. The pumps are shut down and after verifying there is no trapped pressure, the following pressures are observed. Current drill pipe pressure (DPP) 150 psi Current casing pressure (CP) 630 psi Which of the following should be done?", "o": ["Check to see if correct mud weight and surface to bit strokes were pumped", "Recalculate kill weight mud based on 150 psi SIDPP and circulate surface to bit", "Resume circulation by holding drill pipe pressure constant at 150 psi", "Bleed casing pressure to zero psi and confirm well is dead"], "a": 0, "e": "After KWM reaches the bit, DP pressure should be near zero. 150 psi means a mismatch, so verify mud weight and strokes pumped."}, {"n": 15, "c": "K", "q": "A change in which of the following indicators may warn of an increase in formation pressure?", "o": ["Rotary torque", "RPM", "ROP", "Any of the above"], "a": 3, "e": "ROP, torque and RPM trends can all warn of rising formation pressure."}, {"n": 16, "c": "P", "q": "The rig team has just calculated Kick Tolerance for a range of kick intensities, and the Kick Tolerance Window is provided below. The rig team predicts a maximum 1 ppg kick in this hole section. From the graph above, determine how many bbls they could successfully circulate out without breaking down the shoe?", "o": ["52 bbls", "56 bbls", "67 bbls", "36 bbls"], "a": 3, "e": "Read the circulate-to-shoe curve at 1.0 ppg kick intensity: about 36 bbl.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAL9A0cDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD6TooorxDIKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKY80UbqkkqIzcKGYAn6UAPopkk0UKb5pUjX1dgBWVqHifQdL1Wy0u+1KOG8vji3iOSZOccYoWrsgNiijqKbJIkUTyyNtRAWY+gFADqKzNF1/SPENpJd6NepdwxytC7oCAHU4I59K06bTWjAKKhmu7S3YLPdRRMeQHcKf1qL+09N/6CFt/39X/GkBbopkcsUyCSGRZEPRlOQafQAUVj6z4m0Lw9Jax6zqMdo12/lwhwTvbIGBge drostatic reduction, so gas expands less than in the vertical section."}, {"n": 20, "c": "D", "q": "Why is it important to follow a pressure ramp schedule when stopping rig pumps for an MPD connection on a well with a narrow window between Pore Pressure and Fracture gradient?", "o": ["As the pumps slow down, the well bore friction is reduced. The surface pressure needs to be increased to replace friction so as to maintain the desired pressure at the desired depth.", "It's not important. Just kill pumps and shut in.", "As the pumps slow down, the well bore friction is increased. The surface pressure needs to be decreased to prevent fracturing the well while reducing pump speed.", "A and C are correct."], "a": 0, "e": "As pumps slow, friction drops, so surface pressure must be raised to hold the target pressure at depth."}, {"n": 21, "c": "W", "q": "Which of the following is a \u201cphysical barrier\u201d?", "o": ["Monitoring the trip tank", "Bit nozzle", "A cement plug", "Proper BOP shut in procedure"], "a": 2, "e": "A cement plug is a physical (mechanical) barrier. Monitoring and procedures are not."}, {"n": 22, "c": "M", "q": "Well MD/TVD = 10,500 ft. 12 1/4\" casing set at 8,000 ft MD/TVD. While POOH at 9,000 ft, the driller notices the hole is not taking the correct amount of mud. He does a flow check, and the well is flowing. He immediately shuts in the well. What will be the best way to kill the well?", "o": ["Use the Lube and Bleed method to bring the influx to the surface.", "Start circulating the current mud weight until the kick is out of the well.", "Strip back to bottom using correct stripping procedures, then circulate the kick out.", "Bullhead the influx, then continue tripping."], "a": 2, "e": "Kick swabbed with the bit off bottom: strip back to bottom with correct procedures, then circulate the kick out.", "f": {"s": "Well MD/TVD = 10,500 ft. 12 1/4\" casing set at 8,000 ft MD/TVD. While POOH at 9,000 ft, the driller notices the hole is not taking the correct amount of mud. He does a flow check, and the well is flowing. He immediately shuts in the well.", "ask": "What will be the best way to kill the well?"}}, {"n": 23, "c": "D", "q": "A gas kick is being circulated along a horizontal hole section. What should happen to mud pit volume if the correct kill procedure is being followed?", "o": ["Remain approximately constant", "Decrease as the kill mud fills the horizontal section", "Increase at first as the gas begins to move then gradually decrease", "Increase as the gas expands"], "a": 0, "e": "In the horizontal section gas expands very little, so pit volume stays about constant."}, {"n": 24, "c": "B", "q": "While operating the annular preventer, the annular pressure gauge and accumulator gauges both drop but do not return back to normal pressure. The charge pumps are running continuously. What has probably happened?", "o": ["Master valve was not operated", "3-position/4-way valve did not operate", "Leak in the Annular closing line", "Annular regulator has failed"], "a": 2, "e": "Both gauges drop and do not recover with charge pumps running: a leak in the annular closing line."}, {"n": 25, "c": "P", "q": "What is abnormal formation pressure?", "o": ["Formation pressure higher than normal formation pressure", "Formation pressure lower than normal formation pressure", "Formation pressures above or below normal formation pressure", "Formation pressure equal to normal formation pressure"], "a": 0, "e": "Abnormal formation pressure is higher than normal (water hydrostatic) pressure (keyed answer)."}, {"n": 26, "c": "P", "q": "A weighted pill is pumped into the well. As the pipe is pulled out of the pill, what will happen to bottom hole pressure?", "o": ["Increase.", "Stay the same.", "Decrease."], "a": 2, "e": "As the pipe leaves the pill, annular capacity rises, the pill column gets shorter and bottom hole pressure decreases."}, {"n": 27, "c": "M", "q": "On a surface stack rig what pressure is maintained constant as the pump rate is increased to kill rate?", "o": ["Final Circulating Pressure", "Fracture Pressure", "Drill Pipe Pressure", "Casing Pressure"], "a": 3, "e": "On a surface stack, hold casing pressure constant while bringing the pump up to kill rate."}, {"n": 28, "c": "P", "q": "Which pressure detection tool or technique measures pressure downhole?", "o": ["Measurement While Drilling (MWD) tool", "Shale Density test", "Pressure While Drilling (PWD) tool", "Leak-off Test"], "a": 2, "e": "A PWD tool measures annular pressure downhole. The other options are surface or indirect methods."}, {"n": 29, "c": "K", "q": "What is a \"transition zone\"?", "o": ["The position in a reservoir where gas transitions to oil or water", "A change in the formation from high permeability to low permeability", "A section of formation where formation pore pressure is changing", "Depth where the formations are strong enough to be shut-in with the BOP"], "a": 2, "e": "A transition zone is where formation pore pressure is changing, typically from normal to abnormal."}, {"n": 30, "c": "D", "q": "When drilling a horizontal section of a well a gas kick is taken and the well shut in. If the influx is in the horizontal section what would the SIDPP and SICP read? (No float valve in the drill string)", "o": ["SIDPP is much greater than the SICP", "SICP is much greater than the SIDPP", "Both are approximately the same", "SIDPP will be zero"], "a": 2, "e": "With the influx in the horizontal section it has almost no vertical height, so SIDPP and SICP are about equal."}, {"n": 31, "c": "K", "q": "When drilling in the transition zone to an abnormally pressured formation, what changes may you expect to see in drilling data?", "o": ["Reduction in drill string torque by more than 50%", "Gradual increase in ROP", "Increase in WOB to maintain same ROP", "Reduced drag on connections"], "a": 1, "e": "ROP typically increases gradually as the bit enters under-compacted, higher-pressure shale."}, {"n": 32, "c": "M", "q": "What is a \u2018safety-margin\u2019 in a kill operation?", "o": ["A 1 ppg increase in calculated kill mud weight to maintain hydrostatic if mud weight increase is not maintained during circulation", "A margin that reduces the risk of losses during the kill", "A margin that compensates for the choke operator closing the choke too quickly", "Extra pressure applied in the well to reduce risk of going underbalanced"], "a": 3, "e": "The safety margin is extra pressure to reduce the risk of going underbalanced (keyed answer)."}, {"n": 33, "c": "B", "q": "Why is it important to reduce the regulated hydraulic closing pressure for the annular BOP before running large sized casing?", "o": ["To prepare for a soft shut-in", "To reduce closing time", "To avoid collapsing the casing during closure"], "a": 2, "e": "Reducing closing pressure prevents the annular collapsing large casing during closure."}, {"n": 34, "c": "W", "q": "Which of the following situations could result in a swabbed-in kick during a casing operation?", "o": ["Use of lightweight cement after casing has been run", "Pulling the casing back out after getting it stuck", "Use of a self-filling float that fails to convert", "Failure to fill the casing while running in the hole"], "a": 1, "e": "Pulling stuck casing out through tight clearance can swab in a kick."}, {"n": 35, "c": "K", "q": "Which of the following statements is a good operating practice in a top-hole section that has the risk of gas-bearing formations?", "o": ["Never use a drill pipe float", "Control the rate of penetration", "Maintain high ROP", "Regularly pump light sweeps"], "a": 1, "e": "Controlling ROP limits the gas loaded into the annulus in shallow gas-bearing sections."}, {"n": 36, "c": "P", "q": "How does increasing wellbore temperature affect well control when using non-aqueous (OBM/SBM) mud?", "o": ["Increases hydrostatic pressure in wellbore", "No significant effect on hydrostatic pressure in wellbore", "Decreases hydrostatic pressure in wellbore"], "a": 2, "e": "In oil or synthetic mud, higher temperature lowers density, which decreases hydrostatic pressure."}, {"n": 37, "c": "P", "q": "How does an increase in mud weight affect the slow circulating rate pressures?", "o": ["The friction pressure increases with higher mud weight", "There is no change because the friction losses are all in the drill pipe", "The friction pressure decreases with higher mud weight"], "a": 0, "e": "Higher mud weight raises friction pressure, so slow circulating rate pressures increase."}, {"n": 38, "c": "M", "q": "The drill string is being displaced with Kill Weight Mud (KWM) while holding the casing pressure constant during the 2nd Circulation of the Driller\u2019s Method, why is it important that the annulus be clear of gas?", "o": ["Gas in the annulus will expand, therefore a constant casing pressure will cause well to go underbalance", "Degasser equipment on surface is shut down during 2nd circulation to prevent plugging due to kill weight mud", "Gas in the annulus will increase the bottom hole pressure during 2nd circulation"], "a": 0, "e": "Constant casing pressure with gas in the annulus lets the gas expand, which can put the well underbalanced (keyed answer)."}, {"n": 39, "c": "B", "q": "When testing a surface BOP stack with a test plug, why must the side outlet valves below the plug be kept in the open position?", "o": ["To prevent a vapor lock", "To monitor the well while testing", "Because the test will create extreme hook loads", "Because reverse circulation will be needed to release test plug"], "a": 1, "e": "Open side outlet valves let any leak past the test plug be seen while testing (keyed answer)."}, {"n": 40, "c": "P", "q": "Given the same drillstring, hole size, flow rate, and fluid, which configuration below has the greater APL?", "o": ["16,000' MD/10,000' TVD", "11,000' MD/11,000' TVD", "12,000' MD/11,000' TVD", "Depends if it\u2019s a mud or a brine fluid."], "a": 0, "e": "APL depends on measured length, so 16,000 ft MD gives the greatest APL."}, {"n": 41, "c": "P", "q": "Which of the following best describes fracture pressure?", "o": ["The downhole pressure that will cause the formation to fail", "The maximum pressure allowed on the drillpipe gauge during a kill operation", "The surface pressure that is likely to cause losses at the casing shoe", "The maximum bottom hole pressure allowed during a kill operation"], "a": 0, "e": "Fracture pressure is the downhole pressure that causes the formation to fail."}, {"n": 42, "c": "D", "q": "When tripping back into a horizontal section where barite sag occurred, what will happen to the hydrostatic pressure during the first bottoms-up circulation?", "o": ["Decreases", "Increase", "Stays the same"], "a": 0, "e": "Sagged barite leaves lighter mud in the circulation path, so hydrostatic drops during the first bottoms-up."}, {"n": 43, "c": "B", "q": "What measures can be taken to prevent \"blow-through\" in a mud gas separator?", "o": ["Allow the hydrostatic head to be reduced in the separator before the influx arrives to the separator.", "Limit the flow rate into the separator when the influx is entering the separator.", "Restrict the vent line ID.", "Use the minimum TVD on the mud seal."], "a": 1, "e": "Limit flow rate into the separator when the influx arrives to avoid blow-through."}, {"n": 44, "c": "W", "q": "Why is it important, as a minimum, to circulate a full bottoms-up before starting a cement job?", "o": ["To ensure it will not induce losses during the cement job", "The time taken to circulate bottoms-up will replace the requirement to flow check the well", "To ensure a good clean column of mud in the annulus", "To eliminate the possibility of hydrate formation"], "a": 2, "e": "A full bottoms-up before cementing gives a clean mud column in the annulus."}, {"n": 45, "c": "D", "q": "While drilling a well, with MPD, using a 15.1 ppg mud density, the formation pressure in the lateral is 8,575 psi, at 12,560' MD/10,250' TVD. What is the minimum surface pressure needed on a connection to prevent influx?", "o": ["640 psi", "420 psi", "750 psi", "530 psi"], "a": 3, "e": "Hydrostatic = 15.1 x 0.052 x 10,250 = 8,048 psi. Surface pressure = 8,575 - 8,048 = 527, about 530 psi."}, {"n": 46, "c": "D", "q": "Where is the best place to put a heavy pill to maintain overbalanced during tripping operations?", "o": ["Inside the pipe of the horizontal section.", "In the horizontal section of the well annulus.", "Inside the pipe of the vertical section.", "In the vertical section of the well annulus."], "a": 3, "e": "A heavy pill in the vertical annulus adds the most effective hydrostatic during tripping."}, {"n": 47, "c": "P", "q": "What is the new approximate pump pressure at 50 strokes per minute (SPM) if the pressure was 425 psi at 42 SPM?", "o": ["602 psi", "506 psi", "300 psi", "357 psi"], "a": 0, "e": "P2 = 425 x (50/42)^2 = about 602 psi."}, {"n": 48, "c": "W", "q": "What increases the risk of surging when running casing in the hole?", "o": ["Conditioning the mud before running the casing", "Reducing the casing running speed", "Excessive casing running speed", "Cleaning the hole of cuttings before running the casing"], "a": 2, "e": "Excessive casing running speed increases surge pressure."}, {"n": 49, "c": "B", "q": "What do the following readings on the BOP accumulator system indicate?", "o": ["Everything is O.K.", "A leak in the annular preventer hydraulic system", "Possible leak in the system and the pressure switch controlling the pump has not operated", "A malfunction in the manifold regulator"], "a": 2, "e": "Accumulator pressure falling with the others constant: a possible leak and the pump pressure switch has not operated.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAFLAp string has washed out", "Gas is migrating up the well", "A weak formation has broken down", "Both gauges have malfunctioned"], "a": 2, "e": "Both pressures building then dropping quickly points to a weak formation breaking down."}, {"n": 52, "c": "B", "q": "What is the only function of a diverter?", "o": ["To create a back pressure sufficient to stop formation fluids entering the wellbore.", "To direct formation fluids away from the rig floor", "To act as a backup system if the annular preventer fails.", "To shut in a shallow kick."], "a": 1, "e": "The only function of a diverter is to direct formation fluids away from the rig floor."}, {"n": 53, "c": "K", "q": "While circulating, ballooning may occur when the bottom-hole pressure approaches the formation fracture pressure. What causes this increased bottom-hole pressure?", "o": ["Failure to fill up when tripping out", "Low formation permeability and porosity", "Abnormal formation pressure", "Annular friction while circulating"], "a": 3, "e": "When circulating, annular friction raises BHP toward the fracture pressure and can cause ballooning."}, {"n": 54, "c": "P", "q": "What best describes a kick tolerance of 25 barrels?", "o": ["Based on a chosen kick intensity, a gas kick of 25 bbls is the maximum that can be shut-in and circulated out without fracture at the weak point of the well", "Based on a chosen kick intensity, a gas kick of 25 bbls is the maximum that can be circulated out without bursting the casing at surface", "Based on a chosen kick intensity, a salt-water kick of 25 bbls is the maximum that can be circulated out without bursting the casing at surface", "Based on a chosen kick intensity, a salt-water kick of 25 bbls is the maximum that can be shut-in and bullheaded"], "a": 0, "e": "Kick tolerance of 25 bbl is the maximum gas kick, for the chosen intensity, that can be shut in and circulated out without fracturing the weak point."}, {"n": 55, "c": "D", "q": "While drilling through a 13.0 ppg formation and holding 450 psi surface back pressure (SBP) with 13.5 ppg ECD in the well, the well is beginning to take losses. What could be done to minimize or prevent the losses?", "o": ["Keep drilling ahead as the loss is simply the fluid the well is taking.", "Increase pump speed to account for losses.", "Increase surface back pressure to 500 psi.", "Lower your surface back pressure to help reduce ECD."], "a": 3, "e": "Lowering surface back pressure reduces ECD and helps stop losses."}, {"n": 56, "c": "M", "q": "Why must spare capacity be left in the active pit system when circulating out a kick?", "o": ["If the kick is oil, it will expand and pit level will increase", "If the kick is salt water, it will expand and pit level will increase", "To store the kick fluid as it is circulated from the well", "If the kick is gas, it will expand and pit level will increase"], "a": 3, "e": "Gas expands as it rises, so spare pit capacity is needed."}, {"n": 57, "c": "O", "q": "How can a pill be spotted in the correct place?", "o": ["Stop pumps as soon as you see Casing Pressure increase.", "Stop pumps when shut-in casing pressure has dropped by 150 psi.", "Allow pill to drop; hydrostatic will balance itself.", "Calculate displacement of drillpipe and each annular section the pill must go through. Then convert to strokes."], "a": 3, "e": "Calculate displacement of the pipe and each annular section, then convert to strokes."}, {"n": 58, "c": "P", "q": "Your current Mud Weight is 11.5 ppg. You were instructed to pump a 35 bbl slug weighing 13.5 ppg. Your Drill Pipe capacity is 0.0178 bbls/foot. What is the total volume returned to surface?", "o": ["41 bbl", "62 bbl", "70 bbl", "30 bbl"], "a": 0, "e": "Returns = pill 35 bbl + displaced volume 35 x (13.5/11.5 - 1) = 6.1 bbl, so about 41 bbl."}, {"n": 59, "c": "K", "q": "Indications of ballooning have occurred, and the decision is made to bleed 10 bbls of mud back into the trip tank. What potential negative consequences of this decision could result?", "o": ["No negative consequence to this action would result because the bleed volume is small.", "If the problem was a kick and not ballooning, the kick would become larger.", "The intensity of the ballooning is increased.", "Formation fracture gradient would decrease."], "a": 1, "e": "If it is a kick, bleeding back lets more influx enter and the kick gets bigger."}, {"n": 60, "c": "M", "q": "Which constant bottom hole pressure method removes the influx from the hole while pumping the kill mud?", "o": ["Bullheading Method", "Volumetric Method", "Wait and Weight Method", "Driller's Method"], "a": 2, "e": "The Wait and Weight method removes the influx while pumping kill mud."}, {"n": 61, "c": "P", "q": "Which should be used to calculate Annular Pressure Loss (APL)?", "o": ["Use TVD if the oil/water ratio of the mud exceeds 85%.", "Use MD because the friction depends on the length, not the vertical depth of the well.", "Use either MD or TVD as they are interchangeable for this calculation.", "Use TVD because APL depends on hydrostatic pressure in the well."], "a": 1, "e": "APL depends on length of flow path, so use MD not TVD."}, {"n": 62, "c": "K", "q": "When would you most likely carry out a flow check?", "o": ["Before the drill pipe is run-in past the BOP", "Before starting to pull out of the hole", "After the BHA has been run-in past the BOP", "After the Driller has increased the Weight on Bit"], "a": 1, "e": "Flow check before starting to pull out of the hole."}, {"n": 63, "c": "B", "q": "What is the function of Shear-Blind Rams?", "o": ["To hang-off the drillstring during a kill", "To cut the drillstring and seal off the hole", "As a back-up to the Rotating Control Device (RCD)", "To close in the well if the diverter fails"], "a": 1, "e": "Shear-blind rams cut the drill string and seal the hole."}, {"n": 64, "c": "M", "q": "Why is it important to monitor the pit volume during a well control operation?", "o": ["To know when to adjust the pump speed", "To know when to adjust the drill pipe pressure", "To check for mud losses and monitor gas expansion", "To keep the bottom hole pressure constant"], "a": 2, "e": "Pit volume shows losses and gas expansion during a kill."}, {"n": 65, "c": "B", "q": "In the figure below, which dimension is used to calculate the maximum pressure inside the separator before the potential for formation gas to 'blow through' into the shaker area?", "o": ["H4 and D2", "D3", "H1 and D1", "H2"], "a": 3, "e": "H2, the liquid seal height, sets the maximum separator pressure before blow-through.", "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAK+AuoDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LooooATijilxRigBOKOKXFGKAE4o4pcUYoATijilxRigBOKOKXFGKAE4o4pcUYoATijilxRigBOKOKXFGKAE4o4pcUYoATijilxRigBOKOKXFGKAE4o4pcUYoATijilxRigBOKOKXFGKAE4o4pcUYoATiilxSUAFGaaT7U3eM470ASZozUbOqYLHAPftQHXkHgjqDQBJmjNR7gSMc59KVGBcr0I7GgCSjiijFACcUcUuKMUAHFFGKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigApDS0GgCvO4jgd2VmAGcL1NeXXPxn0W11uXR20nUDdocFUt2bj1r1ZwCP/r15IYIf+Gh2UWyEG0JPyjH3BQB0vhz4gaT4hvWs/Jns
