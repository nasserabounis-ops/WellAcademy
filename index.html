n Drill Pipe Pressure?", "o": ["Shear the pipe and read the drill pipe pressure directly off the casing gauge", "Pump at 2 barrels per minute into the annulus with the well shut in. When the pressure equalizes, the float will open. This pump pressure is the Shut In Drill Pipe pressure", "Pump very slowly into the drill string with the well shut in and as shut-in casing pressure starts to rise, stop the pump, read the pressure, and subtract any overbalance.", "Bring the pump up to kill rate holding the casing pressure constant by opening the choke. The pressure shown when the pump is at kill rate is the Shut In Drill Pipe pressure"], "a": 2, "e": "Pump very slowly, stop when casing pressure begins to rise, read the DP pressure and subtract any overbalance."}, {"n": 67, "c": "B", "q": "What is the function of vent/ bleed / straight through line in the choke manifold?", "o": ["To avoid exceeding equipment pressure limitations", "To by-pass the choke(s)", "To apply back pressure while controlling a kick", "Both A and B"], "a": 3, "e": "The vent/bleed line limits pressure and bypasses the chokes, so both A and B."}, {"n": 68, "c": "P", "q": "In general, what effect does increasing temperature have on drilling fluid density?", "o": ["It will reduce the fluid density", "It will increase the fluid density", "There is no effect on fluid density"], "a": 0, "e": "Higher temperature reduces fluid density."}, {"n": 69, "c": "D", "q": "While MPD drilling at 11,850' MD/8,500' TVD, the well is full of 10.0 ppg mud, formation pressure is 4,800 psi, surface back pressure is 250 psi, and APL is 400 psi. The well is:", "o": ["Underbalanced", "Overbalanced", "Hydrostatically Underbalanced", "Both B and C"], "a": 3, "e": "Hydrostatic = 10 x 0.052 x 8,500 = 4,420 psi (below 4,800: hydrostatically underbalanced). With 250 + 400 added it is 5,070 psi, so overbalanced.", "f": {"s": "While MPD drilling at 11,850' MD/8,500' TVD:", "dt": [["Mud", "10.0 ppg, well full"], ["Formation pressure", "4,800 psi"], ["Surface back pressure", "250 psi"], ["APL", "400 psi"]], "ask": "The well is:"}}, {"n": 70, "c": "K", "q": "The driller is tripping in the hole and monitoring the well on the trip tank. Over the last 5 stands the trip tank has gained 3 barrels more than the calculated volume. What should the driller do?", "o": ["Trip 5 more stands and see if the numbers even out", "Continue tripping to bottom so the well can be killed", "Alert the crew and perform a flow check", "Keep tripping but check for leaking Trip tank valves"], "a": 2, "e": "3 bbl gained over calculated: alert the crew and flow check."}, {"n": 71, "c": "D", "q": "During MPD, what is the well status when drilling an 11.8 ppg formation with an 11 ppg mud with an ECD of 12 ppg?", "o": ["Dynamically Overbalanced, Hydrostatically Underbalanced", "Dynamically Overbalanced, Hydrostatically Overbalanced", "Dynamically Underbalanced, Hydrostatically Underbalanced", "Dynamically Underbalanced, Hydrostatically Overbalanced"], "a": 0, "e": "Hydrostatic 11 ppg is below 11.8, but ECD of 12 ppg is above it: dynamically overbalanced, hydrostatically underbalanced."}, {"n": 72, "c": "D", "q": "Why should the annular preventer not be used during normal MPD operations?", "o": ["For drilling overbalanced only.", "Not an API barrier.", "It should be reserved for well control.", "Not pressure rated for MPD."], "a": 2, "e": "The annular preventer is reserved for well control."}, {"n": 73, "c": "M", "q": "The casing pressure was held constant while the pump was brought up to kill rate for a Wait and Weight kill. The drill pipe gauge reading is 150 psi above calculated Initial Circulating Pressure (ICP). What action should be taken?", "o": ["Recalculate circulating pressure schedule based on actual drill pipe gauge reading", "Use a new ICP of 150 psi less than the original calculated ICP", "Open the choke to reduce drill pipe pressure back to the original calculated ICP", "Shut down and clean out choke manifold or change to another choke"], "a": 0, "e": "DP gauge reading above calculated ICP means recalculate the circulating schedule from the actual reading."}, {"n": 74, "c": "W", "q": "After cementing casing, the plan is to remove the BOP stack. When is it considered safe to start this operation?", "o": ["The number of minutes that is equal to the cement yield per sack multiplied by the cement density", "The cement has reached a minimum of a 100psi compressive strength", "The well has not flowed for a 45-minute period since the cement was displaced into position", "The planned waiting-on-cement time is complete and well is static"], "a": 3, "e": "Remove the BOP when waiting-on-cement time is complete and the well is static."}, {"n": 75, "c": "S", "q": "A well has been shut-in on a kick and the drill pipe is clear of influx. Shut-in drill pipe pressure is : 400 psi Shut-in casing pressure is : 600 psi Both pressures start rising due to gas migration. If drill pipe pressure is held constant at 400 psi, what will happen to the bottom hole pressure?", "o": ["Increase", "Decrease", "Stay the same"], "a": 2, "e": "With the drill pipe clear, holding DP pressure constant keeps BHP constant.", "f": {"s": "A well has been shut-in on a kick and the drill pipe is clear of influx.", "dt": [["Shut-in drill pipe pressure", "400 psi"], ["Shut-in casing pressure", "600 psi"]], "s2": "Both pressures start rising due to gas migration.", "ask": "If drill pipe pressure is held constant at 400 psi, what will happen to the bottom hole pressure?"}}, {"n": 76, "c": "M", "q": "The Driller's Method is used to circulate out a salt-water influx. What will happen to the casing pressure as the influx moves up the annulus?", "o": ["Casing pressure will only change due to changes in annulus size", "Salt water will behave in the same way as a gas influx", "As influx expands Casing Pressure will increase", "Casing pressure will slowly decrease as influx moves up the annulus"], "a": 0, "e": "Salt water does not expand, so casing pressure only changes with annulus size."}, {"n": 77, "c": "M", "q": "After the first circulation of the Driller\u2019s method, the well is shut in. Casing pressure is 150 psi higher than drill pipe pressure. What does this indicate?", "o": ["Kill mud was not heavy enough to kill the well", "There is still some influx in the well", "Increase mud hydrostatic by 150 psi", "All is OK to start the second circulation"], "a": 1, "e": "Casing pressure above DP pressure after the first circulation means influx is still in the well."}, {"n": 78, "c": "P", "q": "What is needed to calculate an accurate formation strength at the shoe?", "o": ["A constant mud weight above the casing shoe", "An accurate hole capacity", "To install a retrievable packer approximately 1,000 feet below the rig floor", "An accurate stroke counter"], "a": 0, "e": "An accurate formation strength needs a constant mud weight above the casing shoe."}, {"n": 79, "c": "K", "q": "While drilling ahead and recording high connection gas levels, there is a power failure that eliminates the ability to circulate and rotate. What is the safest action to take?", "o": ["Flow check, monitor the well, and shut-in if the well is flowing", "Pull out to the casing shoe and work the pipe up and down", "Work pipe up and down to prevent stuck pipe", "Start up the degasser"], "a": 0, "e": "Flow check, monitor the well, and shut in if it is flowing."}, {"n": 80, "c": "M", "q": "While holding Final Circulating Pressure constant as kill mud is circulated up the annulus, what will happen to Bottom Hole Pressure?", "o": ["Increase", "Decrease", "Stay the same"], "a": 2, "e": "Holding FCP constant while kill mud goes up the annulus keeps BHP constant."}, {"n": 81, "c": "S", "q": "A well is shut in after taking a 25 bbl kick with 300 psi SIDPP and 650 psi SICP. If the well had been shut in on a 10 bbl kick, how would shut in pressure be affected?", "o": ["SICP would be higher", "SIDPP would be higher", "SIDPP would be lower", "SICP would be lower"], "a": 3, "e": "A smaller kick is a shorter column in the annulus, so SICP is lower while SIDPP is unchanged."}, {"n": 82, "c": "B", "q": "What are potential problems with mud gas separators?", "o": ["Restricted mud outlet causes raised mud levels and risks liquid exiting the vent line.", "Eroded baffle plates reducing retention time and the separator\u2019s ability to allow gas to come out of solution.", "Vent line restrictions (small diameter/excessive curves) causes too much back pressure on the mud seal and risks blow-through.", "All of the above."], "a": 3, "e": "Restricted mud outlet, eroded baffles and vent line restrictions are all MGS problems."}, {"n": 83, "c": "S", "q": "While shut-in, the drill pipe pressure gauge on the remote choke panel reads 350 psi. The drill pipe pressure gauge on the standpipe manifold reads 650 psi. What action should be taken?", "o": ["Start the kill using 650 psi because overbalance is needed for the well kill operation", "Use the average pressure of 500 psi to start the kill", "Investigate the reason for the difference", "Start the kill using 350 psi because the remote choke will be used during kill operation"], "a": 2, "e": "A gauge difference must be investigated before the kill starts."}, {"n": 84, "c": "M", "q": "After completing a successful pump start up, the casing gauge is stable. What gauge should now read Initial Circulating Pressure (ICP)?", "o": ["The Kill Line Pressure Gauge", "The Accumulator Pressure Gauge", "The Casing Pressure Gauge", "The Drill Pipe Pressure Gauge"], "a": 3, "e": "After a correct start-up the drill pipe gauge reads ICP."}, {"n": 85, "c": "S", "q": "After pulling 33 stands, the well starts flowing and is shut-in. Assume that the influx is at the bottom of the hole and there is no gas migration. What will happen to casing pressure as the drill string is stripped into the influx?", "o": ["Increase", "Decrease", "Stay the same"], "a": 0, "e": "Stripping into the influx displaces it upward, increasing its height, so casing pressure increases."}, {"n": 86, "c": "K", "q": "Why is it important to detect a kick as early as possible?", "o": ["Minimizing the size of the influx will result in a lower SICP", "Minimizing the size of the influx will result in a higher SIDPP", "Minimizing the size of the influx will result in a higher SICP", "Minimizing the size of the influx will result in a lower SIDPP"], "a": 0, "e": "Detecting early gives a smaller influx and therefore a lower SICP."}, {"n": 87, "c": "W", "q": "A 500-foot long cement plug is set inside the casing shoe. The mud above the cement plug is to be displaced with brine. Mud density below the cement plug = 12.8 ppg Brine density = 8.7 ppg If communication occurs, allowing pressure to pass between the top and the bottom of the plug, what would happen to the bottom hole pressure?", "o": ["BHP would increase", "BHP would decrease", "BHP would stay the same"], "a": 1, "e": "If the plug communicates, the lighter brine above reduces the pressure at the bottom, so BHP decreases.", "f": {"s": "A 500-foot long cement plug is set inside the casing shoe. The mud above the cement plug is to be displaced with brine.", "dt": [["Mud density below the cement plug", "12.8 ppg"], ["Brine density", "8.7 ppg"]], "ask": "If communication occurs, allowing pressure to pass between the top and the bottom of the plug, what would happen to the bottom hole pressure?"}}, {"n": 88, "c": "O", "q": "How are weighted pills used in drilling operations?", "o": ["To compensate for hydrostatic underbalance when tripping out of the hole.", "To make the mud level drop inside the pipe when tripping out of the hole.", "To help increase the chance of swabbing when tripping out of the hole.", "All of the above."], "a": 0, "e": "Weighted pills compensate for the hydrostatic loss when tripping out."}, {"n": 89, "c": "M", "q": "Why is bottom hole pressure maintained constant during a well kill?", "o": ["To prevent a further influx or formation breakdown during the kill process", "To prevent the influx from expanding as it is circulated up-hole", "To allow a high overbalance on the kicking formation", "To keep pump pressure constant as kill mud is pumped to the bit"], "a": 0, "e": "Constant BHP prevents a further influx and formation breakdown."}, {"n": 90, "c": "M", "q": "On a surface stack rig, the Driller brings the pump slowly on-line at the start of the kill operation. What pressure must the choke operator hold constant during this operation?", "o": ["Slow circulating rate pressure", "Maximum allowable annular surface pressure", "Casing Pressure", "Shut in Drill Pipe Pressure"], "a": 2, "e": "Hold casing pressure constant while the pump is brought up to speed."}, {"n": 91, "c": "S", "q": "At which location should the initial surface pressures be read after shutting in on a kick?", "o": ["The accumulator", "The Driller\u2019s console", "The standpipe manifold", "The choke control panel"], "a": 3, "e": "Read initial pressures at the choke control panel."}, {"n": 92, "c": "D", "q": "An influx has been circulated out of the well with the well control choke using the driller method\u2019s first circulation. The well is balanced with a surface back pressure of 600 psi @ 200 GPM. To continue drilling ahead with the same MW through an MPD manifold, what surface back pressure will be needed with the pump rate 450 GPM?", "o": ["Less than 600 psi.", "More than 600 psi.", "600 psi."], "a": 0, "e": "Higher circulating rate adds APL, so less surface back pressure is needed (below 600 psi)."}, {"n": 93, "c": "B", "q": "An attempt is made to close a pipe ram from the Driller's remote panel. What has happened if the open light stays on, the close light does not illuminate and the manifold pressures remains static?", "o": ["The light bulb has blown", "There is a leak in the hydraulic open line to the BOP", "The 3-position/4-way valve on the hydraulic BOP control unit failed to operate", "There is a leak in the hydraulic close line to the BOP"], "a": 2, "e": "The open light stays on and manifold pressure is static: the 3-position/4-way valve did not operate."}, {"n": 94, "c": "B", "q": "What data should be known if a Shear Ram is in the BOP Stack?", "o": ["Opening pressure", "Size and strength of tubulars the ram can shear", "Useable accumulator reservoir volume", "All the above"], "a": 1, "e": "Opening pressure, shear capacity and usable accumulator volume must all be known."}, {"n": 95, "c": "P", "q": "Calculate ECD using the given data: Mud density: 9 ppg Depth: 19,000' MD/11,500' TVD Annular Friction: 200 psi", "o": ["9.1 ppg", "9.3 ppg", "9.0 ppg", "9.2 ppg"], "a": 1, "e": "ECD = 9 + 200 / (0.052 x 11,500) = 9.33, about 9.3 ppg.", "f": {"s": "Calculate ECD using the given data:", "dt": [["Mud density", "9 ppg"], ["Depth", "19,000' MD / 11,500' TVD"], ["Annular friction", "200 psi"]]}}, {"n": 96, "c": "S", "q": "Kill mud is returning at the end of a kill operation. The well is shut down but drill pipe and casing show 100 psi on the gauges. How would it be determined if the extra pressure is \u2018trapped\u2019 pressure?", "o": ["Bleed off 100 psi, open up the well and check for flow", "Bleed off pressure in stages at the choke then monitor pressure to see if it is static or builds back up to 100 psi", "Start circulating surface to bit strokes then shut down and re-check the pressures", "Increase mud weight by equivalent of 100 psi and circulate around the well"], "a": 1, "e": "Bleed in stages at the choke and watch whether pressure rebuilds, to tell trapped pressure from a live well."}, {"n": 97, "c": "S", "q": "While shut-in the drill pipe pressure gauge on the remote choke panel reads 450 psi. The drill pipe pressure gauge on the standpipe manifold reads 650 psi. What gauge should be used to calculate kill mud weight?", "o": ["Use the average pressure of 500 psi to calculate", "Calculate using 650 psi", "Neither gauge until the difference is investigated", "Calculate using 450 psi"], "a": 2, "e": "Use neither gauge until the difference is investigated."}, {"n": 98, "c": "M", "q": "What is the purpose of stripping?", "o": ["Adding or removing pipe through a sealing element while pipe heavy", "Running pipe into an open well to return to bottom quickly before flow becomes excessive", "Forcing tubulars into a well when pipe light conditions are present", "Reduce casing pressure by exchanging hydrostatic pressure for surface pressure"], "a": 0, "e": "Stripping moves pipe through a sealing element while pipe-heavy."}, {"n": 99, "c": "K", "q": "What is the best description of the term \u201cFingerprinting the Well\u201d?", "o": ["Recording azimuth and elevation of the wellbore from logging", "Recording block name and field number for the location of the well", "Recording baseline drilling data that can be compared to current data to help recognize downhole problems", "Sampling the formation fluid for grade, quality, and contaminants"], "a": 2, "e": "Fingerprinting records baseline data to compare against current data."}, {"n": 100, "c": "M", "q": "A well is shut-in. What is the procedure for determining Initial Circulating Pressure (ICP) when the Slow Circulating Rate Pressure (SCRP) has not been recently recorded?", "o": ["After a correct start-up procedure and lag time, the drillpipe pressure gauge will read ICP.", "Use the most recent pre-recorded SCRP on the rig. Then, calculate the ICP with the standard formula: ICP = SIDPP + SCRP", "Bring the pump up to kill speed, holding the drillpipe pressure constant with the choke. Read the pressure on the drillpipe gauge.", "Briefly open the well and record the SCRP. Then, calculate the ICP with the standard formula: ICP = SIDPP + SCRP"], "a": 0, "e": "After a correct start-up and lag time the drill pipe gauge reads ICP."}, {"n": 101, "c": "K", "q": "A Pressure While Drilling (PWD) Tool can provide information that indicates an influx while drilling. What information from a PWD Tool would indicate an influx in the well?", "o": ["A decrease in Annular Velocity", "A record of Weight on Bit (WOB), Shock and Torque", "A reduction in Equivalent Circulating Density (ECD)", "An indication of wellbore azimuth and elevation"], "a": 2, "e": "An influx lowers the annular density, so a PWD tool shows reduced ECD."}, {"n": 102, "c": "S", "q": "A well has been shut-in on a kick and the kill operation has not been started. Shut-in drill pipe pressure 400 psi Shut-in casing pressure 600 psi After stabilization, both pressures start rising due to gas migration. If the casing pressure is held constant at 600 psi, what will happen to the bottom hole pressure?", "o": ["Decrease", "Increase", "Stay the same"], "a": 0, "e": "Holding casing pressure constant while gas migrates lets the gas expand, so BHP decreases.", "f": {"s": "A well has been shut-in on a kick and the kill operation has not been started.", "dt": [["Shut-in drill pipe pressure", "400 psi"], ["Shut-in casing pressure", "600 psi"]], "s2": "After stabilization, both pressures start rising due to gas migration.", "ask": "If the casing pressure is held constant at 600 psi, what will happen to the bottom hole pressure?"}}, {"n": 103, "c": "M", "q": "A well is shut-in on a swabbed kick while pulling out of the hole. SICP and SIDPP are both reading 100 psi with 25 stands off bottom. Which of the following would be the best course of action to bring the well back under primary control?", "o": ["Strip back to bottom and then circulate the influx out using Driller's Method", "Circulate the kick out at slow pump rate using the Driller's Method while keeping drill pipe pressure constant", "Raise the mud density to overcome 100 psi SICP & circulate using Wait and Weight Method", "Set cement plug and sidetrack the well using increased mud weight"], "a": 0, "e": "Swabbed kick with the bit off bottom: strip back to bottom, then use the Driller's Method."}, {"n": 104, "c": "S", "q": "What is the definition of initial \u201cShut In Casing Pressure (SICP)\u201d?", "o": ["The difference between total hydrostatic pressure in the drill string and the formation pressure", "The total pressure in the drillstring minus the bottom hole pressure", "The difference between total hydrostatic pressure in the annulus and the formation pressure"], "a": 2, "e": "SICP is the difference between annular hydrostatic and formation pressure."}, {"n": 105, "c": "W", "q": "Before drilling out the float shoe, after a casing and cement job the instructions are to circulate the hole clean. Why should the pit and flow levels be monitored during this operation?", "o": ["To monitor for losses as any extra cement is cleaned out of the well", "To monitor for thermal expansion of the cement", "To determine when bottoms-up circulation is complete", "To verify the float shoe is not leaking"], "a": 3, "e": "Monitor to verify the float shoe is not leaking."}, {"n": 106, "c": "S", "q": "What happens to the gas volume as a gas kick is circulated up the wellbore?", "o": ["Gas volume will decrease", "Gas volume will stay the same", "Gas volume will increase"], "a": 2, "e": "Gas expands as pressure falls, so the volume increases."}, {"n": 107, "c": "K", "q": "What action should a Driller take after a drilling break followed by a change in pump pressure?", "o": ["Circulate bottoms up", "Check for flow", "Reduce pump speed", "Reduce weight on bit"], "a": 1, "e": "After a drilling break with a pump pressure change, check for flow."}, {"n": 108, "c": "M", "q": "After the 2nd Circulation of the Driller\u2019s Method the well is shut in correctly. What should the pressure gauges read assuming no trapped pressure in the well?", "o": ["SICP will be higher than the SIDPP", "SICP and SIDPP gauges will both read 0 psi", "SICP and SIDPP will be equal to the well\u2019s original SIDPP", "SICP will be lower than the SIDPP"], "a": 1, "e": "After the second circulation, with no trapped pressure, both gauges read 0 psi."}, {"n": 109, "c": "S", "q": "Given the following information, calculate the shut-in casing pressure. Well Information: Drill Pipe pressure reads 0 psi (no float in the string) Well Depth = 7,000 feet TVD/ 7,225 feet MD Drill String full of 10.4 ppg mud Annulus full of 10.0 ppg mud", "o": ["3,640 psi", "150 psi", "145 psi", "3,785 psi"], "a": 2, "e": "(10.4 - 10.0) x 0.052 x 7,000 = 145.6, about 145 psi.", "f": {"s": "Given the following information, calculate the shut-in casing pressure.", "dt": [["Drill pipe pressure", "0 psi (no float in the string)"], ["Well depth", "7,000 feet TVD / 7,225 feet MD"], ["Drill string", "full of 10.4 ppg mud"], ["Annulus", "full of 10.0 ppg mud"]]}}, {"n": 110, "c": "K", "q": "The flow sensor shows a total loss of returns and the mud level cannot be seen in the annulus. What immediate action should be taken?", "o": ["Shut the well in and pump lost circulation material", "Pump at reduced rate adding lost circulation material", "Continue drilling ahead cautiously", "Prepare to top-fill the annulus with water (or lightest mud available), and record volume."], "a": 3, "e": "Prepare to top-fill the annulus with water or the lightest mud and record the volume."}, {"n": 111, "c": "K", "q": "Which of the following actions should be taken when drilling through a transition zone?", "o": ["Fingerprint connections for flowback trends", "Reduce Revolutions per Minute (RPM)", "Increase Weight on Bit", "Increase time between mud weight checks"], "a": 0, "e": "In a transition zone, fingerprint connections for flowback trends."}, {"n": 112, "c": "M", "q": "If the Rotary hose split during a kill operation and the pump has been stopped, what would be the following action(s) to take?", "o": ["Close the full opening safety valve (FOSV) and close the choke", "Prepare to reverse circulate", "Close the Shear Rams and the full opening safety valve (FOSV)", "Close the HCR valve"], "a": 0, "e": "Close the FOSV and the choke."}, {"n": 113, "c": "K", "q": "Which of the following may be a lagging indicator of an increase in formation pressure?", "o": ["Change in ROP", "Change in rotary torque", "Change in RPM", "Change in background gas"], "a": 3, "e": "Background gas lags: it is seen after the change has been drilled."}, {"n": 114, "c": "P", "q": "While drilling a horizontal well, if the pump rate is decreased, what happens to APL?", "o": ["Depends if it\u2019s a mud or a brine fluid.", "Decrease.", "Will stay the same.", "Increase."], "a": 1, "e": "A lower pump rate reduces annular friction, so APL decreases."}, {"n": 115, "c": "M", "q": "Which of the following statements is true when starting to pump kill mud?", "o": ["Open choke fully then increase pump speed to kill rate, then adjust choke to get initial circulating pressure.", "The surface line volume (pump to standpipe) does not need to be included in the kill plan.", "The surface line volume (pump to standpipe) needs to be accounted for in the kill plan.", "Maintain the drill pipe pressure constant when bringing the pumps up to kill speed."], "a": 2, "e": "The surface line volume (pump to standpipe) must be included in the kill plan."}, {"n": 116, "c": "M", "q": "A gas kick is being circulated out. What will happen to the bottom hole pressure if drill pipe pressure is held constant when kill mud is being pumped to the bit?", "o": ["Stay the Same", "Increase", "Decrease"], "a": 1, "e": "DP pressure should fall as kill mud goes down. Holding it constant overpressures the well, so BHP increases."}, {"n": 117, "c": "B", "q": "What equipment is specific to a shut-in operation with casing?", "o": ["Inside Blow Out Preventer (IBOP)", "Check Valve", "A suitable crossover (Swage)", "All the above"], "a": 2, "e": "A swage crossover is the item specific to shutting in with casing."}, {"n": 118, "c": "M", "q": "During the Wait & Weight method, how can bottom hole pressure be controlled when kill weight mud is being pumped down the drill string?", "o": ["Follow a casing pressure schedule", "Hold drill pipe pressure constant", "Utilize a drill pipe pressure schedule", "Hold casing pressure constant"], "a": 2, "e": "Follow a drill pipe pressure schedule while kill mud goes down the string."}, {"n": 119, "c": "B", "q": "What statement is true if a non-return valve is stabbed into the string?", "o": ["Easier to stab if strong flow is encountered up the drill string", "Must not be run in the hole in the closed position", "Has potential to leak through the open/close key", "Will not allow wireline to be run inside the drill string"], "a": 3, "e": "A non-return valve will not allow wireline to be run inside the string."}, {"n": 120, "c": "W", "q": "Cement is being displaced with drilling mud into position with proper lift pressure. What should happen to active pit level during this stage of the operation?", "o": ["Pit level will decrease", "Pit level will increase", "Pit level will stay constant"], "a": 2, "e": "Cement displaced by mud with proper lift: volume in equals volume out, so pit level is constant."}, {"n": 121, "c": "B", "q": "What is the meaning of \"blow-through\"?", "o": ["When liquid is exiting the vent line.", "When unseparated gas is flowing through the vent line.", "When unseparated gas is moving through the mud outlet.", "When the MGS is being flushed."], "a": 2, "e": "Blow-through is unseparated gas moving through the mud outlet."}, {"n": 122, "c": "M", "q": "Based on the information below, what will happen to casing shoe pressure if the Wait and Weight method is used instead of the Driller\u2019s Method? Well Information Hole Depth \u2013 10000 feet. Shoe Depth \u2013 8830 feet Surface to Bit Strokes \u2013 1630 strokes Bit to Shoe Strokes \u2013 1300 strokes Bit to Surface Strokes \u2013 6480 strokes SIDPP \u2013 500 psi SICP \u2013 800 psi Current fluid weight \u2013 10.3 ppg Kill Fluid Density \u2013 11.3 ppg MAASP \u2013 1300 psi Pit Gain \u2013 28 bbl", "o": ["Shoe pressure will be lower", "Shoe pressure will be higher", "Shoe pressure will be the same"], "a": 2, "e": "Shoe pressure is the same for both methods when the gas reaches the shoe (keyed answer).", "f": {"s": "Based on the information below, what will happen to casing shoe pressure if the Wait and Weight method is used instead of the Driller's Method?", "dt": [["Hole depth", "10000 feet"], ["Shoe depth", "8830 feet"], ["Surface to bit strokes", "1630 strokes"], ["Bit to shoe strokes", "1300 strokes"], ["Bit to surface strokes", "6480 strokes"], ["SIDPP", "500 psi"], ["SICP", "800 psi"], ["Current fluid weight", "10.3 ppg"], ["Kill fluid density", "11.3 ppg"], ["MAASP", "1300 psi"], ["Pit gain", "28 bbl"]]}}, {"n": 123, "c": "P", "q": "What is the correct definition of Permeability?", "o": ["The pressure of the fluid in the pore space", "The density of the formation fluids", "The ability of formation fluids to move through the rock", "The amount of solid rock in the formation"], "a": 2, "e": "Permeability is the ability of fluids to move through rock."}, {"n": 124, "c": "S", "q": "A well is shut in on a kick and the shut-in pressures on the gauges have stabilized. The SIDPP reads 350 psi and the SICP reads 900 psi. Which of the following is true?", "o": ["The well is underbalanced", "The well is balanced", "The well is not balanced; bottom hole pressure (BHP) on the annulus side is lower due to contamination by formation fluids", "The well is not balanced; bottom hole pressure (BHP) on the annular side is higher than on the drill pipe side of the U-tube"], "a": 1, "e": "SIDPP below SICP shows the annulus has lighter influx. The well is balanced."}, {"n": 125, "c": "W", "q": "What can cause a kick when running casing in the hole?", "o": ["Surging induced losses causing a drop in mud level", "Conditioning mud before running casing", "Swabbing the formation", "Keeping the casing full of mud"], "a": 0, "e": "Surge-induced losses that drop the mud level can cause a kick when running casing."}, {"n": 126, "c": "M", "q": "Which of the following information is least important for planning a circulating kill operation?", "o": ["Formation fluid compressibility", "Shut in Casing Pressure (SICP)", "Current drilling fluid density", "Shut in drill pipe pressure (SIDPP)"], "a": 0, "e": "Formation fluid compressibility is least important for planning a circulating kill."}, {"n": 127, "c": "P", "q": "When would dissolved gas in an oil-based mud be expected to break out of solution?", "o": ["As it passes through the casing shoe", "As it gets close to the surface", "As it is enters the wellbore at very high pressures", "As it moves around the bottom hole assembly (BHA)"], "a": 1, "e": "Dissolved gas breaks out as pressure falls, close to surface."}, {"n": 128, "c": "M", "q": "You have drilled from 9,700 ft to 9,825 ft MD in the last hour. MW = 10.6 ppg, bit size = 8 1/2\", open hole capacity = 0.0702 bbl/ft. 5\" OD drillpipe, capacity = 0.01776 bbl/ft, metal displacement = 0.0065 bbl/ft. 9 5/8\" casing is set at 8,000 ft MD. What changes should be made to the pre-recorded data sheet?", "o": ["Change surface-to-bit strokes", "Change kill mud weight", "Change SCR", "Change MAASP"], "a": 0, "e": "Drilling 125 ft deeper adds string volume, so surface-to-bit strokes change.", "f": {"s": "You have drilled from 9,700 ft to 9,825 ft MD in the last hour.", "dt": [["Mud weight", "10.6 ppg"], ["Bit size", "8 1/2\""], ["Open hole capacity", "0.0702 bbl/ft"], ["5\" OD drill pipe capacity", "0.01776 bbl/ft"], ["Metal displacement", "0.0065 bbl/ft"], ["9 5/8\" casing set at", "8,000 ft MD"]], "ask": "What changes should be made to the pre-recorded data sheet?"}}, {"n": 129, "c": "O", "q": "What is a reason for a Choke drill?", "o": ["To ensure the crew is trained to line up correctly for a reverse circulation well kill", "To see how fast the Driller can close the choke in an emergency", "To allow the crew the opportunity to practice Choke skills"], "a": 2, "e": "A choke drill lets the crew practise choke skills."}, {"n": 130, "c": "M", "q": "You are displacing the well with kill weight mud. The well includes a tapered drill string. Which of the following parameters should NOT vary as different sections of pipe are displaced with kill mud?", "o": ["Displacement time/1000 feet of pipe length", "Pressure drop per 100 strokes pumped", "Bottom Hole Pressure", "Displacement stroke count/ 1000 feet of pipe length"], "a": 2, "e": "BHP must stay constant, whatever section of pipe is being displaced."}, {"n": 131, "c": "D", "q": "How may gas kicks in horizontal wells differ from gas kicks in vertical wells?", "o": ["SICP and SIDPP are initially the same.", "Magnitude of influx in horizontal well will cause higher SICP than in a vertical well.", "No gas migration prior to influx moving into the vertical section."], "a": 0, "e": "With the influx in the horizontal section, SICP and SIDPP are initially about the same."}, {"n": 132, "c": "B", "q": "What is the most common use of a Vacuum Degasser?", "o": ["It is only used while circulating out a kick", "It is used as a standby in the event of the \u201cMud/Gas Separator (Poor Boy)\u201d failing", "It is mainly used to separate gas from liquids while testing", "It is used to prevent pumping gas cut mud downhole"], "a": 3, "e": "A vacuum degasser prevents pumping gas-cut mud downhole."}, {"n": 133, "c": "P", "q": "What is the definition of abnormal formation pressure?", "o": ["Formation pressure that differs from the hydrostatic pressure caused by a full column of formation oil", "Formation pressure that equals the hydrostatic pressure caused by a full column of fresh water", "Formation pressure that differs from the hydrostatic pressure caused by a full column of formation gas", "Formation pressure that is greater than the hydrostatic pressure caused by a full column of formation water"], "a": 3, "e": "Abnormal pressure is greater than the hydrostatic of a full water column."}, {"n": 134, "c": "B", "q": "What do the following readings on the BOP acc AFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFABRRRQAUUUUAFFFFAH/2Q=="}, {"n": 136, "c": "W", "q": "The well is full of 12.2ppg mud. A 500-foot cement plug is set 2000 feet above TVD and tested. The mud above the plug is replaced with 10.2 ppg Brine. If the cement plug failed, what would happen to the bottom hole pressure?", "o": ["BHP would increase", "BHP would decrease", "BHP would stay the same"], "a": 1, "e": "Lighter brine (10.2) replaces 12.2 ppg mud above the failed plug, so BHP decreases."}, {"n": 137, "c": "D", "q": "When drilling a horizontal well a fault is crossed and a kick is taken. The well is shut in. Calculate the mud weight required to kill the well using the data below: WELL DATA MD TVD Depth at start of horizontal 7,690 feet 6,100 feet Depth at time of kick 11,000 feet 6,140 feet Length of horizontal section 3,310 feet Mud weight 11 ppg KICK DATA Shut In Drillpipe Pressure 150 psi Shut In Casing Pressure 170 psi", "o": ["11.5 ppg", "12 ppg", "11.4 ppg", "11.6 ppg"], "a": 0, "e": "KWM = 11 + 150 / (0.052 x 6,140) = 11.47, about 11.5 ppg.", "f": {"s": "When drilling a horizontal well a fault is crossed and a kick is taken. The well is shut in. Calculate the mud weight required to kill the well using the data below:", "tb": [{"h": ["WELL DATA", "MD", "TVD"], "r": [["Depth at start of horizontal", "7,690 feet", "6,100 feet"], ["Depth at time of kick", "11,000 feet", "6,140 feet"], ["Length of horizontal section", "3,310 feet", ""], ["Mud weight", "11 ppg", ""]]}, {"h": ["KICK DATA", ""], "r": [["Shut in drill pipe pressure", "150 psi"], ["Shut in casing pressure", "170 psi"]]}]}}, {"n": 138, "c": "D", "q": "In MPD operations, what is the purpose for diverting flow through the Mud Gas separator?", "o": ["To be able to dump the excess mud into the separator.", "To remove free gas from mud returns during MPD operations.", "To avoid closing the BOP when gas hits the surface.", "All of the above."], "a": 1, "e": "The MGS removes free gas from the returns."}, {"n": 139, "c": "M", "q": "What gauge is used to record the Slow Circulating Rate (SCR) pressure?", "o": ["The pump pressure gauge at the mud pump", "The pump pressure gauge at the Standpipe Manifold", "The same drill pipe gauge that is used to kill the well", "The casing pressure gauge at the Standpipe Manifold"], "a": 2, "e": "Record SCR on the same drill pipe gauge used for the kill."}, {"n": 140, "c": "O", "q": "While preparing to trip in the hole, what action can be taken to mitigate potential losses?", "o": ["Maintain trip speed but pay close attention to the displacement volumes and trip sheet", "Reduce the trip speed, closely watch displacement volumes and consider breaking circulation at selected depths", "No special instructions are required", "Get the bit on bottom right away and start making hole"], "a": 1, "e": "Reduce trip speed, watch volumes and break circulation at selected depths."}, {"n": 141, "c": "P", "q": "Which of the following can be used to calculate equivalent circulating density (ECD)?", "o": ["The pressure loss in the drill string", "The pressure loss across the nozzles", "The pressure loss in the open hole section only", "The pressure loss in the annulus"], "a": 3, "e": "ECD uses the annular pressure loss."}, {"n": 142, "c": "M", "q": "What is the first action to take if a pump fails while killing a well?", "o": ["Switch immediately to a cement pump", "Open the choke to decrease casing pressure", "Shut the well in", "Close the choke to increase casing pressure"], "a": 2, "e": "If a pump fails during a kill, shut the well in."}, {"n": 143, "c": "K", "q": "Which kick indicator normally occurs first?", "o": ["Flow Rate increase", "Trip Tank increase", "Pit Gain increase"], "a": 0, "e": "Flow rate increase is normally the first kick indicator."}, {"n": 144, "c": "B", "q": "Which of the following statements about fixed bore ram type BOPs is correct?", "o": ["Fixed bore ram type BOPs can close and seal on various pipe sizes", "Fixed bore ram type BOPs cannot be used to hang off the drill string", "Fixed bore ram type BOPs are designed to contain and seal Rated Working Pressure from above the closed ram as well as from below", "Fixed bore ram type BOPs are designed to contain Rated Working Pressure only from below the closed ram"], "a": 3, "e": "Ram BOPs are designed to contain rated working pressure from below the closed ram only. They are not rated to hold pressure from above.", "corr": 1}, {"n": 145, "c": "M", "q": "While conducting the Wait and Weight Method, the Derrickman states that the barite supply is plugged and kill weight mud cannot be maintained while pumping. What action should be taken?", "o": ["Inform crew to fix blockage, then inform supervisor once kill mud is at the Bit", "Inform supervisor of problem and recommend to shut-in well while blockage is fixed", "Instruct crew to add Bentonite to increase the mud weight", "Inform supervisor that crew is fixing the blockage but continue circulating"], "a": 1, "e": "If the barite supply is blocked, tell the supervisor and shut in while it is fixed."}, {"n": 146, "c": "B", "q": "What is the function of Blind Rams?", "o": ["As a back-up to the Annular", "To seal off the open hole", "To cut the drillstring and seal off the hole", "To hang-off the drillstring during a kill"], "a": 1, "e": "Blind rams seal off the open hole."}, {"n": 147, "c": "K", "q": "Increasing flowback time has been documented for the last five connections. The Driller believed that the flowback time was too long and closed the well in. There is 150 psi on the Drill Pipe and the Casing gauges. The Driller has bled off 50 psi. Drill Pipe Pressure returned to 150 psi. Casing Pressure is 175 psi. The bleed-off was repeated and Drill Pipe Pressure returned to 150 psi and Casing pressure is 200 psi. What is likely happening in the current situation?", "o": ["This is a kick. Prepare to carry out a kill operation", "This is ballooning. Bleed off and drill ahead", "This is mud compressibility. Bleed off and drill ahead", "This is the result of gas migration. Start the Volumetric Method"], "a": 0, "e": "Pressure rebuilds and casing pressure keeps rising after each bleed: this is a kick."}, {"n": 148, "c": "D", "q": "During an MPD connection, the well is full of a 15.6 ppg mud at 16,000\u2019 MD/14,000\u2019 TVD and has 350 psi surface back pressure. Formation pressure is 11,652 psi. The well is:", "o": ["Overbalanced", "Underbalanced", "Hydrostatically Underbalanced", "Both A and C"], "a": 3, "e": "Hydrostatic = 15.6 x 0.052 x 14,000 = 11,357 psi (below 11,652: hydrostatically underbalanced). With 350 psi added it is 11,707 psi, so overbalanced.", "f": {"s": "During an MPD connection:", "dt": [["Mud", "15.6 ppg, well full"], ["Depth", "16,000' MD / 14,000' TVD"], ["Surface back pressure", "350 psi"], ["Formation pressure", "11,652 psi"]], "ask": "The well is:"}}, {"n": 149, "c": "W", "q": "What would indicate that a self-fill float is plugged?", "o": ["Returns will decrease", "Running time increases", "Returns will increase", "No returns back to trip tank"], "a": 2, "e": "A plugged float makes the casing displace more fluid, so returns increase."}, {"n": 150, "c": "D", "q": "The formation pressure at 12,000 TVD/12,500 MD is 7,500 psi. The mud weight in the hole is 11 ppg. How much back pressure is enough to bring the BHP up to balance formation pressure?", "o": ["636 psi", "686 psi", "350 psi", "Zero"], "a": 0, "e": "7,500 - (11 x 0.052 x 12,000 = 6,864) = 636 psi."}, {"n": 151, "c": "D", "q": "What is the risk of drilling with hydrostatically underbalanced fluid?", "o": ["Reduction in surface back pressure could cause the well to go underbalanced.", "Incorrectly calculated APL could cause the well to go underbalanced.", "Likelihood of a kick may be increased.", "All the above."], "a": 3, "e": "All of the listed risks apply to drilling hydrostatically underbalanced."}, {"n": 152, "c": "M", "q": "You have pumped Kill Weight Mud (KWM) to the bit during the beginning of the wait and weight method. It is decided to shut the pumps down and check pressures. You notice there is still pressure on the Drill Pipe gauge. What could you do?", "o": ["Nothing, due to KWM there is a U-tube effect causing increased Drill Pipe Pressure", "Check for trapped pressure", "KWM has caused an overbalance in the well, trapping excess pressure", "Continue pumping, the KWM has not reached surface, therefore the SIDPP will not read zero"], "a": 1, "e": "If pressure remains on the drill pipe after pumping KWM to the bit, check for trapped pressure."}, {"n": 153, "c": "K", "q": "Which of the following practices could result in the influx of a shallow hazard?", "o": ["Pumping a cement slurry with short transition time", "Not filling the hole properly while tripping out", "Keeping the hole full with a continuous trip tank", "Pumping out of the hole"], "a": 1, "e": "Not filling the hole while tripping out can bring in a shallow influx."}, {"n": 154, "c": "K", "q": "What is the main reason for measuring the mud weight and viscosity as it exits the well?", "o": ["It provides information about the well conditions", "It informs the Mud Engineer when to do mud tests", "It makes sure the well plan\u2019s mud program is followed", "It ensures compliance with company policy"], "a": 0, "e": "Mud weight and viscosity out give information about well conditions."}, {"n": 155, "c": "O", "q": "To avoid undesired increases in bottomhole pressure, what is a good practice when tripping back into the well containing a weighted pill in the annulus?", "o": ["Circulate the pill out in stages.", "Bullhead the pill into the formation.", "Leave the pill where it is. We may need it if the well starts taking fluid.", "Weight up the entire system to the pill weight before tripping in."], "a": 0, "e": "Circulate the pill out in stages to avoid undesired BHP increases."}, {"n": 156, "c": "K", "q": "When drilling in the transition zone to an abnormally pressured formation, what changes could be expected in the mud when circulated to the surface?", "o": ["Decreasing mud weight", "Increasing mud weight", "Decrease in gas content", "Decrease in cuttings volume"], "a": 0, "e": "In a transition zone, gas-cut mud returns with decreasing mud weight."}, {"n": 157, "c": "M", "q": "Which of the following statements best describes the Volumetric Method?", "o": ["Maintains Shut-In Casing Pressure at its initial value as the influx migrates to surface", "Maintains bottom hole pressure as the influx migrates to surface", "Maintains constant casing shoe pressure as the influx migrates to surface", "Maintains constant pressure inside the influx as it is allowed to migrate to surface"], "a": 1, "e": "The Volumetric Method maintains BHP as the influx migrates."}, {"n": 158, "c": "S", "q": "After the well is shut-in, what key data points should be recorded?", "o": ["Weight on Bit, Flow Rate, Initial Shut-In Casing Pressure", "Shut-In Drill Pipe Pressure, SCR Pressure, Pit Gain", "Shut-In Drill Pipe Pressure, Pit Gain, Initial Shut-In Casing Pressure", "Shut-In Drill Pipe Pressure, Pit Gain, Stabilized Shut-In Casing Pressure"], "a": 2, "e": "Record SIDPP, pit gain and initial SICP."}, {"n": 159, "c": "M", "q": "On the kill sheet, why is open hole volume from the bit up to the shoe calculated?", "o": ["This is used to estimate the maximum casing pressure", "It is useful for calculating how much gas expansion will occur", "It is part of the exercise to calculate volumes of the stage in the annulus", "To estimate when the influx has entered the casing"], "a": 3, "e": "Bit-to-shoe volume tells you when the influx has entered the casing."}, {"n": 160, "c": "P", "q": "Pump pressure is 355 psi at 42 Strokes per Minute (SPM). What is the approximate new pump pressure at 35 SPM?", "o": ["296 psi", "243 psi", "511 psi", "247 psi"], "a": 3, "e": "P2 = 355 x (35/42)^2 = about 247 psi."}, {"n": 161, "c": "O", "q": "5\" Drillpipe in the hole. Metal displacement = 0.0065 bbl/ft. Capacity = 0.01776 bbl/ft. How much mud should it take to fill the hole after pulling 5 stands dry? Stand length = 93 ft.", "o": ["8.3 bbls", "0.6 bbls", "3.0 bbls", "1.6 bbls"], "a": 2, "e": "Pulling dry: fill = metal displacement 5 x 93 x 0.0065 = 3.0 bbl.", "f": {"s": "5\" drill pipe is in the hole.", "dt": [["Metal displacement", "0.0065 bbl/ft"], ["Capacity", "0.01776 bbl/ft"], ["Stand length", "93 ft"]], "ask": "How much mud should it take to fill the hole after pulling 5 stands dry?"}}, {"n": 162, "c": "O", "q": "What action should be taken when spotting a pill in the wellbore?", "o": ["Include enough LCM in the pill to plug the MWD tool when it reaches that depth.", "Reset the stroke counter when the pill starts down the drillpipe and keep track of the strokes pumped.", "(SICP - SIDP) x .052 /2757 will give the depth from the rotary table.", "Reset the stroke counter every hundred strokes while pumping the pill. MW/number of stroke counter resets = pill location."], "a": 1, "e": "Reset the stroke counter when the pill starts down the pipe and track strokes pumped."}, {"n": 163, "c": "M", "q": "What is the purpose of a correct pump start-up procedure during a well kill?", "o": ["To get the calculated final circulating pressure on the pump pressure gauge", "To hold correct pump pressure as kill mud is pumped to the rig floor", "To maintain a constant bottom hole pressure as pump speed is increased to kill rate", "To allow shut in casing pressure to be increased by the slow circulating rate pressure"], "a": 2, "e": "A correct start-up keeps BHP constant as pump speed rises to kill rate."}, {"n": 164, "c": "W", "q": "What would happen if a self-fill float failed to convert to a check valve in a vertical well? (Assume cement is heavier than the displacement mud)", "o": ["Pressure would have to be held on the annulus to prevent u-tubing", "Cement would u-tube back up inside the casing when pumps were stopped", "Cement cannot be pumped down inside the casing", "Cement would have to be reverse circulated"], "a": 1, "e": "The heavier cement would u-tube back up inside the casing when pumps stop."}, {"n": 165, "c": "D", "q": "When killing a well with a horizontal section using the Wait and Weight method, what will happen if you use a vertical kill sheet to circulate out the kick?", "o": ["The FCP is more difficult to calculate", "You will be applying too little pressure to the well", "You will be applying too much pressure to the well", "The strokes to the bit will be wrong"], "a": 2, "e": "A vertical kill sheet applies too much pressure to a well with a horizontal section."}, {"n": 166, "c": "B", "q": "What is the safest and most reliable method for monitoring leaks through the BOP?", "o": ["Visually check by looking through the rotary table", "Monitor for changes in the flow rate indicator", "Line up the trip tank to monitor for flow above the closed BOP", "Close the diverter and monitor the vent line"], "a": 2, "e": "Line up the trip tank to watch for flow above the closed BOP."}, {"n": 167, "c": "M", "q": "What should the casing pressure gauge read, after a successful 1st circulation of the Driller\u2019s Method? (Assume no trapped pressure or safety factor in the well)", "o": ["Greater than the original Shut-in Drillpipe Pressure (SIDPP)", "Greater than the original Shut-in Casing Pressure", "Equal to the original SIDPP", "Less than the original SIDPP"], "a": 2, "e": "After a successful first circulation, casing pressure equals the original SIDPP."}, {"n": 168, "c": "P", "q": "What changes in pump pressure will be seen after one complete circulation if the mud weight is increased?", "o": ["The pump pressure will decrease", "The pump pressure will stay the same", "The pump pressure will increase"], "a": 2, "e": "Higher mud weight increases pump pressure."}, {"n": 169, "c": "W", "q": "Which of the following would increase the risk of surging the well while running casing?", "o": ["Lower Casing grade", "Low gel strength mud", "Slower running speed", "Tighter casing to wellbore clearance"], "a": 3, "e": "Tighter casing-to-hole clearance increases surge risk."}, {"n": 170, "c": "M", "q": "Which method removes the influx from the hole before pumping the kill mud?", "o": ["Bullheading Method", "Driller's Method", "Volumetric Method", "Wait and Weight Method"], "a": 1, "e": "The Driller's Method removes the influx before kill mud is pumped."}, {"n": 171, "c": "W", "q": "A 500-foot long cement plug is set inside the casing shoe. All mud above the plug is to be displaced with brine. Mud density below the cement plug = 11.8 ppg. Brine = 8.6 ppg Top of cement plug = 8200 feet What is the pressure differential across the cement plug?", "o": ["1407 psi", "1447 psi", "1671 psi", "1364 psi"], "a": 2, "e": "Differential = (11.8 x 8,700 - 8.6 x 8,200) x 0.052 = 1,671 psi (pressure at plug base minus pressure at plug top).", "f": {"s": "A 500-foot long cement plug is set inside the casing shoe. All mud above the plug is to be displaced with brine.", "dt": [["Mud density below the cement plug", "11.8 ppg"], ["Brine", "8.6 ppg"], ["Top of cement plug", "8200 feet"]], "ask": "What is the pressure differential across the cement plug?"}}, {"n": 172, "c": "B", "q": "When running a slick non-shearable tool in the hole on a surface stack rig. The well flows when the tool is across the BOP stack. What is the safest/most conservative action the Driller can take?", "o": ["Pick up a joint or stand of shearable pipe and run into position", "Start circulating to use ECD to stop the kick", "Make up and close safety valve in string and close the annular", "Drop the string in the hole"], "a": 2, "e": "Make up and close the safety valve in the string, then close the annular."}, {"n": 173, "c": "M", "q": "During the second circulation of the Driller\u2019s method, the bit plugs as kill weight mud reaches the bit. The pumps are stopped and the well is shut-in. What should the casing pressure read at a minimum?", "o": ["Original SIDPP", "Original SICP", "The difference in hydrostatic pressure between KWM and OMW minus SICP", "The difference in hydrostatic pressure between KWM and OMW plus SICP"], "a": 0, "e": "Original SIDPP is the minimum casing pressure expected (keyed answer)."}, {"n": 174, "c": "O", "q": "What is a written record of strokes pumped, surface pressures, choke position, and other information useful for effective handover to a relief crew during a well kill operation?", "o": ["Kill Log", "Trip Sheet", "Drill pipe pressure schedule", "Pipe Tally"], "a": 0, "e": "A kill log records strokes, pressures and choke position for handover."}, {"n": 175, "c": "S", "q": "The well was shut in before the pumps were fully shut off trapping pressure in the well. What effect will this have on the wellbore?", "o": ["Bottom hole pressure will be higher, but Shoe pressure will be normal", "There will be no effect on downhole pressures", "All pressures in the well bore will be increased"], "a": 2, "e": "Trapped pressure raises all pressures in the wellbore."}, {"n": 176, "c": "M", "q": "Which of the following is a best practice when obtaining Slow Circulating Rate (SCR) pressures?", "o": ["Record pressure at the mud pump gauge", "Circulate with the bit inside the Casing Shoe", "Circulate at drilling rate through the Choke Manifold with a fully open choke", "Obtain SCRs for a minimum of two mud pumps"], "a": 3, "e": "Obtain SCRs for at least two mud pumps."}, {"n": 177, "c": "K", "q": "While pulling wireline tools out of the hole a gain in the trip tank has been observed. What has most likely occurred?", "o": ["The wireline operator has pumped a slug so the wireline can be pulled dry and save some clean up time", "The gain is from mud expansion due to the well being static for a long period of time while wirelining", "A swabbed-in influx may have occurred", "Nothing has occurred, it is normal to see a gain due to displacement when pulling wireline tools"], "a": 2, "e": "A gain while pulling wireline suggests a swabbed-in influx."}, {"n": 178, "c": "W", "q": "Which of the following is NOT a method of wellbore barrier verification?", "o": ["Positive pressure test", "Inflow test (Negative test)", "Leak off test", "Monitoring fluid level"], "a": 2, "e": "A leak-off test checks formation strength. It does not verify a barrier."}, {"n": 179, "c": "S", "q": "After shutting in on a kick, the pressures stabilize. The kill operation is delayed because of equipment problems and the Shut In Drill Pipe and Shut In Casing Pressures start increasing. Why is this happening?", "o": ["The mud in the hole is heating up and it is causing the volume to decrease", "The formation that kicked has a high permeability", "There is a non-return valve in the BHA", "The influx is gas and is migrating"], "a": 3, "e": "Rising shut-in pressures indicate gas migrating."}, {"n": 180, "c": "P", "q": "In a vertical hole, while drilling deeper, what happens to the maximum allowable volume of gas kick that can be taken on-bottom and circulated out without breaking down the formation? (Assume all other drilling and formation parameters stay the same)", "o": ["Increases", "Decreases", "Stays the same"], "a": 1, "e": "Deeper in the same hole, the maximum tolerable kick volume decreases."}, {"n": 181, "c": "P", "q": "In an exploratory (wildcat) well, how is the formation strength below the casing shoe normally measured?", "o": ["Sheen Test", "Leak Off Test", "BOP Test", "Formation Integrity Test"], "a": 1, "e": "Formation strength below the shoe in a wildcat well is normally measured by a leak-off test."}, {"n": 182, "c": "M", "q": "During a kill operation, which of the following problems may require the pump to be shut down quickly to prevent over-pressuring the formation?", "o": ["A washout in the choke", "A plugged choke", "A plugged standpipe", "A washout in the dril sure constant, then circulate the kill weight fluid to surface holding Drillpipe Pressure constant", "Circulate kill weight fluid to bit following a drillpipe pressure schedule, then circulate the kill weight fluid to surface holding Drillpipe Pressure constant", "Circulate kill weight fluid from surface to surface following a drillpipe pressure schedule"], "a": 2, "e": "Weight and Wait: kill mud to bit on a DP pressure schedule, then to surface at constant DP pressure."}, {"n": 187, "c": "K", "q": "While drilling ahead at a constant rate of penetration (ROP), the size and shape of the cuttings observed at the shakers significantly increases. What is the safest thing to do?", "o": ["Check for flow \u2013 if there is none, continue at the same ROP. Allow half of the mud returns to bypass the shakers", "Slow down the mud pump until the shakers can handle the amount of cuttings in the returns and continue drilling", "Check for flow \u2013 if there is none, continue drilling at the same ROP", "Check for flow \u2013 if there is none, circulate bottoms up to clean the hole"], "a": 3, "e": "Check for flow. If none, circulate bottoms-up to clean the hole."}, {"n": 188, "c": "M", "q": "Why is it critical to monitor the pit volume during a well control operation?", "o": ["To know when to adjust the drill pipe pressure", "To monitor the gas expansion and monitor for losses", "To keep the bottom hole pressure constant", "To know when to adjust the pump speed"], "a": 1, "e": "Pit volume is monitored to detect gas expansion and losses while circulating a kick.", "corr": 1}, {"n": 189, "c": "K", "q": "A reduction of Equivalent Circulating Density may be an indication that the well has become underbalanced. What Downhole tool would be the best choice to measure ECD while drilling?", "o": ["A rotary steerable tool", "An Adjustable Gauge Stabilizer (AGS) Tool", "A Pressure While Drilling (PWD) Tool", "Any \u201cMemory\u201d type tool"], "a": 2, "e": "A PWD tool measures ECD downhole
